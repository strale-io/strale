# smithery.yaml
# Local stdio transport (for npm/npx installation)
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      STRALE_API_KEY:
        type: string
        description: "Your Strale API key (signup at https://strale.dev/signup?src=smithery&utm_source=smithery&utm_medium=listing&utm_campaign=distribution-d0-d1). Optional — strale_search works without a key. Required for paid execution and wallet access."
  commandFunction:
    - node
    - packages/mcp-server/dist/server.js
  env:
    STRALE_API_KEY: "{{config.STRALE_API_KEY}}"

# Remote HTTP transport is also available at:
# https://api.strale.io/mcp?src=smithery
# Publish via Smithery URL-based publishing at smithery.ai/new
