slug: nordic-statistics
name: Nordic Statistics
description: Read curated national statistics tables from Statistics Sweden, Statistics Norway and Statistics Finland.
category: finance
cost_class: free_unlimited
quota_window: none
price_cents: 3
external_cost_cents: 0
is_free_tier: false
avg_latency_ms: 900
input_schema:
  type: object
  additionalProperties: false
  required:
    - office
    - table
    - filters
  properties:
    office:
      type: string
      enum:
        - SCB
        - SSB
        - STATFIN
    table:
      type: string
      minLength: 1
      description: A table id from the curated allowlist for the selected office.
    filters:
      type: object
      minProperties: 1
      propertyNames:
        pattern: ^[A-Za-z0-9_.-]{1,80}$
      additionalProperties:
        oneOf:
          - type: string
            minLength: 1
          - type: array
            minItems: 1
            maxItems: 50
            items:
              type: string
              minLength: 1
    since_period:
      type: string
      pattern: ^\d{4}(-Q[1-4]|-(0[1-9]|1[0-2]))?$
    until_period:
      type: string
      pattern: ^\d{4}(-Q[1-4]|-(0[1-9]|1[0-2]))?$
output_schema:
  type: object
  required:
    - office
    - table
    - label
    - updated
    - dimensions
    - observations
    - observation_count
    - source
    - licence_note
    - source_url
    - accessed_at
    - as_of
  properties:
    office:
      type: string
    table:
      type: string
    label:
      type: string
    updated:
      type:
        - string
        - "null"
    unit:
      type: string
    dimensions:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          label:
            type: string
          categories:
            type: array
            items:
              type: object
    observations:
      type: array
      items:
        type: object
        required:
          - period
          - value
        properties:
          period:
            type: string
          value:
            type:
              - number
              - "null"
        additionalProperties: true
    observation_count:
      type: integer
    source:
      type: string
    licence_note:
      type: string
    source_url:
      type: string
    accessed_at:
      type: string
      format: date
    as_of:
      type: string
data_source: SCB, SSB and Statistics Finland PxWeb APIs
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
geography: europe
maintenance_class: free-stable-api
gdpr_art_22_classification: data_lookup
processes_personal_data: false
data_access:
  lane: preferred
  acquisition_method: direct_api
  upstream_vendor: Statistics Sweden, Statistics Norway, Statistics Finland
