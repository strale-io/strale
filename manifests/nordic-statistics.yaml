        value: "07459"
      - field: label
        operator: not_null
        reliability: guaranteed
      - field: updated
        operator: not_null
        reliability: guaranteed
      - field: dimensions
        operator: not_null
        reliability: guaranteed
      - field: observations
        operator: not_null
        reliability: guaranteed
      - field: observation_count
        operator: not_null
        reliability: guaranteed
      - field: source
        operator: not_null
        reliability: guaranteed
      - field: licence_note
        operator: not_null
        reliability: guaranteed
      - field: source_url
        operator: not_null
        reliability: guaranteed
      - field: accessed_at
        operator: not_null
        reliability: guaranteed
      - field: as_of
        operator: not_null
        reliability: guaranteed
  health_check_input:
