    table: "07459"
    filters:
      Region: "0"
      ContentsCode: Personer1
      Tid: "2024"
output_field_reliability:
  office: guaranteed
  table: guaranteed
  label: guaranteed
  updated: common
  unit: common
  dimensions: guaranteed
  observations: guaranteed
  observation_count: guaranteed
  source: guaranteed
  licence_note: guaranteed
  source_url: guaranteed
  accessed_at: guaranteed
  as_of: guaranteed
limitations:
  - title: Curated tables only
    text: Only the listed macroeconomic tables are accepted; there is no table search or arbitrary table access.
    category: coverage
    severity: info
  - title: Published figures can be revised
    text: Each office may revise observations after retrieval; as_of records when Strale fetched the response.
    category: accuracy
    severity: info
  - title: Requests are capped
    text: No request may select more than 5
    000 Cartesian cells and no input may contain more than 50 filter values.: null
    category: coverage
    severity: warning
  - title: Licences and attribution differ
    text: >-
      SCB API data is CC0; SSB uses CC BY 4.0; Statistics Finland uses CC BY 4.0 with source table and material-date
      attribution.
    category: legal
    severity: warning
  - title: Labels vary by source
    text: English labels can be unavailable for some variables and are then returned as upstream codes.
    category: coverage
    severity: info
  - title: Not all Nordic countries are covered
    text: This capability covers Sweden Norway and Finland only; Denmark and Iceland are not covered.
    category: coverage
    severity: warning
