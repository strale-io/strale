slug: us-company-data-cobalt
name: US Company Data (Cobalt)
description: "Look up a US company in one state's Secretary of State records by company ID or name, with registration, officer and filing details where available."
category: company-data
cost_class: paid_prepaid
quota_window: none
price_cents: 200
is_free_tier: false
avg_latency_ms: 3000
input_schema:
  type: object
  required:
    - state
  properties:
    company_id:
      type: string
      description: SoS-issued business ID (registration number). Canonical input when known.
    company_name:
      type: string
      description: Optional fallback input — company name to search if no ID is known.
    state:
      type: string
      description: Required 2-letter US state code (e.g. "DE", "CA", "NY"). Cobalt routes per state.
output_schema:
  type: object
  example:
    found: true
    company_name: APPLE INC
    company_id: "C0806592"
    state: CA
    status: active
    entity_type: Corporation
    formed_date: "1977-01-03"
    address: "One Apple Park Way, Cupertino, CA 95014"
    registered_agent: CT CORPORATION SYSTEM
    officers: null
    filings: null
    sos_url: https://bizfileonline.sos.ca.gov/...
    data_source: Cobalt Intelligence (50-state SoS live)
  properties:
    found:
      type: boolean
    company_name:
      type:
        - string
        - "null"
    company_id:
      type:
        - string
        - "null"
    state:
      type: string
    status:
      type:
        - string
        - "null"
    entity_type:
      type:
        - string
        - "null"
    formed_date:
      type:
        - string
        - "null"
    address:
      type:
        - string
        - "null"
    registered_agent:
      type:
        - string
        - "null"
    officers:
      type:
        - array
        - "null"
      description: >-
        Officer roster when surfaced by the state's SoS feed; null when the
        feed does not carry officer data OR when found=false. Absent fields
        in a found=false envelope are not listed (data fields are dropped
        entirely on not-found).
    filings:
      type:
        - array
        - "null"
      description: >-
        Up to 25 most-recent filings when surfaced by the state's SoS feed;
        null when the feed does not carry filing data OR when found=false.
    sos_url:
      type:
        - string
        - "null"
    data_source:
      type: string
data_source: Cobalt Intelligence (50-state SoS live)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: commercial-stable-api
gdpr_art_22_classification: data_lookup
processes_personal_data: false
geography: us
test_fixtures:
  known_answer:
    input:
      company_name: "Apple Inc"
      state: "CA"
    expected_fields:
      - field: found
        operator: not_null
        reliability: guaranteed
      - field: state
        operator: equals
        reliability: guaranteed
        value: CA
      - field: data_source
        operator: not_null
        reliability: guaranteed
  health_check_input:
    company_name: "Apple Inc"
    state: "CA"
output_field_reliability:
  found: guaranteed
  state: guaranteed
  data_source: guaranteed
  company_name: common
  company_id: common
  status: common
  entity_type: common
  formed_date: common
  address: common
  registered_agent: common
  officers: rare
  filings: rare
  sos_url: rare
limitations:
  - title: State is required
    text: >-
      Each call searches one state’s Secretary of State registry; cross-state name search is not
      supported. Supply the state of incorporation, or search states separately when it is unknown,
      starting with Delaware, New York, California or Texas.
    category: coverage
    severity: info
  - title: Status definitions vary per state
    text: >-
      Each state's SoS uses its own status taxonomy (active / good standing / suspended / delinquent /
      forfeited / etc.). Status is surfaced verbatim from the SoS portal — interpret per state, not
      across states.
    category: accuracy
    severity: warning
  - title: Officer / filing depth varies per state
    text: >-
      Officer and filing coverage varies by state, from full officer lists and over ten years of
      filings to only a registered agent and incorporation event. Unavailable officer or filing fields
      are null rather than empty arrays, and `officers` and `filings` are absent when `found` is
      false.
    category: coverage
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: vendor_aggregation
  upstream_vendor: cobaltintelligence.com
  checks: pending
  checks_note: "Pending: Petter confirmed Cobalt's redistribution rights by email (docs/research/2026-04-28-us-business-data-vendor-longlist.md); not yet in vendor-terms.ts, and the rule's vendor conditions (no logins, vendor not sued over circumvention) are not recorded. The research row describes Cobalt as live Secretary of State scraping."
