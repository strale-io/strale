slug: company-status-check
name: "Company Status Check"
description: "Check whether a company is still registered and active in its official registry, with insolvency notices where an official source exists."
category: company-data
# Cost: every routed path is an identifier lookup against a free official
# registry (lib/company-status/routing.ts); none reaches an executor's paid
# name-resolution step. External cost per routed country is therefore 0 cents,
# so external_cost_cents is 0 (the maximum over all routed countries). It is a
# database column, not a manifest field. cost_class is free_quota because AU,
# HR and SE are quota-limited registries; quota_cap is the smallest of
# their daily caps (500, HR).
cost_class: free_quota
quota_window: daily
quota_cap: 500
price_cents: 8
is_free_tier: false
avg_latency_ms: 1200
# Classification and personal-data fields follow the most sensitive routed input: insolvency-check
# (GB) is screening_signal / sensitive_special, and sole-trader insolvency notices (BODACC natural
# persons) are personal financial data. The lookup itself returns what the registry says and no verdict.
gdpr_art_22_classification: screening_signal
input_schema:
  type: object
  required:
    - country
    - identifier
  properties:
    country:
      type: string
      description: ISO 3166-1 alpha-2 country code of the registry (UK is accepted as GB). The supported list is returned in the error for an unsupported code.
    identifier:
      type: string
      description: The company's identifier in that country's registry, for example 556703-7485 (SE), 00445790 (GB), 513174 (IE), 923609016 (NO), 0000028860 (PL) or 00177041 (CZ, mod-11 checksum required). Keep leading zeros for PL and CZ; send these identifiers as strings. The error for a malformed identifier says which format the country expects.
output_schema:
  type: object
  example:
    status: active
    registry_status_raw: active
    company_name: TESCO PLC
    registry:
      name: Companies House (UK Government)
      slug: uk-company-data
    identifier: "00445790"
    country: GB
    insolvency:
      checked: true
      source: Companies House insolvency register
      notices_found: 0
      notices: []
    as_of: "2026-10-26T12:00:00.000Z"
  properties:
    status:
      type: string
      enum:
        - active
        - inactive
        - dissolved
        - in_liquidation
        - in_insolvency
        - struck_off
        - unknown
    registry_status_raw:
      type:
        - string
        - "null"
    company_name:
      type:
        - string
        - "null"
    registry:
      type: object
    identifier:
      type: string
    country:
      type: string
    insolvency:
      type: object
    as_of:
      type: string
data_source: "Official company registries (see registry in the output) and, where listed, the national insolvency source"
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
processes_personal_data: true
personal_data_categories:
  - name
  - professional
  - financial
  - sensitive_special
geography: global
test_fixtures:
  known_answer:
    input:
      country: GB
      identifier: "00445790"
    expected_fields:
      - field: status
        operator: equals
        reliability: guaranteed
        value: active
      - field: company_name
        operator: not_null
        reliability: guaranteed
      - field: country
        operator: equals
        reliability: guaranteed
        value: GB
      - field: identifier
        operator: equals
        reliability: guaranteed
        value: "00445790"
      - field: registry
        operator: not_null
        reliability: guaranteed
      - field: insolvency
        operator: not_null
        reliability: guaranteed
      - field: as_of
        operator: not_null
        reliability: guaranteed
  health_check_input:
    country: GB
    identifier: "00445790"
output_field_reliability:
  status: guaranteed
  registry_status_raw: guaranteed
  company_name: guaranteed
  registry: guaranteed
  identifier: guaranteed
  country: guaranteed
  insolvency: guaranteed
  as_of: guaranteed
limitations:
  - title: Registry status is not trading status
    text: >-
      Active means registered and not wound up, including dormant companies. It does not show whether
      a company trades, employs staff or files accounts.
    category: coverage
    severity: warning
    workaround: Pair with a filing-date or accounts source where recent activity matters.
  - title: Registry vocabularies differ
    text: >-
      Registries use different status terms and do not all publish every state; the original value is
      returned in `registry_status_raw`. Unrecognised values return unknown status with the original
      value.
    category: coverage
    severity: info
    workaround: Read registry_status_raw when status is "unknown".
  - title: Countries covered
    text: >-
      Covers Austria (AT), Australia (AU), Czechia (CZ), Estonia (EE), Finland (FI), France (FR),
      United Kingdom (GB), Croatia (HR), Ireland (IE), Latvia (LV), Norway (NO), Poland (PL), Sweden
      (SE) and Singapore (SG). Excludes Belgium, Brazil, Canada, Switzerland, Germany, Spain, Greece,
      Japan, United States, Slovakia and Slovenia; unsupported inputs return an error listing
      supported countries.
    category: coverage
    severity: warning
    workaround: Check the official company registry directly for a country outside this list.
  - title: Lookup by registry identifier only
    text: >-
      Lookup requires the company’s national registry identifier and does not search by name. Sweden
      accepts organisation numbers only, not personal identity numbers.
    category: input
    severity: info
    workaround: Find the company’s registry identifier on an official company document or in the national registry.
  - title: Insolvency notice coverage varies by country
    text: >-
      Notices cover Companies House (GB), BODACC (FR), Norwegian bankruptcy and dissolution flags with
      dates where supplied, and Swedish pending proceedings, where open konkurs or likvidation also
      sets status; deletion alone in Norway is not insolvency, Czech registry insolvency still maps to
      in_insolvency, and sole-trader notices can contain personal financial data. Other countries, and
      Sweden when no proceeding is listed or the relevant record cannot be confirmed as loaded, return
      `checked` false; an empty GB, FR or NO notice list means only that the connected source lists
      none for this company.
    category: coverage
    severity: warning
    workaround: Check the national insolvency register directly for countries marked checked false.
  - title: One registry outage can pause all country checks
    text: >-
      A sustained registry outage or authentication failure can temporarily pause checks for every
      country. Unknown or malformed identifiers do not trigger this pause.
    category: reliability
    severity: warning
    workaround: Retry after a few minutes; the error names the registry that did not answer.
  - title: Freshness follows each registry
    text: >-
      Answers are fetched live, but registries update at their own pace: a closure or filing can appear days after it
      takes effect. The IE and LV sources are open-data datasets refreshed daily.
    category: freshness
    severity: info
    workaround: Use as_of for when the lookup ran and the registry's own date fields for when the status changed.
  - title: BODACC window
    text: >-
      For France only the 100 most recent BODACC announcements for the company are read. A company with more
      announcements than that returns a window_note, and older notices are not listed.
    category: coverage
    severity: info
    workaround: Query BODACC directly for the full history.

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
# Every routed registry and insolvency source is on the preferred lane with a
# direct API; company-status-routing.test.ts fails if a routed source is
# weaker than this block, so the composite never claims more than its inputs.
data_access:
  lane: preferred
  acquisition_method: direct_api
