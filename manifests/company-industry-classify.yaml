slug: company-industry-classify
name: "Company Industry Classification"
description: "Classify a company's industry from its name, description or website. Returns SIC, NAICS and NACE codes with confidence levels."
category: data-processing
cost_class: paid_prepaid
quota_window: none
price_cents: 5
is_free_tier: false
input_schema:
  type: object
  properties:
    company_name:
      type: string
      description: Company name
    description:
      type: string
      description: Company description or business activity
output_schema:
  type: object
  properties:
    company_name:
      type: string
    primary_industry:
      type: string
    sector:
      type: string
    classifications:
      type: array
    confidence:
      type: string
data_source: Claude Haiku (AI classification against SIC/NAICS/NACE standards)
data_source_type: computed
transparency_tag: ai_generated
freshness_category: computed
maintenance_class: commercial-stable-api
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
processes_personal_data: false
geography: global
test_fixtures:
  known_answer:
    input:
      company_name: "Volvo"
      description: "Swedish automobile manufacturer"
    expected_fields:
      - field: classifications
        operator: not_null
        reliability: guaranteed
      - field: primary_industry
        operator: not_null
        reliability: guaranteed
  health_check_input:
    company_name: "Google"
    description: "Search engine and technology company"
output_field_reliability:
  company_name: guaranteed
  primary_industry: guaranteed
  sector: common
  classifications: guaranteed
  confidence: guaranteed
  description: common
limitations:
  - title: AI-based classification
    text: Suggested classifications may differ from official SIC or NAICS assignments by government agencies.
    category: accuracy
    severity: info
  - title: Requires company description for best results
    text: Name-only classification is less accurate — provide a description for reliable results
    category: accuracy
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: not_applicable
  acquisition_method: computed
