# Auto-generated from database on 2026-03-17
# Review and adjust before using as onboarding template

slug: norwegian-company-data
name: "Norwegian Company Data"
description: "Look up a Norwegian company in the Brønnøysund Register Centre by its 9-digit organisation number or name."
category: data-extraction
cost_class: paid_prepaid
quota_window: none
price_cents: 5
is_free_tier: false
input_schema:
  type: object
  # No field is individually required: an org number OR a company name is
  # enough, and the executor enforces that ("at least one of") itself with a
  # message naming every accepted alias. Listing org_number as `required` made
  # the ROUTE reject {"company_name": "Telenor"} with
  # "Missing required input fields: org_number" before the executor ever ran —
  # so the capability's own name-resolution path was unreachable from the API
  # even after the executor was fixed. Danish and Finnish already use required: [].
  required: []
  properties:
    org_number:
      type: string
      description: Norwegian org number, 9 digits (e.g. 923609016)
    company_name:
      type: string
      description: >-
        Company name (e.g. "Telenor"). Resolved against Brønnøysundregistrene and
        accepted only on a confident name match — an ambiguous name is refused
        rather than resolved to the wrong legal entity.
    company_number:
      type: string
      description: Alias for org_number
    name:
      type: string
      description: Alias for company_name
    query:
      type: string
      description: Free-text alias — org number or company name
    task:
      type: string
      description: Free-text alias — org number or company name
  # anyOf makes "at least one identifying field" visible to callers and lets
  # the route reject {} before billing, instead of billing-then-erroring.
  anyOf:
    - required: [org_number]
    - required: [company_number]
    - required: [company_name]
    - required: [name]
    - required: [query]
    - required: [task]
output_schema:
  type: object
  example:
    status: active
    address: Forusbeen 50, 4035 STAVANGER, Norge
    org_number: "923609016"
    company_name: EQUINOR ASA
    business_type: Allmennaksjeselskap
    industry_code: "06.100"
    employee_count: 21412
    registration_date: "1995-03-12"
    industry_description: Utvinning av råolje
  properties:
    ubo_availability:
      type: string
    ubo_availability_reason:
      type: string
    status:
      type: string
      enum: ["active", "bankrupt", "dissolving", "compulsory_dissolution", "deleted"]
    address:
      type: string
    org_number:
      type: string
    company_name:
      type: string
    business_type:
      type: string
    industry_code:
      type:
        - string
        - "null"
    industry_description:
      type:
        - string
        - "null"
    employee_count:
      type:
        - integer
        - "null"
    registration_date:
      type:
        - string
        - "null"
    vat_number:
      type:
        - string
        - "null"
    legal_representatives:
      type: array
      description: >-
        Active legal representatives (board members, managing director, signatories, procurists) from
        the Brreg /roller endpoint. Strale canonical shape: {type, name, role, role_code, role_group,
        date_of_birth}. role_group is the Brreg rollegruppe code (STYR, DAGL, SIGN, PROK, KOMP, KONT,
        etc.); role_code is the per-member rolletype code (LEDE, NEST, MEDL, VARA, OBS for STYR; same
        as the group for single-role groups). Resigned / deregistered roles (fratraadt, avregistrert)
        are filtered out. Anonymous endpoint — name + birth date only, fnr not exposed.
    total_legal_representatives:
      type: integer
    tier_2_available:
      type: boolean
    tier_2_available_reason:
      type: string
data_source: Brønnøysund Register Centre (Norway)
data_source_type: api
transparency_tag: mixed
freshness_category: live-fetch
maintenance_class: free-stable-api
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
processes_personal_data: true
personal_data_categories:
  - name
  - address
  - professional
geography: nordic
test_fixtures:
  # known_answer is array-form: one fixture per entry point, satisfying
  # Gate 5's PRIMARY (org_number) + SECONDARY (company_name) requirement
  # (DEC-20260411-B, gate5-path-coverage.ts). Both entries verified live
  # against Brreg 2026-08-14 — company_name "Equinor" and org_number
  # "923609016" both resolve to EQUINOR ASA.
  known_answer:
    - input:
        company_name: Equinor
      expected_fields:
        - field: company_name
          operator: contains
          reliability: guaranteed
          value: EQUINOR
        - field: org_number
          operator: equals
          reliability: guaranteed
          value: "923609016"
    - input:
        org_number: "923609016"
      expected_fields:
        - field: org_number
          operator: equals
          reliability: guaranteed
          value: "923609016"
        - field: company_name
          operator: contains
          reliability: guaranteed
          value: EQUINOR
  health_check_input:
    org_number: "923609016"
output_field_reliability:
  status: guaranteed
  address: common
  org_number: guaranteed
  company_name: guaranteed
  business_type: common
  industry_code: common
  industry_description: common
  employee_count: common
  registration_date: common
  # Active roles exist for the overwhelming majority of registered AS/ASA/SA entities;
  # rare exceptions (newly-registered shells, mid-restructuring records) can return
  # an empty array. Marked common so the schema gate doesn't trip on the empty case.
  legal_representatives: common
  total_legal_representatives: guaranteed
  tier_2_available: guaranteed
  tier_2_available_reason: guaranteed
  ubo_availability: guaranteed
  ubo_availability_reason: guaranteed
limitations:
  - title: Official registry data access
    text: "Data comes from the official registry's public API under its open-data terms (https://www.brreg.no/en/use-of-data-from-the-bronnoysund-register-centre/datasets-and-api/); results carry the registry as their source."
    category: coverage
    severity: info
  - title: Registry status interpretation
    text: "Status uses deleted-unit tombstones before bankruptcy, compulsory dissolution and voluntary dissolution flags. Deleted records may lack live-unit details."
    category: coverage
    severity: info
  - title: Sole proprietorships are not covered
    text: Does not cover sole proprietorships (enkeltpersonforetak), which account for about 15% of Norwegian businesses.
    category: coverage
    severity: info
    workaround: Query Brønnøysundregistrene (brreg.no) directly for enkeltpersonforetak using the person's national ID
  - title: Financial figures can be up to 12 months old
    text: Financial data from annual reports — can be up to 12 months old
    category: freshness
    severity: info
    workaround: Check the report_date field and query Brønnøysundregistrene's regnskapsregisteret for the latest filing

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: preferred
  acquisition_method: direct_api
  upstream_vendor: Brønnøysundregistrene
