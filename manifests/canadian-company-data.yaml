    # normalizes to "shopify") followed by the official JSON API.
    - input:
        company_name: Shopify
      expected_fields:
        - field: company_name
          operator: contains
          reliability: guaranteed
          value: SHOPIFY
        - field: corporation_number
          operator: equals
          reliability: guaranteed
          value: "4261607"
        - field: status
          operator: equals
          reliability: guaranteed
