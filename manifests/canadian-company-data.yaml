  # wrong-company class fix, 2026-08-14.
  match_confidence: rare
limitations:
  - title: Provincial company coverage is limited
    text: Covers federally incorporated companies — provincially registered businesses may have limited information
    category: coverage
    severity: info
    workaround: For provincial companies, supplement with the relevant provincial registry (e.g., Ontario ONBIS, BC Registry)
  - title: Named directors are not included
    text: >-
      Director names are not included. `director_limits` gives the minimum and maximum permitted by
      the articles, rather than the current number of directors.
    category: coverage
    severity: info
    workaround: Order a corporate profile from Corporations Canada, or check the corporation's own filings
  - title: Name and number lookups use different methods
    text: >-
      Corporation-number and business-number lookups read the official API directly. Name lookups
      extract results from the Corporations Canada website using AI and can return less precise
      fields.
    category: accuracy
    severity: info
    workaround: Provide the corporation number for a fully algorithmic answer
  - title: Name history can be incomplete
    text: >-
      `name_history` can contain only the current name even when the registry’s activity history
      records a name change. An empty list does not prove that the company has never been renamed.
    category: coverage
    severity: info
    workaround: Check the corporation's activity history on Corporations Canada for name-change events
  - title: API responses are limited to 4 MiB
    text: >-
      API response bodies above 4 MiB are refused during download rather than parsed.
    category: coverage
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: preferred
  acquisition_method: direct_api
