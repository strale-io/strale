slug: business-day-check
name: "Business Day Check"
description: "Check whether a date is a business day in a country, counting weekends and public holidays. Returns the next business day when it is not."
category: validation
cost_class: free_unlimited
quota_window: none
price_cents: 2
is_free_tier: false
input_schema:
  type: object
  required:
    - date
    - country_code
  properties:
    date:
      type: string
      description: Date to check (YYYY-MM-DD)
    country_code:
      type: string
      description: ISO 2-letter country code
output_schema:
  type: object
  properties:
    is_business_day:
      type: boolean
    reason:
      type: string
    next_business_day:
      type: string
    previous_business_day:
      type: string
data_source: Strale calendar engine + Nager.Date API
data_source_type: computed
transparency_tag: algorithmic
freshness_category: reference-data
maintenance_class: pure-computation
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
processes_personal_data: false
geography: global
test_fixtures:
  known_answer:
    input:
      date: "2025-12-25"
      country_code: "SE"
    expected_fields:
      - field: is_business_day
        operator: equals
        value: false
        reliability: guaranteed
      - field: next_business_day
        operator: not_null
        reliability: guaranteed
  health_check_input:
    date: "2025-12-25"
    country_code: "SE"
output_field_reliability:
  date: guaranteed
  country_code: guaranteed
  is_business_day: guaranteed
  reason: common
  next_business_day: guaranteed
  previous_business_day: guaranteed
limitations:
  - title: Weekend definition varies by country
    text: Uses Sat-Sun weekends for most countries and Fri-Sat for some Middle Eastern, North African and South Asian countries (for example Bahrain, Algeria and Bangladesh); some Fri-Sat rows are marked unverified in the code. Countries without a holiday calendar, such as Israel, Iran and Nepal, are refused whatever their weekend (see below).
    category: accuracy
    severity: info
  - title: Regional holidays count for the whole country
    text: >-
      Public and bank holidays count as days off; school, government-office, optional and observance days listed in the
      holiday data do not. A public or bank holiday kept only in some states or regions (for example Corpus Christi in parts
      of Germany, or Good Friday in some US states) is counted for the whole country, so the answer is "not a business day"
      everywhere in that country on that date. There is no region input yet.
    category: accuracy
    severity: warning
  - title: Holiday data from Nager.Date
    text: >-
      Depends on the Nager.Date API for holiday data. If the API is unreachable, rate-limited or returns an
      unreadable answer, the call fails and is not charged. A country Nager.Date holds no holiday calendar for (for example
      Thailand, the United Arab Emirates and Saudi Arabia) and a code it does not recognise are refused and not charged,
      because weekends alone cannot say whether a day is a business day. Nager.Date covers about 50 years either side of the
      current year; a date outside that window, or within about two weeks of either end of it, is refused and not charged.
    category: dependency
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: vendor_api
  upstream_vendor: nager-date
  checks: pending
