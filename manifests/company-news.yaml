slug: company-news
name: "Company News"
description: "Search news about a company in 100+ languages, updated every 15 minutes. Returns recent articles with source, date and sentiment."
category: company-data
cost_class: free_quota
quota_window: daily
quota_cap: 720
known_rate_limit:
  value: 12
  unit: per_minute
  source_url: https://blog.gdeltproject.org/ukraine-api-rate-limiting-web-ngrams-3-0/
price_cents: 5
data_source: GDELT Project
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
avg_latency_ms: 800
maintenance_class: free-stable-api
input_schema:
  type: object
  properties:
    company_name:
      type: string
      description: Company name to search for
    country:
      type: string
      description: Filter by source country (ISO 2-letter code)
    timespan:
      type: string
      description: "Time window: 1d, 3d, 7d, 14d, or 30d (default 7d)"
    max_articles:
      type: number
      description: Maximum articles to return (default 10, max 25)
  required: []
output_schema:
  type: object
  properties:
    company_name:
      type: string
    articles_found:
      type: number
    sentiment_summary:
      type: object
    articles:
      type: array
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
processes_personal_data: false
geography: global
test_fixtures:
  known_answer:
    input:
      company_name: Apple Inc
    expected_fields:
      - field: company_name
        operator: not_null
        reliability: guaranteed
      - field: timespan
        operator: equals
        reliability: guaranteed
        value: 7d
      - field: articles_found
        operator: not_null
        reliability: guaranteed
      - field: articles
        operator: not_null
        reliability: guaranteed
  health_check_input:
    company_name: Apple Inc
output_field_reliability:
  company_name: guaranteed
  timespan: guaranteed
  articles_found: guaranteed
  sentiment_summary: common
  articles: guaranteed
limitations:
  - title: Rolling time window
    text: >-
      GDELT provides news from the last 30 days maximum. Historical news beyond this window is not available through
      this capability.
    category: coverage
    severity: info
  - title: Company name matching
    text: >-
      Uses exact phrase matching, so short or generic company names can return unrelated articles. Use
      the full legal name for a more specific search.
    category: accuracy
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: vendor_api
  upstream_vendor: gdelt
  checks: pending
