slug: skill-extract
name: Skill Extract
description: >-
  Extract skills from job descriptions or CVs. Categorizes 500+ skills into technical, soft skills, tools,
  certifications, languages.
category: data-extraction
cost_class: free_unlimited
quota_window: none
price_cents: 3
is_free_tier: false
input_schema:
  type: object
  required:
    - text
  properties:
    text:
      type: string
      description: Job description or CV text
output_schema:
  type: object
  example:
    tools: []
    languages: []
    soft_skills: []
    certifications: []
    technical_skills: []
    seniority_signals: []
    total_skills_found: 0
    experience_levels_mentioned: []
  properties:
    technical_skills:
      type: array
    soft_skills:
      type: array
    tools:
      type: array
    certifications:
      type: array
    languages:
      type: array
    experience_levels_mentioned:
      type: array
    seniority_signals:
      type: array
    total_skills_found:
      type: integer
data_source: Algorithmic (skill taxonomy matching from text, no external data)
data_source_type: computed
transparency_tag: algorithmic
freshness_category: computed
maintenance_class: commercial-stable-api
processes_personal_data: true
personal_data_categories:
  - professional
geography: global
test_fixtures:
  known_answer:
    input:
      text: >-
        Senior backend engineer with 6 years building Python and TypeScript services on AWS and Kubernetes. Day-to-day
        tools are Docker, Git and Terraform. AWS Certified Solutions Architect. Known for clear written communication
        and mentoring juniors. Fluent in Swedish and English.
    expected_fields:
      - field: tools
        operator: not_null
        reliability: guaranteed
      - field: tools
        operator: type
        reliability: guaranteed
        value: array
      - field: languages
        operator: not_null
        reliability: guaranteed
      - field: languages
        operator: type
        reliability: guaranteed
        value: array
      - field: soft_skills
        operator: not_null
        reliability: guaranteed
      - field: soft_skills
        operator: type
        reliability: guaranteed
        value: array
      - field: certifications
        operator: not_null
        reliability: guaranteed
      - field: certifications
        operator: type
        reliability: guaranteed
        value: array
  health_check_input:
    text: >-
      Senior backend engineer with 6 years building Python and TypeScript services on AWS and Kubernetes. Day-to-day
      tools are Docker, Git and Terraform. AWS Certified Solutions Architect. Known for clear written communication and
      mentoring juniors. Fluent in Swedish and English.
output_field_reliability:
  technical_skills: guaranteed
  languages: guaranteed
  total_skills_found: guaranteed
  soft_skills: common
  tools: common
  certifications: common
  experience_levels_mentioned: common
  seniority_signals: common
limitations:
  - title: AI skill extraction may categorize competencies differently than industry taxonomies like ESCO or O*NET
    text: >-
      AI-powered skill extraction — may categorize broad competencies differently than specific industry taxonomies
      (e.g., ESCO, O*NET)
    category: accuracy
    severity: info
    workaround: Map extracted skills to your target taxonomy (ESCO, O*NET) as a post-processing step for HR system integration
