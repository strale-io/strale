slug: company-fundamentals
name: Company Fundamentals
description: "Read available annual financial metrics from a US domestic company's SEC 10-K filings, with source concepts and filing references."
category: financial
cost_class: free_quota
quota_window: daily
quota_cap: 10000
known_rate_limit:
  value: 10
  unit: per_second
  source_url: https://www.sec.gov/os/webmaster-faq#developers
price_cents: 10
avg_latency_ms: 2350
is_free_tier: false
input_schema:
  type: object
  properties:
    ticker:
      type: string
      description: Exchange ticker such as AAPL. One of ticker or cik is required.
    cik:
      type: string
      description: SEC Central Index Key such as 320193. One of ticker or cik is required.
output_schema:
  type: object
  example:
    cik: "0000320193"
    ticker: AAPL
    entity_name: Apple Inc.
    latest_period_end: "2025-09-27"
    fundamentals:
      revenue:
        label: Revenue
        value: 416161000000
        unit: USD
        concept: RevenueFromContractWithCustomerExcludingAssessedTax
        fiscal_year: 2025
        period_start: "2024-09-29"
        period_end: "2025-09-27"
        form: 10-K
        filed: "2025-10-31"
        accession: 0000320193-25-000079
    metrics_unavailable: []
    source_url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000320193&type=10-K
  properties:
    cik:
      type: string
    ticker:
      type: string
    entity_name:
      type: string
    latest_period_end:
      type: string
    fundamentals:
      type: object
    metrics_unavailable:
      type: array
    source_url:
      type: string
data_source: SEC XBRL company-concept API (EDGAR financial statement data)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
processes_personal_data: false
geography: us
test_fixtures:
  known_answer:
    input:
      ticker: AAPL
    expected_fields:
      - field: cik
        operator: equals
        reliability: guaranteed
        value: "0000320193"
      - field: entity_name
        operator: type
        reliability: common
        value: string
      - field: fundamentals
        operator: not_null
        reliability: guaranteed
      - field: source_url
        operator: not_null
        reliability: guaranteed
      - field: metrics_unavailable
        operator: type
        reliability: guaranteed
        value: array
  health_check_input:
    ticker: AAPL
output_field_reliability:
  cik: guaranteed
  fundamentals: guaranteed
  metrics_unavailable: guaranteed
  source_url: guaranteed
  entity_name: common
  latest_period_end: common
  ticker: common
limitations:
  - title: SEC 10-K filers only
    text: >-
      Covers US domestic registrants that file a 10-K. Foreign private issuers filing 20-F or 40-F,
      private companies, funds and trusts are not covered, and neither is any non-US listing.
    category: coverage
    severity: warning
  - title: As-reported XBRL, not normalised financials
    text: >-
      Values use the XBRL concept tags selected by each filer, identified in `concept`. Different
      companies can tag equivalent figures differently, so comparisons may require normalisation.
    category: accuracy
    severity: warning
  - title: Latest annual period only
    text: >-
      Returns one value per metric from the latest fiscal year reported on a 10-K, using the latest
      filed value when restated. Historical periods, quarters and trends are not included.
    category: coverage
    severity: info
  - title: Metrics a filer does not tag come back null
    text: >-
      A metric is null when none of the supported XBRL tags matches the filer’s report. Its key is
      listed in `metrics_unavailable`.
    category: coverage
    severity: info
  - title: SEC request limits add lookup time
    text: >-
      Each lookup makes 9–13 SEC requests, subject to a shared limit of roughly 10 requests per second
      across concurrent calls. Typical lookup time is about 2.3 seconds, including about 1.5 seconds
      of waiting, and can increase when more alternative tags need checking.
    category: performance
    severity: info
  - title: Metric periods can differ within one response
    text: >-
      Each metric carries its own period_end. A filer that restates one line and not another can
      leave two metrics covering different periods, so latest_period_end is the newest across the
      set rather than a period every figure shares.
    category: accuracy
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: preferred
  acquisition_method: direct_api
