limitations:
  - title: >-
      Non-standard directives may not be interpreted
    text: >-
      Parses standard robots.txt directives — non-standard extensions (e.g., Crawl-delay, custom directives) may be
      reported but not interpreted
    category: coverage
    severity: info
    workaround: Check the raw text in the response for non-standard directives that may affect your specific crawler
  - title: Only the first 500 KiB of robots.txt is parsed
    text: >-
      Only the first 500 KiB of robots.txt is parsed. Directives beyond that limit do not appear in
      the result.
    category: coverage
    severity: info
  - title: A page that is not a robots.txt reads as no robots.txt
    text: >-
      A site that answers /robots.txt with 200 and an HTML page, or with text that has no robots.txt
      directive (a JSON error, a plain "Not found"), is reported as exists false, the same answer a
      404 gives. A file that is empty or holds only comments is reported as existing with no rules.
    category: accuracy
    severity: info

