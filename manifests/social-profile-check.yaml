limitations:
  - title: Developer registries only — no social platforms or personal profiles
    text: >-
      Checks npm packages, PyPI projects and GitHub organisations through their official APIs. Social platforms and
      personal profiles (TikTok, Reddit, YouTube, Pinterest, personal GitHub, npm or PyPI accounts) are not probed:
      Strale's data-access rule rules out harvesting profiles of people, and those platforms restrict automated access
      outside their own APIs.
    category: coverage
    severity: info
    workaround: >-
      To check a social handle, use that platform's official API, or ask the account owner to confirm it.
  - title: "Data access: preferred lane (official registry APIs)"
    text: >-
      DEC-20261023-A lane: preferred. Each registry is read through its own documented public API — the npm registry
      (registry.npmjs.org), PyPI's JSON API (pypi.org/pypi/<name>/json) and the GitHub REST API (api.github.com/orgs) —
      one request per registry per call, with an honest StraleBot user agent, reading only the HTTP status. No page is
      scraped and no personal account is looked up. Terms of each API (docs.npmjs.com/policies/open-source-terms,
      pypi.org/policy/terms-of-use, docs.github.com/site-policy/github-terms) were not re-read in the 2026-10-24
      session, whose network policy blocked them; re-verify before any change of use.
    category: coverage
    severity: info
  - title: A missing GitHub organisation does not mean the name is free
    text: >-
      GitHub organisations and personal accounts share one namespace. A 404 from the organisations API means no
      organisation has the name; a personal account may still hold it, so GitHub is never listed in
      available_platforms.
    category: accuracy
    severity: info
    workaround: Try registering the organisation on GitHub to confirm availability.
  - title: "\"Available\" means not found, not guaranteed registrable"
    text: >-
      A 404 means the registry has no package, project or organisation by that name. Registration can still be refused:
      npm rejects names that differ from an existing package only by punctuation or case, and PyPI blocks prohibited
      names and names too similar to an existing project, and returns 404 for some registered projects with no releases.
    category: accuracy
    severity: info
    workaround: Confirm by attempting the registration before relying on the name.
  - title: Rate limits and refusals are reported as unknown
    text: >-
      When a registry rate-limits or refuses the request (HTTP 401/403/429) or cannot be reached, that registry's
      entry has exists null and a note, and is counted in unknown_count rather than treated as available.
    category: availability
    severity: info
    workaround: Retry later for the registries reported as unknown.
