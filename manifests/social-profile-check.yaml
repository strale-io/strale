slug: social-profile-check
name: Developer Registry Name Check
description: "Check whether a name is taken as an npm package, a PyPI project or a GitHub organisation, via each registry's official API."
category: data-extraction
cost_class: free_unlimited
quota_window: none
price_cents: 5
is_free_tier: false
input_schema:
  type: object
  required:
    - username
  properties:
    username:
      type: string
      description: "Package, project or organisation name to check (e.g. 'react', 'strale'). Company names are normalised: accents stripped, '&' becomes 'and', other punctuation and spaces become '-'. The same name is checked on every registry."
output_schema:
  type: object
  example:
    username: react
    profiles:
      - platform: npm
        kind: npm_package
        url: https://www.npmjs.com/package/react
        exists: true
        status_code: 200
      - platform: PyPI
        kind: pypi_project
        url: https://pypi.org/project/react/
        exists: false
        status_code: 404
      - platform: GitHub
        kind: github_organization
        url: https://github.com/react
        exists: false
        status_code: 404
    found_count: 1
    not_found_count: 2
    unknown_count: 0
    available_platforms:
      - PyPI
  properties:
    username:
      type: string
    profiles:
      type: array
    found_count:
      type: number
    not_found_count:
      type: number
    unknown_count:
      type: number
    available_platforms:
      type: array
data_source: npm registry API, PyPI JSON API, GitHub REST API (organisations)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
# DEC-20261023-A (2026-10-24): package, project and organisation names only —
# personal profiles are no longer probed. Still true: callers may send a
# person's handle as input, and inputs are logged.
processes_personal_data: true
personal_data_categories:
  - name
geography: global
test_fixtures:
  known_answer:
    input:
      username: react
    expected_fields:
      - field: profiles
        operator: not_null
        reliability: guaranteed
  health_check_input:
    username: octocat
output_field_reliability:
  username: guaranteed
  profiles: guaranteed
  found_count: guaranteed
  not_found_count: guaranteed
  unknown_count: guaranteed
  available_platforms: guaranteed
limitations:
  - title: Developer registries only; no personal profiles
    text: >-
      Checks npm packages, PyPI projects and GitHub organisations through their official APIs. Social
      platforms and personal accounts, including personal GitHub, npm and PyPI profiles, are not
      checked.
    category: coverage
    severity: info
    workaround: >-
      To check a social handle, use that platform's official API, or ask the account owner to confirm it.
  - title: "Checks registry HTTP status only"
    text: >-
      Each call checks only HTTP status through the npm, PyPI and GitHub organisation APIs, with one
      request per registry. It does not inspect page content or look up personal accounts.
    category: coverage
    severity: info
  - title: A missing GitHub organisation does not mean the name is free
    text: >-
      GitHub organisations and personal accounts share one namespace. A 404 from the organisations API means no
      organisation has the name; a personal account may still hold it, so GitHub is never listed in
      available_platforms.
    category: accuracy
    severity: info
    workaround: Try registering the organisation on GitHub to confirm availability.
  - title: "\"Available\" means not found, not guaranteed registrable"
    text: >-
      A 404 means no package, project or organisation was found, but does not guarantee the name can
      be registered. npm and PyPI can reject prohibited or similar names, and PyPI can return 404 for
      registered projects without releases.
    category: accuracy
    severity: info
    workaround: Confirm by attempting the registration before relying on the name.
  - title: Rate limits and refusals are reported as unknown
    text: >-
      When a registry rate-limits or refuses the request (HTTP 401/403/429) or cannot be reached, that registry's
      entry has exists null and a note, and is counted in unknown_count rather than treated as available.
    category: availability
    severity: info
    workaround: Retry later for the registries reported as unknown.

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: preferred
  acquisition_method: direct_api
