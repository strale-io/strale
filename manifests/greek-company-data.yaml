slug: greek-company-data
name: "Greek Company Data"
description: "Look up a Greek company in GEMI by registry number or tax ID, including identity, status, address and directors where available."
category: data-extraction
cost_class: free_quota
quota_window: daily
quota_cap: 500
price_cents: 5
is_free_tier: false
input_schema:
  type: object
  properties:
    gemi_number:
      type: string
      description: Greek GEMI registry number (6-14 digits)
    afm:
      type: string
      description: Greek tax ID (AFM, 9 digits) — used as fallback when GEMI number is not known
output_schema:
  type: object
  properties:
    company_name:
      type: string
    org_number:
      type: string
      description: GEMI registry number
    vat_number:
      type: string
      description: VIES VAT number, format EL{AFM}
    afm:
      type: string
      description: Greek tax ID
    business_type:
      type: string
    address:
      type: string
    registration_date:
      type: string
    industry_code:
      type: string
    industry_description:
      type: string
    status:
      type: string
    directors:
      type: array
      items:
        type: string
    is_branch:
      type: boolean
data_source: GEMI Open Data API — Γενικό Εμπορικό Μητρώο (Greek Business Registry)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
processes_personal_data: true
personal_data_categories:
  - name
  - address
  - professional
geography: eu
test_fixtures:
  # Fixture is HELLENiQ ENERGY Holdings SA (parent SA, listed entity, formerly
  # Hellenic Petroleum SA). Swapped 2026-05-13 from the prior Lamia-region
  # National Bank of Greece branch (GEMI 000237954001) per the v1 Identity
  # coverage audit — branch records do not populate directors or industry_code,
  # so the prior fixture could not prove that a non-branch parent returns
  # directors + NACE. HELLENiQ exercises both. See
  # apps/api/docs/v1-identity-coverage-matrix-2026-05-13.md §3 + §5.
  known_answer:
    input:
      gemi_number: "296601000"
    expected_fields:
      - field: company_name
        operator: not_null
        reliability: guaranteed
      - field: org_number
        operator: equals
        reliability: guaranteed
        value: "296601000"
      - field: vat_number
        operator: equals
        reliability: guaranteed
        value: EL094049864
      - field: afm
        operator: equals
        reliability: guaranteed
        value: "094049864"
      - field: business_type
        operator: equals
        reliability: guaranteed
        value: ΑΕ
      - field: address
        operator: not_null
        reliability: guaranteed
      - field: registration_date
        operator: equals
        reliability: guaranteed
        value: "1975-07-19"
      - field: status
        operator: equals
        reliability: guaranteed
        value: active
      - field: directors
        operator: not_null
        reliability: guaranteed
      - field: industry_code
        operator: not_null
        reliability: guaranteed
      - field: is_branch
        operator: equals
        reliability: guaranteed
        value: false
  health_check_input:
    gemi_number: "296601000"
output_field_reliability:
  company_name: guaranteed
  org_number: guaranteed
  vat_number: common
  afm: common
  business_type: guaranteed
  address: common
  registration_date: common
  industry_code: common
  industry_description: common
  status: guaranteed
  directors: common
  is_branch: guaranteed
limitations:
  - title: Official registry data access
    text: "Data comes from the official registry's public API under its open-data terms (https://opendata.businessportal.gr/license/); results carry the registry as their source."
    category: coverage
    severity: info
  - title: Registry status interpretation
    text: "Known GEMI status descriptions map to active, inactive, dissolved, bankrupt or liquidation; unrecognised descriptions are preserved and missing descriptions return unknown. These mappings are not independently confirmed against live GEMI responses."
    category: coverage
    severity: info
  - title: GEMI rate limit is 8 requests per minute
    text: >-
      The GEMI Open Data API enforces a maximum of 8 requests per minute per API key. Requests exceeding this limit
      return HTTP 429.
    category: rate-limit
    severity: info
    workaround: Space requests to stay within 8 per minute.
  - title: AFM tax identifiers can be missing
    text: >-
      When AFM is missing the derived vat_number is null; vat-validate downstream steps will soft-fail for those
      entities.
    category: coverage
    severity: info
    workaround: Provide the AFM as input directly when known, or use a separate VAT validation source.
  - title: Branches and main entities are both returned by GEMI
    text: >-
      GEMI includes branch records (is_branch=true) alongside main-entity records. Some KYB use cases want the parent
      only.
    category: coverage
    severity: info
    workaround: Check the is_branch field before using the record as the principal counterparty.

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: preferred
  acquisition_method: direct_api
  upstream_vendor: GEMI Open Data
