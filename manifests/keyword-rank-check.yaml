slug: keyword-rank-check
name: "Keyword Rank Check"
description: "Find a domain in the top Google results for a keyword, scanning 10 results by default and up to 100. Lower-ranked domains can be missed."
category: data-extraction
cost_class: paid_prepaid
quota_window: none
price_cents: 15
is_free_tier: false
input_schema:
  type: object
  required:
    - domain
    - keyword
  properties:
    domain:
      type: string
      description: "Domain to check ranking for (e.g. stripe.com). Aliases: url, site."
    keyword:
      type: string
      description: "Search term to check ranking for. Aliases: query, search, term."
    country:
      type: string
      description: >-
        Market to check the ranking in, as an ISO 3166-1 alpha-2 code (SE), alpha-3 code (SWE), numeric code (752), or
        exact country name (Sweden). "UK" is accepted as an alias for GB. Unrecognised values are rejected before the
        search runs rather than silently ignored. Sent to Google as the gl parameter. Defaults to "us".
    language:
      type: string
      description: >-
        Language for results, as an ISO 639-1 code ("en"), optionally with a region ("pt-BR"). Validated for shape and
        rejected before the search runs if malformed, rather than silently ignored. Sent to Google as the hl parameter. Defaults to "en".
    depth:
      type: integer
      description: Number of results to scan (Serper "num" parameter). Defaults to 10, max 100.
output_schema:
  type: object
  example:
    domain: wikipedia.org
    keyword: wikipedia
    country: us
    language: en
    found: true
    position: 1
    page: 1
    url: https://en.wikipedia.org/wiki/Main_Page
    title: Wikipedia, the free encyclopedia
    snippet: >-
      Wikipedia is a free online encyclopedia, created and edited by volunteers around the world.
    results_scanned: 10
    scan_depth_requested: 10
    competitors_above: []
  properties:
    found:
      type: boolean
    position:
      type:
        - integer
        - "null"
    page:
      type:
        - integer
        - "null"
    competitors_above:
      type: array
    unresolved_positions:
      type: array
    breadcrumb_derived_positions:
      type: array
data_source: Serper.dev API (Google SERP, organic results)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: commercial-stable-api
avg_latency_ms: 2000
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
processes_personal_data: false
geography: global
test_fixtures:
  known_answer:
    input:
      domain: wikipedia.org
      keyword: wikipedia
      country: us
      language: en
    expected_fields:
      - field: found
        operator: not_null
        reliability: guaranteed
      - field: found
        operator: type
        reliability: guaranteed
        value: boolean
      - field: results_scanned
        operator: not_null
        reliability: guaranteed
      - field: results_scanned
        operator: type
        reliability: guaranteed
        value: number
      - field: scan_depth_requested
        operator: not_null
        reliability: guaranteed
  health_check_input:
    domain: wikipedia.org
    keyword: wikipedia
output_field_reliability:
  domain: guaranteed
  keyword: guaranteed
  country: guaranteed
  language: guaranteed
  found: guaranteed
  results_scanned: guaranteed
  scan_depth_requested: guaranteed
  competitors_above: guaranteed
  position: common
  page: common
  url: common
  title: common
  snippet: common
  # Google's `/goto` redirect wrapper (2026-10-30): links past the top
  # three come back opaque and are resolved through Serper's free
  # `/resolve`. These say what resolution could not open, so a caller
  # never has to read an absent link as an absent result.
  unresolved_positions: guaranteed
  breadcrumb_derived_positions: guaranteed

limitations:
  - title: Point-in-time sample, not an average
    text: >-
      Each call captures one Google results snapshot, and rankings vary with algorithm changes, time
      and personalisation absent from the API request. Repeat checks over time to assess trends rather
      than treating one result as a stable ranking.
    category: accuracy
    severity: info
    workaround: Call periodically (e.g. daily/weekly) and track position over time rather than relying on a single result.
  - title: Location is approximated by country/language, not exact geo
    text: >-
      Serper's gl/hl parameters approximate a country-level search context. They do not reproduce
      city-level local pack results or a specific searcher's true location, device, or
      personalisation/history, which can shift real-world rankings the caller sees.
    category: coverage
    severity: info
  - title: Scan depth is bounded and explicit
    text: >-
      Only the top `depth` results are searched, with a default of 10 and maximum of 100. A
      lower-ranked domain returns `found` false and `position` null, which does not mean it has no
      ranking.
    category: coverage
    severity: info
    workaround: Increase the depth parameter (up to 100) if the domain is expected to rank beyond position 10.

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: vendor_api
  upstream_vendor: serper
  checks: recorded
  checks_note: "Serper.dev (google.serper.dev) per-call search API. Serper confirmed in writing on 2026-10-27 that use as an upstream source within a value-added per-call API is permitted under its standard terms (DQ-39, accepted 2026-10-28; recorded in apps/api/src/lib/vendor-terms.ts). Results are processed into Strale's own schema, one search per request, never passed through as-is; Google's own rights are not granted by Serper."
