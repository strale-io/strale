limitations:
  - title: Interim register, published weekly
    text: >-
      Reads ESMA's interim MiCA register (the CASPS.csv file on ESMA's MiCA page). ESMA republishes it weekly from
      what national competent authorities report, so a very recent authorisation may not be listed yet. It is an
      interim file that ESMA plans to fold into its own IT systems; the source will then change.
    category: freshness
    severity: info
    workaround: null
  - title: Withdrawn authorisations stay listed
    text: >-
      ESMA keeps a withdrawn authorisation in the file with its withdrawal date. `authorized` is true only when a
      matching record has no withdrawal date or one still ahead; each match reports `authorization_end_date` and
      `authorization_in_force`. An end-date cell that is not a date counts as not in force.
    category: coverage
    severity: info
    workaround: null
  - title: Stale or unavailable register
    text: >-
      `register_last_updated` is the file's publication date. Past 45 days the answer carries `register_stale: true`
      and a note; past 120 days, or when ESMA cannot be read, the call fails (and is not charged) instead of
      answering from old data.
    category: availability
    severity: info
    workaround: null
  - title: Name matching
    text: >-
      Matches by LEI, then website, then a case-insensitive name contains on the legal and commercial name; at most
      three matches are returned. Prefer an LEI for an exact answer.
    category: coverage
    severity: info
    workaround: null

