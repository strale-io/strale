# Corrected 2026-08-16. The previous list declared `date`, `total` and
# `vendor` — three fields this capability has never returned. The executor's
# extraction schema names them `invoice_date`, `total_amount` and
# `vendor_name`, and returns eleven more besides. The fiction went unnoticed
# because all three were `common`, and common fields are type-checked rather
# than asserted non-null, so an absent field always passed.
#
# It stopped being harmless when a bundle tried to use the real fields:
# invoice-process maps $steps[0].iban and $steps[0].total_amount, both of
# which the capability genuinely returns, and the onboarding gate rejected the
# whole solution because the declaration did not know about them. That gate
# failure aborted every seed run since roughly 2026-04-12.
#
# Everything below is `common` rather than `guaranteed`: the extractor returns
# the full object shape on every call, but an LLM reading a real invoice
# routinely leaves individual fields null.
output_field_reliability:
  currency: common
  due_date: common
  subtotal: common
  vat_rate: common
  buyer_vat: common
  buyer_name: common
  vat_amount: common
  vendor_vat: common
  vendor_name: common
  invoice_date: common
  total_amount: common
  invoice_number: common
  payment_reference: common
  iban: common
  confidence: rare
  line_items: rare
limitations:
  - title: Best results with standard invoice layouts — handwritten or heavily stylized invoices have lower accuracy
    text: >-
      Best results with standard invoice layouts — handwritten invoices or heavily stylized designs may have lower
      accuracy
    category: coverage
    severity: info
    workaround: For non-standard formats, use pdf-extract for raw text and apply custom parsing rules
  - title: AI extraction from invoices means line item totals and tax calculations should be verified against source
    text: AI extraction from invoice documents — line item totals and tax calculations should be verified against source
    category: accuracy
    severity: warning
    workaround: Validate that extracted line items sum to the total amount and cross-check VAT calculations before booking
  - title: Input documents are limited to 8 MiB decoded
    text: >-
      Both url/pdf_url fetches and base64 payloads are refused above 8 MiB of decoded
      document bytes. Oversized input returns a caller_input refusal naming the field;
      no charge is taken. Shrink or split the document before submitting.
    category: coverage
    severity: info
