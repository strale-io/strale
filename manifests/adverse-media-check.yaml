output_field_reliability:
  query: guaranteed
  risk_level: guaranteed
  risk_level_thresholds: guaranteed
  total_hits: guaranteed
  categories: guaranteed
  categories_found: guaranteed
  severe_categories: guaranteed
  top_articles: guaranteed
  lists_queried: guaranteed
  source: guaranteed
  screened_at: guaranteed
  period: guaranteed
  fallback_reason: rare
limitations:
  - title: Language coverage is not fully documented
    text: >-
      Dilisense lists over 235,000 sources and explicitly names English, French and German coverage,
      but does not publish a breakdown by language. Coverage in other EU, UK, Norwegian and Swiss
      languages is not confirmed by its public documentation; relevant articles may be missing.
    category: coverage
    severity: warning
    workaround: For high-stakes screening of a non-DE/FR/EN payee, supplement with a native-language source check or accept residual risk explicitly.
  - title: Risk-level rule is heuristic, not regulatory
    text: >-
      `risk_level` uses total hits and severe-category counts, with thresholds in
      `risk_level_thresholds`; it is not a regulatory classification. A high level indicates dense
      severe-category coverage within 12 months and requires human review of the articles.
    category: accuracy
    severity: warning
    workaround: Always review top_articles for context before deciding to block a payment or onboard a counterparty.
  - title: Fallback results have lower coverage and accuracy
    text: >-
      If Dilisense is unavailable, Serper.dev supplies Google search results classified by keywords,
      with materially lower coverage and category accuracy. These responses identify serper in
      `source` and include `fallback_reason`.
    category: coverage
    severity: info
    workaround: Review fallback articles individually and supplement them with other sources for audit decisions.
  - title: Recency window is fixed at last 12 months
    text: Both paths filter to the last 12 months of articles. Older adverse coverage is not surfaced.
    category: freshness
    severity: info
  - title: Search requires the registered corporate name
    text: >-
      Brand names, branch names and added country suffixes can miss coverage indexed under the
      registered corporate name. The tool searches the name supplied without rewriting it; try the
      parent company name for branch-related coverage.
    category: accuracy
    severity: warning
    workaround: When total_hits=0 for a major entity, retry with the parent corporate name (drop country suffixes; drop consumer brand names in favour of the registered corporate name).
  - title: Coverage gap for some major regional bank failures
    text: >-
      Coverage varies by country and can miss major regional bank failures, including Banca Popolare
      di Vicenza under several name variants. Italian regional banking coverage may be weaker than UK,
      German, French and English-language coverage.
    category: coverage
    severity: warning
    workaround: For high-stakes Italian banking-counterparty screening, supplement with a native-source check.

