limitations:
  - title: No blocklist or threat-intelligence lookup
    text: The score comes only from the domain's DNS records (A, MX, SPF, DMARC), one HTTPS request for security headers, and name patterns such as suspicious TLDs. It does not consult blocklists, threat-intelligence feeds or domain age, so a high score does not mean the domain is safe.
    category: accuracy
    severity: warning
    workaround: For phishing or malware screening, combine this with a dedicated blocklist or threat-intelligence source; use whois-lookup for domain age
  - title: Computed live on every call
    text: Every call reads the domain's current DNS and HTTPS responses, so a fixed record shows at once, and a timeout or temporary DNS failure lowers the score for that call only.
    category: freshness
    severity: info
    workaround: If a result looks wrong for a domain that normally works, re-run the check before acting on the score

