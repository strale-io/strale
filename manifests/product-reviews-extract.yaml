limitations:
  - title: Some review sources are unsupported
    text: >-
      Trustpilot, Glassdoor and LinkedIn pages are not supported and return a policy error before the
      page is read. Repeating the same request does not return review data.
    category: coverage
    severity: warning
    workaround: >-
      Supply a first-party product page with publicly visible reviews.
  - title: Hidden or paginated reviews can be missed
    text: >-
      Extracts reviews visible on the product page — filtered/hidden reviews and reviews behind 'load more' may not be
      captured
    category: coverage
    severity: info
    workaround: Request the direct product review page URL rather than the main product page for more complete review coverage
  - title: Output size cap per call
    text: >-
      Structured output is limited to about 8000 output tokens per call; requests exceeding this limit
      are refused rather than returned truncated. Requests with large results can exceed this limit,
      and repeating the same request does not help.
    category: coverage
    severity: info
    workaround: Try a page with fewer reviews — this capability extracts up to ~10 recent reviews per call

