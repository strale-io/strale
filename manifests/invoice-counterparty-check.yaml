limitations:
  - title: Company screening only
    text: Supplier names are screened with entity_type company. A sole trader named as a person is not screened as an individual; individual screening requires a separate sanctions-check request with the appropriate entity type.
    category: coverage
    severity: warning
  - title: Tax coverage and freshness
    text: VIES confirms EU VAT registrations only; non-EU tax-id-validate checks cover format without checksums and cannot confirm registration. VAT evidence can be cached for 48 hours, with its source time in `checked_at`; stale fallback evidence is refused.
    category: coverage
    severity: warning
  - title: Registry coverage and identifier linkage
    text: Registry checks cover company-status-check countries, with tax-to-registry identifier mappings only for SE organisation VAT, FI and NO MVA; BE enterprise numbers have no covered registry, DK SE numbers can differ from CVR, and NL BTW differs from KVK, so other linkage remains unknown without name-based resolution. `company_id` is compared only where a mapping exists; no-record answers return `found` false, while registry errors do not block completed tax and sanctions checks.
    category: coverage
    severity: warning
  - title: Single screening vendor
    text: Dilisense name matches are potential matches rather than sanction-status findings, with no supplied match score, per-list version timestamp or country filtering; at most ten records per screened name are returned, `matches_truncated` flags the cap, and `potential_match_count` can count an entity more than once across names. Each screening preserves its name, name source, lists and time, while top-level name, lists and time describe only the first screening.
    category: accuracy
    severity: warning
  - title: Name normalisation and source order
    text: Registry names take precedence over VIES names, then invoice names, and both registry and VIES names are screened when they differ; comparison decodes XML entities, removes control/format characters, collapses spaces and ignores case, diacritics, punctuation and selected trailing legal forms, with recognised legal-form differences flagged separately. This comparison cannot prove identity, translate names, detect impersonation or establish bank ownership; `name_match` is not_available without a registered name.
    category: accuracy
    severity: warning
  - title: Evidence without a verdict
    text: Returns evidence without an overall verdict, risk level, recommendation or safe-to-pay conclusion; an active registry status means registered rather than trading. Billing occurs only after tax checks and all required sanctions checks complete, with invalid VAT treated as a completed check and incomplete required checks returning an unbilled error.
    category: coverage
    severity: info
  - title: Depends on registry, tax and screening availability
    text: This check depends on the availability and coverage of its underlying registry, VIES and sanctions sources. Source provenance is included in the response.
    category: coverage
    severity: warning
data_access:
