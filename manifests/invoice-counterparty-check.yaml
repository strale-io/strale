slug: invoice-counterparty-check
name: Invoice Counterparty Check
description: "Check a supplier's tax ID, official company status and sanctions screening before invoice payment, returning evidence for each check."
# invoice-verify-* solutions use compliance-verification, which the capability
# validator disallows. compliance is the supported screening category.
category: compliance
price_cents: 75
is_free_tier: false
cost_class: paid_prepaid
quota_window: none
# One Dilisense call (1 cent, the platform's conservative paid-vendor cost
# classification in runMigration0062_paidVendorCosts), plus VIES/tax format (0)
# and official identifier-only registry/insolvency calls (0). No LLM calls.
# This explicit estimate does not claim to know the private vendor agreement.
external_cost_cents: 1
avg_latency_ms: 2500
transparency_tag: algorithmic
freshness_category: live-fetch
gdpr_art_22_classification: screening_signal
maintenance_class: commercial-stable-api
data_source: VIES; tax-id-validate format rules; company-status-check official registries; Dilisense via sanctions-check
data_source_type: api
processes_personal_data: true
personal_data_categories: [name, professional, financial, sensitive_special]
geography: global
input_schema:
  type: object
  required: [tax_id]
  properties:
    tax_id:
      type: string
      description: EU VAT number including country prefix, or a national tax/company ID supported by tax-id-validate. Non-EU validation is format-only.
    country:
      type: string
      description: ISO 3166-1 alpha-2; required without a tax ID prefix and must agree with the prefix when supplied.
    company_id:
      type: string
      description: Registry identifier; overrides VAT-to-registry derivation. This supplied identifier is not independently linked to the VAT number.
    company_name:
      type: string
      description: Name printed on the invoice; compared as a string with a registered name and used for screening only if neither registry nor VIES supplies one.
output_schema:
  type: object
  required: [tax_id, registry_status, sanctions, checks_completed, checks_not_available, findings]
  properties:
    tax_id:
      type: object
      properties:
        status: {type: string, enum: [completed, not_available, error]}
        source: {type: string}
        reason: {type: string}
        valid: {type: boolean}
        verification: {type: string, enum: [vies, format_only]}
        tax_id: {type: string}
        country: {type: string}
        registered_name: {type: string}
        registered_address: {type: string}
        checked_at: {type: string, format: date-time}
    registry_status:
      type: object
      properties:
        status: {type: string, enum: [completed, not_available, error]}
        source: {type: string}
        reason: {type: string}
        company_status: {type: string, enum: [active, inactive, dissolved, in_liquidation, in_insolvency, struck_off, unknown]}
        registry_status_raw: {type: [string, 'null']}
        registered_name: {type: [string, 'null']}
        identifier: {type: string}
        identifier_source: {type: string, enum: [company_id, tax_id_mapping]}
        registry:
          type: object
          properties:
            name: {type: string}
            slug: {type: string}
        insolvency:
          type: object
          properties:
            checked: {type: boolean}
            reason: {type: string}
            source: {type: string}
            notices_found: {type: integer}
            notices:
              type: array
              items:
                type: object
                properties:
                  date: {type: [string, 'null']}
                  type: {type: string}
                  source_url: {type: [string, 'null']}
                  status: {type: string}
            window_note: {type: string}
        checked_at: {type: string, format: date-time}
    sanctions:
      type: object
      properties:
        status: {type: string, enum: [completed, not_available, error]}
        source: {type: string}
        reason: {type: string}
        screened_name: {type: string}
        name_source: {type: string, enum: [registry_status, tax_id, company_name]}
        potential_match_count: {type: integer}
        matches:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              entity_id: {type: string}
              datasets: {type: array, items: {type: string}}
              countries: {type: array, items: {type: string}}
              sanction_details: {type: array, items: {type: string}}
              last_updated_at: {type: [string, 'null']}
        matches_truncated: {type: boolean}
        lists_queried:
          type: object
          properties:
            collection: {type: string}
            source_count: {type: integer}
            major_lists: {type: array, items: {type: string}}
            freshness_note: {type: string}
            source_catalog_url: {type: string}
            version: {type: [string, 'null']}
            last_updated_at: {type: [string, 'null']}
        checked_at: {type: string, format: date-time}
    name_match:
      type: object
      properties:
        status: {type: string, enum: [completed, not_available, error]}
        source: {type: string}
        reason: {type: string}
        match: {type: string, enum: [exact, equivalent, different]}
        invoice_name: {type: string}
        registered_name: {type: string}
    checks_completed: {type: array, items: {type: string}}
    checks_not_available: {type: array, items: {type: string}}
    findings: {type: array, items: {type: string}}
test_fixtures:
  # Nokia Oyj: VIES valid and PRH active, checked live 2026-10-26.
  # Sanctions result intentionally not asserted zero: fuzzy results change.
  known_answer:
    input: {tax_id: FI01120389, company_name: Nokia Oyj}
    expected_fields:
      - {field: tax_id, operator: not_null, reliability: guaranteed}
      - {field: registry_status, operator: not_null, reliability: guaranteed}
      - {field: sanctions, operator: not_null, reliability: guaranteed}
      - {field: checks_completed, operator: not_null, reliability: guaranteed}
      - {field: checks_not_available, operator: not_null, reliability: guaranteed}
      - {field: findings, operator: not_null, reliability: guaranteed}
  health_check_input: {tax_id: FI01120389, company_name: Nokia Oyj}
