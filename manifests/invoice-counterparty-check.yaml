limitations:
  - title: Tax coverage and freshness
    text: VIES covers EU VAT numbers only here. Non-EU tax-id-validate checks are format-only; its current rules implement no checksums. Format validity is never registry confirmation. VAT answers may be cached for 48 hours; checked_at preserves the source timestamp. Stale fallback evidence is refused.
    category: coverage
    severity: warning
  - title: Registry coverage and identifier linkage
    text: Registry status is limited to company-status-check's supported countries and deterministic mappings for SE organisation VAT, FI and NO MVA. BE maps to an enterprise number but its registry is not covered. DK VAT can be an SE administrative-unit number rather than CVR, and NL BTW is not KVK. No name-based entity resolution is used. company_id is supplied evidence and is not independently linked to tax_id. Registry errors are reported without blocking a completed tax and sanctions check.
    category: coverage
    severity: warning
  - title: Single screening vendor
    text: Screening uses Dilisense through sanctions-check. Potential name matches are evidence, not a sanction-status assertion. The vendor returns no match score or per-list version timestamp; neither is fabricated. At most ten match records are returned; potential_match_count retains the full count and matches_truncated discloses the cap. country is passed to sanctions-check but its present Dilisense adapter does not filter the upstream query by country.
    category: accuracy
    severity: warning
  - title: Name normalisation and source order
    text: Registry name precedes VIES name, then the invoice name. Name equivalence removes case, diacritics, punctuation and selected trailing legal forms. It cannot establish entity identity, translate names, detect impersonation or compare bank ownership. Without a registered name, name_match is not_available.
    category: accuracy
    severity: warning
  - title: Evidence without a verdict
    text: By design there is no overall verdict, risk level, recommendation or safe-to-pay claim. Only successful tax and sanctions checks are billed; invalid VAT is a completed check, while incomplete required checks throw an unbilled structured error. Registry active means registered status, not trading activity.
    category: coverage
    severity: info
  - title: Existing upstream access conditions
    text: This composite adds no upstream or fetch path. It preserves the weakest underlying data-access lane and all source provenance. Official registries and VIES are reused through existing executors. Dilisense's existing allowed-with-checks lane remains pending because the reseller agreement is not signed; this build makes no stronger rights claim. Health probes retain the underlying unauthenticated zero-cost connectivity checks; the known-answer fixture is a paid functional test.
    category: coverage
    severity: warning
data_access:
  lane: allowed_with_checks
  acquisition_method: vendor_api
  upstream_vendor: dilisense
  checks: pending
  checks_note: Existing sanctions-check Dilisense arrangement; no new upstream or reseller-rights assertion. Runtime provenance preserves the weakest composed source lane.
