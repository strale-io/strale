slug: us-company-data
name: US Company Data
description: >-
  Look up US company data from SEC EDGAR. Accepts CIK number, ticker symbol, or fuzzy company name. Returns company
  name, CIK, SIC code, state, filings summary.
category: data-extraction
cost_class: paid_prepaid
quota_window: none
price_cents: 5
is_free_tier: false
input_schema:
  type: object
  required: []
  properties:
    company:
      type: string
      description: >-
        CIK number, ticker symbol, or company name. Resolution order: exact CIK match, then exact ticker
        match, then exact company-name match (both via the SEC ticker/title map — no LLM call), then a
        best-effort LLM name extraction + SEC full-text filing search as a last resort (gated by
        match_confidence / allow_low_confidence below).
    cik:
      type: string
      description: SEC CIK number. Alternate to 'company' — same resolution rules apply.
    company_name:
      type: string
      description: US company name. Alternate to 'company' — same resolution rules apply.
    ticker:
      type: string
      description: Stock ticker symbol. Alternate to 'company' — same resolution rules apply.
    allow_low_confidence:
      type: boolean
      description: >-
        If true, return the best-effort match even when the name could not be confidently resolved
        (match_confidence "low"). Default false — a low-confidence name lookup errors instead of returning
        a possibly-wrong company identity, so it can't silently feed downstream screening. Only relevant to
        the LLM+full-text-search fallback path; exact CIK/ticker/title-map resolutions are always
        match_confidence "exact" and are never gated by this flag.
  # Either/or contract: exactly one identifying field is needed. Same anyOf
  # pattern as tech-stack-detect / image-to-text so validateX402Input's
  # required-group branch names the alternatives precisely — without this,
  # `{ "allow_low_confidence": true }` alone would pass the generic
  # any-property-present check despite carrying no identifying field.
  anyOf:
    - required: [company]
    - required: [cik]
    - required: [company_name]
    - required: [ticker]
output_schema:
  type: object
  example:
    cik: "0001418121"
    ein: "261379210"
    sic: "6798"
    state: VA
    status: active
    ticker: APLE
    address: 814 EAST MAIN STREET, RICHMOND, VA, 23219
    exchange: NYSE
    entity_type: operating
    company_name: Apple Hospitality REIT, Inc.
    fiscal_year_end: "1231"
    sic_description: Real Estate Investment Trusts
    searched_name: null
    match_confidence: exact
    is_exact_match: true
    resolution_method: ticker
  properties:
    status:
      type:
        - string
        - "null"
    vat_number:
      type:
        - string
        - "null"
    cik:
      type: string
    state:
      type: string
    sic_code:
      type: string
    company_name:
      type: string
    fiscal_year_end:
      type: string
    searched_name:
      type:
        - string
        - "null"
      description: The company name that was resolved and searched; null when a CIK was supplied directly
    match_confidence:
      type: string
      enum:
        - exact
        - high
        - low
      description: Confidence that the returned entity is the one asked for. "low" means the name search may have matched a different filer that merely mentions the name
    is_exact_match:
      type: boolean
      description: True only when the resolved company name matches the queried name after normalization (or a CIK was supplied directly)
