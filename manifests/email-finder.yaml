slug: email-finder
name: Email Finder
description: "Currently unavailable. Suggest possible work email addresses from a person's name and company domain, with confidence estimates."
category: web-intelligence
search_tags:
  - find email
  - get email address
  - person email address
  - work email finder
  - guess email address
  - email address format
  - find someone's email
cost_class: free_unlimited
quota_window: none
price_cents: 5
input_schema:
  type: object
  required:
    - first_name
    - last_name
    - domain
  properties:
    first_name:
      type: string
      description: Person's first name
    last_name:
      type: string
      description: Person's last name
    name:
      type: string
      description: Alias — full name "First Last", split into first_name/last_name if those aren't given
    full_name:
      type: string
      description: Alias for name
    domain:
      type: string
      description: Company domain (e.g. stripe.com)
    company_domain:
      type: string
      description: Alias for domain
    website:
      type: string
      description: Alias for domain
    url:
      type: string
      description: Alias for domain — full URL, hostname is extracted
output_schema:
  type: object
  properties:
    domain:
      type: string
    accepts_email:
      type: boolean
    email_provider:
      type:
        - string
        - "null"
    first_name:
      type: string
    last_name:
      type: string
    best_candidate:
      type:
        - object
        - "null"
      properties:
        email:
          type: string
        pattern:
          type: string
        confidence:
          type: string
          enum:
            - high
            - medium
            - low
        basis:
          type: string
    candidates:
      type: array
      items:
        type: object
        properties:
          email:
            type: string
          pattern:
            type: string
          confidence:
            type: string
            enum:
              - high
              - medium
              - low
          basis:
            type: string
    evidence:
      type: object
      properties:
        published_addresses_found:
          type: array
        inferred_pattern:
          type:
            - string
            - "null"
        corroborating_count:
          type: integer
    disclaimer:
      type: string
data_source: DNS MX records + company's own public homepage/contact page (direct HTTP fetch, no vendor)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
avg_latency_ms: 1500
processes_personal_data: true
personal_data_categories:
  - name
  - email
gdpr_art_22_classification: data_lookup
geography: global
test_fixtures:
  known_answer:
    input:
      first_name: Jane
      last_name: Doe
      domain: stripe.com
    expected_fields:
      - field: domain
        operator: equals
        reliability: guaranteed
        value: stripe.com
      - field: accepts_email
        operator: equals
        reliability: guaranteed
        value: true
      - field: first_name
        operator: equals
        reliability: guaranteed
        value: Jane
      - field: last_name
        operator: equals
        reliability: guaranteed
        value: Doe
      - field: candidates
        operator: not_null
        reliability: guaranteed
      - field: evidence
        operator: not_null
        reliability: guaranteed
      - field: disclaimer
        operator: not_null
        reliability: guaranteed
  health_check_input:
    first_name: Jane
    last_name: Doe
    domain: stripe.com
output_field_reliability:
  domain: guaranteed
  accepts_email: guaranteed
  first_name: guaranteed
  last_name: guaranteed
  candidates: guaranteed
  disclaimer: guaranteed
  best_candidate: common
  email_provider: common
  evidence: guaranteed
limitations:
  - title: Addresses are inferred; mailboxes are not verified
    text: >-
      Returned addresses are pattern-based guesses ranked by public evidence, with no SMTP callback,
      VRFY or RCPT-TO mailbox check. Only domain-level MX records are checked; no candidate is
      confirmed deliverable.
    category: accuracy
    severity: warning
    workaround: >-
      Use email-validate on a shortlisted candidate for format/MX-level checks, and treat any outreach as best-effort
      until a reply is received.
  - title: Domains without published addresses have low confidence
    text: >-
      High or medium confidence requires an address on the homepage or contact page that matches or
      supports a candidate’s format; role addresses such as info@ and sales@ do not support
      personal-address patterns. Most domains publish no usable personal addresses, so all candidates
      are low-confidence convention guesses identified in `basis`.
    category: accuracy
    severity: warning
    workaround: >-
      Treat low-confidence output as a starting hypothesis, not a lead-ready address. Prioritise
      domains where evidence was found.
  - title: MX records do not confirm a candidate mailbox exists
    text: >-
      `accepts_email` true means only that the domain has MX records. Catch-all servers can accept any
      address, so neither that value nor a syntactically valid address confirms that a candidate
      mailbox exists.
    category: accuracy
    severity: warning
    workaround: >-
      Do not treat accepts_email:true as address-level confirmation. Rely on the per-candidate confidence/basis fields,
      which are scoped to pattern evidence, not deliverability.
  - title: Callers must establish a lawful basis for personal data
    text: >-
      The tool processes a name and inferred contact details but performs no outreach and does not
      establish or record a lawful basis. Callers must document an applicable basis before any
      processing or outreach, including a balancing test and opt-out mechanism when relying on GDPR
      legitimate interest.
    category: coverage
    severity: warning
    workaround: >-
      Confirm a documented lawful basis for the intended use before calling this capability, and
      honour opt-out/erasure requests against any address sourced from it.
  - title: Only one linked contact page is checked
    text: >-
      At most one page beyond the homepage is read: the first same-host link whose URL or text matches
      contact, kontakt, contact-us or get-in-touch, regardless of case. Contact details deeper in
      navigation, behind JavaScript-only menus or under other labels provide no evidence.
    category: coverage
    severity: info
  - title: JavaScript-generated addresses are not visible
    text: >-
      Only the initial HTML response is read. Addresses added by JavaScript or interactive widgets are
      not seen, reducing the evidence available.
    category: coverage
    severity: info
  - title: Some surname conventions are simplified
    text: >-
      Multi-part surnames use only the final word; hyphenated surnames produce both joined and
      hyphen-preserved candidates. Other conventions, such as retaining surname particles or using a
      maiden name, are not modelled.
    category: coverage
    severity: info
  - title: Only the first 300 KB of each page is scanned
    text: >-
      Only the first 300 KB of each page is scanned. Contact details appearing later in a longer page
      are not found.
    category: coverage
    severity: info
