slug: cz-company-data
name: "Czech Company Data"
description: "Look up a Czech company in ARES, the Ministry of Finance register, by IČO or company name."
category: company-data
cost_class: paid_prepaid
quota_window: none
price_cents: 5
is_free_tier: false
data_source: ARES (Czech Ministry of Finance)
data_source_type: api
transparency_tag: mixed
freshness_category: live-fetch
maintenance_class: free-stable-api
input_schema:
  type: object
  required:
    - ico
  properties:
    ico:
      type: string
      description: Czech IČO (8 digits) or company name for fuzzy lookup
output_schema:
  type: object
  properties:
    ubo_availability:
      type: string
    ubo_availability_reason:
      type: string
    ico:
      type: string
    company_name:
      type: string
    address:
      type: string
    legal_form_code:
      type: string
    vat_number:
      type: string
    nace_codes:
      type: array
      items:
        type: string
    registration_date:
      type: string
    last_updated:
      type: string
    status:
      type: string
      enum: ["active", "dissolved", "liquidation", "insolvency", "unknown"]
    primary_source:
      type: string
    jurisdiction:
      type: string
    legal_representatives:
      type: array
      description: >-
        Active members of the statutory body (Statutární orgán) and prokura from the ARES VR view.
        Canonical Strale shape: {type, name, role, role_code, role_group, date_of_birth, nationality,
        start_date}. Excludes supervisory bodies (dozorčí rada — not in statutarniOrgany, not a legal
        representative). Filters out historic members (datumVymazu present) and ended memberships
        (zanikClenstvi present). Empty for entities not in the public commercial register (sole
        traders, associations, foreign branches).
    total_legal_representatives:
      type: integer
    signing_authority:
      type:
        - string
        - "null"
      description: >-
        Current "způsob jednání" (manner of acting) for the entity — the company-level signing rule
        from the VR view. Null when ARES does not surface this field for the record.
    tier_2_available:
      type: boolean
    tier_2_available_reason:
      type: string
geography: eu
processes_personal_data: true
personal_data_categories:
  - name
  - address
  - professional
test_fixtures:
  known_answer:
    input:
      ico: "00177041"
    expected_fields:
      - field: ico
        operator: not_null
        reliability: guaranteed
      - field: company_name
        operator: not_null
        reliability: guaranteed
      - field: address
        operator: not_null
        reliability: guaranteed
      - field: legal_form_code
        operator: not_null
        reliability: guaranteed
      - field: vat_number
        operator: not_null
        reliability: guaranteed
      - field: nace_codes
        operator: not_null
        reliability: guaranteed
      - field: registration_date
        operator: not_null
        reliability: guaranteed
      - field: last_updated
        operator: not_null
        reliability: guaranteed
      - field: status
        operator: not_null
        reliability: guaranteed
      - field: primary_source
        operator: not_null
        reliability: guaranteed
      - field: jurisdiction
        operator: not_null
        reliability: guaranteed
  health_check_input:
    ico: "00177041"
limitations:
  - title: Official registry data access
    text: "Data comes from the official registry's public API under its open-data terms (https://mf.gov.cz/cs/ministerstvo/informacni-systemy/ares); results carry the registry as their source."
    category: coverage
    severity: info
  - title: Registry status interpretation
    text: "Liquidation reflects a current VR liquidator appointment, while insolvency reflects an active IR registration rather than a bankruptcy ruling. Status is unknown when an expected VR record is unavailable; ROS active status alone cannot exclude liquidation."
    category: coverage
    severity: info
  - title: Natural persons' DIČ not derivable
    text: >-
      DIČ is returned verbatim when ARES has it. For natural persons registered as entrepreneurs, the DIČ may be CZ +
      rodné číslo and cannot be derived from IČO alone.
    category: coverage
    severity: info
  - title: Fuzzy name search returns first match only
    text: >-
      Name search returns only the first ARES match. Ambiguous names can resolve to the wrong entity.
    category: accuracy
    severity: info
    workaround: Pass IČO directly when known.
  - title: Sole proprietors with only trade licence may be outside ROS
    text: >-
      Entities registered solely in RŽP (Živnostenský rejstřík) without ROS record may return limited data. ARES still
      returns basic identification.
    category: coverage
    severity: info
output_field_reliability:
  ico: guaranteed
  company_name: guaranteed
  address: guaranteed
  legal_form_code: guaranteed
  vat_number: guaranteed
  nace_codes: guaranteed
  registration_date: guaranteed
  last_updated: guaranteed
  status: guaranteed
  primary_source: guaranteed
  jurisdiction: guaranteed
  # Common because entities outside the public commercial register (sole traders,
  # associations, foreign branches) have no VR view; the empty array is honest.
  legal_representatives: common
  total_legal_representatives: guaranteed
  signing_authority: common
  tier_2_available: guaranteed
  tier_2_available_reason: guaranteed
  ubo_availability: guaranteed
  ubo_availability_reason: guaranteed

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: preferred
  acquisition_method: direct_api
  upstream_vendor: ARES (Czech Ministry of Finance)
