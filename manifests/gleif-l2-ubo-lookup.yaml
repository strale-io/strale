limitations:
  - title: Coverage is limited to entities that have an LEI
    text: >-
      GLEIF relationship data covers only entities with LEIs, approximately 2.6 million mainly large
      or regulated entities worldwide. Small and medium-sized businesses without LEIs return no
      relationship data.
    category: coverage
    severity: info
    workaround: >-
      For UK ownership records, use beneficial-ownership-lookup; for other countries, check the
      national beneficial-ownership register.
  - title: Reporting exceptions are common
    text: >-
      Many entities report a structured "reporting exception" instead of naming a parent (NATURAL_PERSONS,
      NON_CONSOLIDATING, NO_KNOWN_PERSON, LEGAL_OBSTACLES, DISCLOSURE_DETRIMENTAL, BINDING_LEGAL_COMMITMENTS). The
      exception is structured data and is surfaced verbatim in direct_parent_exception / ultimate_parent_exception, but
      it does not name an ultimate beneficiary.
    category: coverage
    severity: warning
  - title: Parent relationships are self-reported
    text: >-
      Entities report parent relationships during annual LEI renewal, so restructurings between
      renewals can be missing. Check the source LEI record’s update date when assessing freshness.
    category: freshness
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
