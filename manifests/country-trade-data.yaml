limitations:
  - title: Embedded figures are 2023 estimates, not updated
    text: >-
      The product and partner breakdown, and the totals whenever the World Bank does not supply
      them, come from an embedded table of 2023 estimates that is not updated. When the totals
      come from that table, totals_year is 2023 whatever year was requested.
    category: freshness
    severity: info
    workaround: >-
      Read totals_year before comparing years, and cross-reference UN Comtrade or national customs
      statistics for current product and partner figures.
  - title: World Bank outages fail without a charge
    text: >-
      Totals come from the World Bank for the requested year when it has both exports and imports.
      When it has neither, the embedded 2023 estimates answer for both totals and data_source is
      embedded-trade-data. When it has only one, the embedded estimates answer for both where the
      country has an entry; for a country without one, the World Bank's single figure is returned
      beside a null. The two sources are never mixed, and totals_year names the year the totals
      are for. When the World Bank does not answer (an error status, a timeout, an unreadable
      response or a rejected request), the call fails with an error and is not billed.
    category: availability
    severity: info
    workaround: >-
      After a World Bank error status or timeout, retry after a short wait; a rejected or unreadable
      answer will not change on retry.

