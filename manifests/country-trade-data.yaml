limitations:
  - title: Embedded figures are 2023 estimates, not updated
    text: >-
      The product and partner breakdown, and the totals whenever the World Bank does not supply
      them, come from an embedded table of 2023 estimates that is not updated. When the totals
      come from that table, totals_year is 2023 whatever year was requested.
    category: freshness
    severity: info
    workaround: >-
      Read totals_year before comparing years, and cross-reference UN Comtrade or national customs
      statistics for current product and partner figures.
  - title: World Bank outages fail without a charge
    text: >-
      Totals come from the World Bank for the requested year when it has both exports and imports.
      When it has neither, the embedded 2023 estimates answer for both totals and data_source is
      embedded-trade-data. When it has only one, the embedded estimates answer for both where the
      country has an entry; for a country without one, the World Bank's single figure is returned
      beside a null. The two sources are never mixed, and totals_year names the year the totals
      are for; data_source is World Bank API when the country has no embedded entry. When the World
      Bank does not answer (an error status, a timeout, an unreadable response or a rejected
      request), the call fails with an error and is not billed.
    category: availability
    severity: info
    workaround: >-
      After a World Bank server error (5xx), a 429, a timeout or a network error, retry after a short wait; any other
      error status, and a rejected or unreadable answer, will not change on retry.
  - title: Country names are read only from a short list
    text: >-
      The country is an ISO alpha-2 code, a name or alias on a short list (such as Sweden, UK or
      USA), or the start of one of those names when it is at least four letters long and fits only
      one country. Any other name, including one that contains a listed name (North Korea, or Hong
      Kong, China), is refused and not billed.
    category: coverage
    severity: info
    workaround: Send 'country_code' as an ISO alpha-2 code, such as 'SE', 'US' or 'CN'.

