slug: domain-contact-extract
name: "Domain Contact Extraction"
description: "Find a company's public contact details on its own website: role email addresses such as info@ and sales@, phone numbers, postal address, contact page and social links. Company contacts only, never a named person's."
category: web-intelligence
search_tags:
  - contact info
  - company email
  - company contact
  - find email
  - find phone number
  - get email address
  - get phone number
  - business contact details
  - contact page
  - website scrape
  - extract emails from website
  - company phone number
cost_class: free_unlimited
quota_window: none
price_cents: 5
input_schema:
  type: object
  required:
    - domain
  properties:
    domain:
      type: string
      description: Company domain (e.g. stripe.com)
    url:
      type: string
      description: Alias for domain — full URL, hostname is extracted
    website:
      type: string
      description: Alias for domain
    site:
      type: string
      description: Alias for domain
output_schema:
  type: object
  properties:
    domain:
      type: string
    fetched_urls:
      type: array
    role_emails:
      type: array
    personal_addresses_withheld:
      type: number
    phones:
      type: array
    social_links:
      type: object
    contact_page_url:
      type: string
    postal_address:
      type: string
    has_contact_page:
      type: boolean
data_source: Company's own public website (direct HTTP fetch, no vendor)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
avg_latency_ms: 1500
processes_personal_data: true
personal_data_categories:
  - email
  - phone
  - address
gdpr_art_22_classification: data_lookup
geography: global
test_fixtures:
  known_answer:
    input:
      domain: stripe.com
    expected_fields:
      # Only guaranteed fields get asserted (CLAUDE.md field-reliability rule).
      # role_emails / phones / social_links / contact_page_url / postal_address
      # are hand-corrected below to common/rare (personal_addresses_withheld is a
      # count, always present) —
      # --discover marked them "guaranteed" from a single stripe.com run, which
      # is not honest: most sites publish none, some, or a different subset of
      # these fields.
      - field: domain
        operator: equals
        reliability: guaranteed
        value: stripe.com
      - field: fetched_urls
        operator: not_null
        reliability: guaranteed
      - field: has_contact_page
        operator: not_null
        reliability: guaranteed
  health_check_input:
    domain: stripe.com
output_field_reliability:
  domain: guaranteed
  fetched_urls: guaranteed
  has_contact_page: guaranteed
  role_emails: common
  social_links: common
  phones: rare
  personal_addresses_withheld: guaranteed
  contact_page_url: rare
  postal_address: rare
limitations:
  - title: Company contact channels only
    text: >-
      Returns published company contact channels such as role email addresses, phone numbers, postal
      addresses and social links; it does not accept a person’s name, enumerate employees or guess
      personal email addresses. Personal-looking addresses are withheld even when published, with only
      their count returned in `personal_addresses_withheld`.
    category: coverage
    severity: info
  - title: JavaScript-generated contacts are not visible
    text: >-
      Only the initial HTML response is read. Contact details added by JavaScript or shown through
      interactive widgets can be missing, leaving empty or partial results.
    category: coverage
    severity: warning
  - title: Only one linked contact page is checked
    text: >-
      At most one additional page is read: the first same-host link whose URL or text matches contact,
      kontakt, contact-us or get-in-touch, regardless of case. Deeper pages, JavaScript-only links and
      other labels can be missed, so `has_contact_page` can be false even when a contact page exists.
    category: coverage
    severity: info
  - title: Phone numbers require explicit phone markup
    text: >-
      Phone numbers are returned only from tel: links or schema.org telephone values in JSON-LD or
      microdata. Plain-text numbers are not extracted, so `phones` can be empty even when a number is
      visible on the page.
    category: coverage
    severity: warning
  - title: Postal address requires structured markup
    text: >-
      Postal address relies on the page publishing schema.org JSON-LD or microdata markup; sites without structured
      markup return postal_address: null even if an address is visible in plain text on the page.
    category: coverage
    severity: info
  - title: Only the first 300 KB of each page is scanned
    text: >-
      Only the first 300 KB of each page is scanned. Contact details appearing later in a longer page
      are not found.
    category: coverage
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: customer_directed_fetch
  checks: pending
  checks_note: "Pending: fetches go through robots.txt and block checks (PR #723), but a per-tool review of every fetch (redirect targets, challenge pages on rendered routes, links followed to other hosts) is not yet recorded."
