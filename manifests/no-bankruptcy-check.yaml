slug: no-bankruptcy-check
name: "Norwegian Bankruptcy Check"
description: "Check a Norwegian company for bankruptcy and dissolution in the Brønnøysund registers: any bankruptcy filing and its date, voluntary or forced dissolution, and the register's notes."
category: compliance
cost_class: free_unlimited
quota_window: none
price_cents: 5
is_free_tier: false
avg_latency_ms: 400
input_schema:
  type: object
  required: []
  properties:
    org_number:
      type: string
      description: 9-digit Norwegian organization number (with or without spaces). Canonical input.
    company_name:
      type: string
      description: Optional fallback input — Norwegian company name to search Brønnøysundregistrene if no org number is known.
output_schema:
  type: object
  example:
    org_number: "923609016"
    company_name: EQUINOR ASA
    has_bankruptcy_filing: false
    bankruptcy_date: null
    is_under_dissolution: false
    is_under_compulsory_dissolution: false
    has_any_distress_signal: false
    registry_annotations: []
    data_source: Brønnøysundregistrene Enhetsregisteret
  properties:
    org_number:
      type: string
    company_name:
      type:
        - string
        - "null"
    is_deleted:
      type: boolean
    deletion_date:
      type: [string, "null"]
    has_bankruptcy_filing:
      type: boolean
    bankruptcy_date:
      type:
        - string
        - "null"
    is_under_dissolution:
      type: boolean
    is_under_compulsory_dissolution:
      type: boolean
    has_any_distress_signal:
      type: boolean
    registry_annotations:
      type: array
    data_source:
      type: string
data_source: Brønnøysundregistrene Enhetsregisteret
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
gdpr_art_22_classification: data_lookup
processes_personal_data: false
geography: "no"
test_fixtures:
  known_answer:
    input:
      org_number: "923609016"
    expected_fields:
      - field: org_number
        operator: equals
        reliability: guaranteed
        value: "923609016"
      - field: company_name
        operator: not_null
        reliability: guaranteed
      - field: has_bankruptcy_filing
        operator: equals
        reliability: guaranteed
        value: false
      - field: is_under_dissolution
        operator: equals
        reliability: guaranteed
        value: false
      - field: is_under_compulsory_dissolution
        operator: equals
        reliability: guaranteed
        value: false
      - field: has_any_distress_signal
        operator: equals
        reliability: guaranteed
        value: false
      - field: registry_annotations
        operator: not_null
        reliability: guaranteed
      - field: data_source
        operator: not_null
        reliability: guaranteed
  health_check_input:
    org_number: "923609016"
output_field_reliability:
  is_deleted: guaranteed
  deletion_date: common
  org_number: guaranteed
  has_bankruptcy_filing: guaranteed
  is_under_dissolution: guaranteed
  is_under_compulsory_dissolution: guaranteed
  has_any_distress_signal: guaranteed
  registry_annotations: guaranteed
  data_source: guaranteed
  company_name: common
  bankruptcy_date: rare
limitations:
  - title: Official registry data access
    text: "Data comes from the official registry's public API under its open-data terms (https://www.brreg.no/en/use-of-data-from-the-bronnoysund-register-centre/datasets-and-api/); results carry the registry as their source."
    category: coverage
    severity: info
  - title: Registry status interpretation
    text: "Deleted-unit tombstones set is_deleted and deletion_date and count in has_any_distress_signal. Deletion alone does not imply bankruptcy; bankruptcy and dissolution flags remain separate."
    category: coverage
    severity: info
  - title: Only registered Norwegian entities are covered
    text: >-
      Only Norwegian entities registered in Enhetsregisteret are covered. Foreign entities and informal businesses
      without an org number cannot be looked up.
    category: coverage
    severity: info
  - title: Recovery is not reported separately
    text: >-
      `has_bankruptcy_filing` reflects current registry state, so a restored entity or one with
      completed liquidation may not show a bankruptcy flag. Check `registry_annotations` for
      historical events.
    category: accuracy
    severity: info
  - title: Detailed bankruptcy case records are not included
    text: >-
      Brønnøysundregistrene's free open-data API exposes only the structured booleans and bankruptcy_date. Full
      case-by-case detail (handling court, appointed trustee, creditor schedule) is held in Konkursregisteret and Norsk
      Lysingsblad and is not free machine-readable.
    category: coverage
    severity: warning

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: preferred
  acquisition_method: direct_api
  upstream_vendor: Brønnøysundregistrene
