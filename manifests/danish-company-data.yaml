# Auto-generated from database on 2026-03-17
# Review and adjust before using as onboarding template

slug: danish-company-data
# QUARANTINED 2026-08-12 (DEC-20260812-A escalation contract, first floor
# action): 0% completion on 11 external calls/90d — cvrapi.dk free tier is
# exhausted and fails even identifier lookups. Delisted from catalog + x402
# (DB: visible=false, x402_enabled=false); /v1/do by explicit slug stays
# reachable and unbilled on failure. Unblock: official datacvr.virk.dk access
# (Petter action), then flip visible back and re-verify via prod sweep.
visible: false
name: Danish Company Data
description: >-
  Look up Danish company data from the Central Business Register (CVR). Accepts CVR number (8 digits) or fuzzy company
  name.
category: data-extraction
price_cents: 5
is_free_tier: false
# Phase A0b cost-class: cvrapi.dk unauthenticated free tier, IP-quota-limited.
#
# The previous note here read "empirical floor ~50/day; documented limit higher
# but conservative cap chosen". That had it backwards. cvrapi.dk documents
# exactly 50 free lookups per day — "Du har 50 gratis opslag om dagen" — so a
# cap of 50 was not conservative, it allocated the entire vendor allowance to
# our own test scheduler and left nothing for paying callers.
#
# That is what happened. In the week to 2026-08-15 the scheduler ran 12-31
# upstream-consuming executions a day, our own budget refused 12-15 of them,
# and cvrapi.dk still returned "quota exceeded" 2-4 times a day. The one
# genuinely external call in the 30-day window failed with exactly that error.
# Tests and customers draw on the same 50; only tests are budget-checked
# (customer_paid is always ALLOW in the ALLOW_MATRIX), so tests can consume the
# lot and customers meet the wall.
#
# The cap now reserves headroom rather than claiming the whole allowance: 20
# for testing against a documented 50, leaving 30/day for real callers. 20 sits
# comfortably above the observed 12/day baseline for a full suite cycle.
known_rate_limit:
  value: 50
  unit: per_day
  source_url: https://cvrapi.dk/documentation
cost_class: free_quota
quota_window: daily
quota_cap: 20
input_schema:
  type: object
  # No field is individually required: a CVR number OR a company name is
  # enough, and the executor enforces that itself (firstString alias chain).
  # Listing cvr_number as `required` made the ROUTE reject
  # {"company_name": "Novo Nordisk"} before the executor's name path
  # (fixed 2026-08-09) could ever run. Same defect class as PR #168 (norwegian).
  required: []
  properties:
    cvr_number:
      type: string
      description: Danish CVR number (8 digits)
    org_number:
      type: string
      description: Alias for cvr_number
    company_number:
      type: string
      description: Alias for cvr_number
    company_name:
      type: string
      description: Danish company name (resolved via scored registry search)
    name:
      type: string
      description: Alias for company_name
    query:
      type: string
      description: Free-text alias — CVR number or company name
    task:
      type: string
      description: Free-text alias — CVR number or company name
  anyOf:
    - required: [cvr_number]
    - required: [org_number]
    - required: [company_number]
    - required: [company_name]
    - required: [name]
    - required: [query]
    - required: [task]
output_schema:
  type: object
  example:
    status: active
    address: Novo Alle 1, 2880 Bagsværd
    cvr_number: "24256790"
    start_date: 28/11 - 1931
    company_name: NOVO NORDISK A/S
    business_type: Aktieselskab
    industry_code: "212000"
    employee_range: 33167
    industry_description: Fremstilling af farmaceutiske præparater
  properties:
    status:
      type: string
    address:
      type: string
    cvr_number:
      type: string
    start_date:
      type: string
    company_name:
      type: string
    business_type:
      type: string
    industry_code:
      type: string
    employee_range:
      type: string
    # Danish VAT registration number. Not a separate lookup: in Denmark the VAT
    # number IS the CVR number with a DK prefix, and cvrapi.dk literally returns
    # it under the key `vat`. The executor has derived and returned it since
    # deriveVatDK landed; the declaration never caught up, so kyc-denmark's
    # $steps[0].vat_number failed the onboarding gate and aborted every seed run.
    vat_number:
      type: string
data_source: CVR / Danish Business Authority (Erhvervsstyrelsen)
data_source_type: api
transparency_tag: mixed
freshness_category: live-fetch
maintenance_class: free-stable-api
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
processes_personal_data: true
personal_data_categories:
  - name
  - address
  - professional
geography: nordic
test_fixtures:
  known_answer:
    input:
      cvr_number: "24256790"
    expected_fields:
      - field: company_name
        operator: not_null
        reliability: guaranteed
  health_check_input:
    cvr_number: "24256790"
output_field_reliability:
  status: guaranteed
  address: guaranteed
  cvr_number: guaranteed
  # `common`, not `guaranteed`: deriveVatDK returns null unless the CVR is
  # exactly 8 digits, so a malformed upstream value yields null rather than a
  # string. Only guaranteed fields are asserted non-null.
  vat_number: common
  start_date: guaranteed
  company_name: guaranteed
  business_type: guaranteed
  industry_code: guaranteed
  employee_range: guaranteed
  # Only set on the name-search path (never on the cvr_number identifier
  # path) — mirrors finnish-company-data's convention. See #161 wrong-company
  # class fix, 2026-08-14.
  match_confidence: rare
limitations:
  - title: Financial data comes from annual reports and can be up to 12 months old
    text: Financial data from annual reports — can be up to 12 months old
    category: freshness
    severity: info
    workaround: >-
      Check the report_date field and retrieve the latest filing from the Danish Business Authority
      (erhvervsstyrelsen.dk)
  - title: Does not cover sole proprietorships — about 15% of Danish businesses
    text: Does not cover sole proprietorships (enkeltmandsvirksomhed)
    category: coverage
    severity: info
    workaround: Search the CVR register (datacvr.virk.dk) directly using the person's CPR-linked CVR number
