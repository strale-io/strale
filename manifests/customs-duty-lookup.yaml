    origin_country: CN
    destination_country: SE
output_field_reliability:
  duty_rate: guaranteed
  duty_type: guaranteed
  anti_dumping: guaranteed
  preferential_rates: guaranteed
limitations:
  - title: Rates depend on the HS code and country of origin
    text: >-
      Duty rates come from the EU's TARIC database, read through the European Commission's Access2Markets service,
      and depend on the correct HS code classification and declared country of origin.
    category: accuracy
    severity: warning
    workaround: >-
      Verify extracted duty rates against the official TARIC database and consult a customs broker for complex
      classifications
  - title: Read at the 6-digit subheading
    text: >-
      Access2Markets answers at the 6-digit HS subheading, so a measure that applies only to some 8- or 10-digit
      codes under it may be listed without saying which. resolved_hs_code says which code the answer is for.
    category: coverage
    severity: info
    workaround: For an 8- or 10-digit code with code-specific measures, check the full code in the official TARIC database.
  - title: Imports into the EU only
    text: >-
      Covers goods imported into an EU member state from a non-EU country. It does not cover duties charged by
      non-EU countries, and goods moving between member states pay no customs duty.
    category: coverage
    severity: info
    workaround: For another country's import duties, use that country's own customs tariff.
  - title: Output size cap per call
    text: >-
      Structured output is limited to about 2000 output tokens per call; requests exceeding this limit
      are refused rather than returned truncated. Requests with large results can exceed this limit,
      and repeating the same request does not help.
    category: coverage
    severity: info
    workaround: Check the duty page directly in the official TARIC database.

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: public_page_read
  upstream_vendor: European Commission (Access2Markets)
  checks: recorded
  checks_note: >-
    Checked 2026-11-07. Reads one Access2Markets results page per call (trade.ec.europa.eu; robots.txt disallows
    only /wp-login.php). The EU import tariff rows on it are TARIC data owned by the European Commission, which
    licenses its content under CC BY 4.0 (commission.europa.eu/legal-notice_en); attribution is in provenance.
    Only imports into EU member states are queried, so the Mendel Verlag rows (non-EU tariffs, no resale) are
    never read. TARIC's own pages (ec.europa.eu/taxation_customs/dds2/taric/) are robots-disallowed and not used.
