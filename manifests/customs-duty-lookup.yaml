slug: customs-duty-lookup
name: "Customs Duty Lookup"
description: "Look up EU customs duty by HS code and origin country: the duty rate, preferential rates and anti-dumping status."
category: data-extraction
cost_class: paid_prepaid
quota_window: none
price_cents: 20
is_free_tier: false
input_schema:
  type: object
  required:
    - hs_code
    - origin_country
  properties:
    hs_code:
      type: string
      description: "HS code of 6 to 10 digits, e.g. '8471.30'. Duties are read at the 6-digit subheading."
    origin_country:
      type: string
      description: "ISO 3166-1 alpha-2 code of the non-EU country the goods come from, e.g. 'CN'."
    destination_country:
      type: string
      description: "EU member state the goods are imported into (ISO alpha-2, e.g. 'SE'), or 'EU' (default). The duty is the same in every member state; the VAT rate is returned only when a member state is named."
output_schema:
  type: object
  example:
    hs_code: "847130"
    resolved_hs_code: "847130"
    description: Portable automatic data-processing machines, weighing not more than 10 kg
    origin_country: CN
    destination: SE
    duty_rate: 0%
    duty_type: ad_valorem
    preferential_rates: []
    anti_dumping: false
    additional_duties:
      - measure: Low-value consignment customs duty
        rate: 3.00 EUR per item
    vat_rate: null
    notes: The low-value consignment duty applies from 1 July 2026 to items in consignments worth up to EUR 150.
  properties:
    duty_rate:
      type: string
    duty_type:
      type: string
    anti_dumping:
      type: boolean
    preferential_rates:
      type: array
    resolved_hs_code:
      type: string
data_source: "Access2Markets (European Commission), EU tariff data from the TARIC database (DG TAXUD)"
data_source_type: scrape
transparency_tag: ai_generated
freshness_category: live-fetch
maintenance_class: scraping-stable-target
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
processes_personal_data: false
geography: eu
test_fixtures:
  known_answer:
    input:
      hs_code: "8471.30"
      origin_country: CN
      destination_country: SE
    expected_fields:
      - field: hs_code
        operator: not_null
        reliability: common
      - field: hs_code
        operator: type
        reliability: common
        value: string
  health_check_input:
