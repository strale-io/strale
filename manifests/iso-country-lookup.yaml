slug: iso-country-lookup
name: ISO Country Lookup
description: >-
  Look up any country by name, ISO code (alpha-2/3/numeric). Returns region, capital, currency, EU/Schengen/Eurozone
  membership.
category: data-extraction
cost_class: free_unlimited
quota_window: none
price_cents: 2
is_free_tier: false
input_schema:
  type: object
  required:
    - query
  properties:
    query:
      type: string
      description: Country name, alpha-2, alpha-3, or numeric code
output_schema:
  type: object
  example:
    error: No country found matching "test".
    query: test
    matches: []
    total_matches: 0
  properties:
    query:
      type: string
    match:
      type: object
    matches:
      type: array
    total_matches:
      type: integer
    error:
      type: string
data_source: Algorithmic (ISO 3166-1 country code database)
data_source_type: computed
transparency_tag: algorithmic
freshness_category: computed
maintenance_class: pure-computation
processes_personal_data: false
personal_data_categories: []
geography: global
test_fixtures:
  known_answer:
    input:
      query: land
    expected_fields:
      - field: query
        operator: not_null
        reliability: common
      - field: matches
        operator: not_null
        reliability: common
      - field: total_matches
        operator: not_null
        reliability: common
  health_check_input:
    query: land
output_field_reliability:
  query: guaranteed
  match: common
  matches: common
  total_matches: common
  error: rare
limitations:
  - title: Country data is based on ISO 3166-1 — newly created or renamed countries may not yet be reflected
    text: Country data based on ISO 3166-1 standard — newly created or renamed countries may take time to be reflected
    category: freshness
    severity: info
    workaround: For edge cases, cross-reference with the ISO Online Browsing Platform at iso.org/obp
