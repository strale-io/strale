slug: eurostat-data
name: Eurostat Data
description: "Get statistics from a curated Eurostat dataset list, with EU/EFTA/candidate geo filters, numeric observations and source labels."
category: finance
cost_class: free_unlimited
quota_window: none
price_cents: 3
external_cost_cents: 0
is_free_tier: false
avg_latency_ms: 600
input_schema:
  type: object
  required: [dataset, filters]
  properties:
    dataset:
      type: string
      pattern: '^[a-z0-9_]{3,40}$'
      description: Curated dataset code, for example nama_10_gdp or une_rt_a. Other datasets return dataset_not_supported with the supported list and instructions to request additions.
    filters:
      type: object
      required: [geo]
      minProperties: 1
      maxProperties: 10
      propertyNames:
        pattern: '^[A-Za-z0-9_.-]{1,40}$'
      additionalProperties:
        oneOf:
          - type: string
            pattern: '^[A-Za-z0-9_.-]{1,40}$'
          - type: array
            minItems: 1
            maxItems: 50
            items:
              type: string
              pattern: '^[A-Za-z0-9_.-]{1,40}$'
      description: >-
        Dimension codes to one value or an array; at most 50 values total. Keys are case-insensitive;
        duplicate key variants and reserved options are refused. geo is required and uppercased.
        Only geo is country-checked, restricted to EU/EFTA/official candidate countries, their
        NUTS regions and supported EU/EFTA/euro-area aggregates. Curated datasets have no other
        geographic dimensions; other dimensions pass unchanged to Eurostat.
        Example: {geo: [SE, DE], unit: CP_MEUR, na_item: B1GQ}.
    since_period:
      type: string
      pattern: '^\d{4}(-Q[1-4]|-(0[1-9]|1[0-2]))?$'
      description: Inclusive lower bound, YYYY, YYYY-Q1, YYYY-S1 or YYYY-MM.
    until_period:
      type: string
      pattern: '^\d{4}(-Q[1-4]|-(0[1-9]|1[0-2]))?$'
      description: Inclusive upper bound, YYYY, YYYY-Q1, YYYY-S1 or YYYY-MM.
output_schema:
  type: object
  properties:
    dataset: {type: string}
    label: {type: string}
    updated: {type: [string, 'null'], description: Upstream update timestamp in ISO 8601 when exposed; null otherwise.}
    unit: {type: string, description: Unit category code when exactly one unit is present.}
    dimensions:
      type: array
      items:
        type: object
        properties:
          id: {type: string}
          label: {type: string}
          categories:
            type: array
            items:
              type: object
              properties:
                code: {type: string}
                label: {type: string}
    observations:
      type: array
      description: >-
        One row per permitted Cartesian cell, with dimension ids mapped to category codes,
        time also exposed as period, numeric/null value and optional Eurostat status flag.
      items:
        type: object
        properties:
          period: {type: string}
          value: {type: [number, 'null']}
          status: {type: string}
        additionalProperties: true
    observation_count: {type: integer}
    dropped_observation_count: {type: integer, description: Cells removed because geo is outside the permitted geography.}
    dropped_observation_count_by_dimension:
      type: object
      additionalProperties: {type: integer}
      description: Restricted cells by dimension; only geo is filtered.
    source: {type: string}
    licence_note: {type: string}
    metadata_limitations: {type: string}
    source_url: {type: string}
    dataset_doi: {type: string, description: Dataset DOI in the form 10.2908/CODE.}
    accessed_at: {type: string, format: date, description: Access date in ISO 8601.}
    as_of: {type: string}
data_source: Eurostat dissemination statistics API (JSON-stat 2.0)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
gdpr_art_22_classification: data_lookup
processes_personal_data: false
geography: europe
data_access:
  lane: preferred
  acquisition_method: direct_api
  upstream_vendor: Eurostat
test_fixtures:
  known_answer:
    input:
      dataset: nama_10_gdp
      filters: {geo: [SE, DE], unit: CP_MEUR, na_item: B1GQ}
      since_period: '2020'
    expected_fields:
      - {field: dataset, operator: equals, value: nama_10_gdp, reliability: guaranteed}
      - {field: source, operator: equals, value: Eurostat, reliability: guaranteed}
      - {field: observations, operator: type, value: array, reliability: guaranteed}
      - {field: observation_count, operator: type, value: number, reliability: guaranteed}
      - {field: licence_note, operator: not_null, reliability: guaranteed}
  health_check_input:
    dataset: nama_10_gdp
    filters: {geo: SE, unit: CP_MEUR, na_item: B1GQ}
    since_period: '2020'
    until_period: '2020'
output_field_reliability:
  dataset: guaranteed
  label: guaranteed
  updated: common
  unit: common
  dimensions: guaranteed
  observations: guaranteed
  observation_count: guaranteed
  dropped_observation_count: guaranteed
  dropped_observation_count_by_dimension: guaranteed
  source: guaranteed
  licence_note: guaranteed
  metadata_limitations: guaranteed
  source_url: guaranteed
  dataset_doi: guaranteed
  accessed_at: guaranteed
  as_of: guaranteed
limitations:
  - title: Historical observations can be revised
    text: Eurostat revises statistics. updated is the upstream timestamp when available; as_of is retrieval time. Status flags are preserved without interpretation.
    category: accuracy
    severity: info
  - title: Requests must fit within 5,000 cells
    text: The product of all dimension sizes, including missing cells, must not exceed 5,000, so sparse datasets can still need narrower filters. Empty or entirely null results return an unbilled no_observations error.
    category: coverage
    severity: warning
  - title: Dataset and dimension codes must be known
    text: Only the selected datasets listed in the dataset_not_supported error are supported; other dataset codes are refused. Dataset and dimension codes must be supplied explicitly.
    category: coverage
    severity: info
  - title: Coverage is limited by dataset and geography
    text: >-
      Covers selected Eurostat-sourced datasets with `geo` as the sole geographic dimension,
      restricted to EU27, EFTA and official candidate countries, their supported NUTS 1–3 and
      not-regionalised codes, and selected EU, EFTA and euro-area aggregates including EA11–EA21;
      Kosovo, partner, citizenship, birthplace, residence, load/unload, origin/destination, control,
      counterpart and vessel-nationality tables are excluded. Other geographic codes are refused or
      dropped with cells counted and labels omitted, Greece requires EL rather than GR, non-geo values
      are not country-checked during a call, third-party source declarations and unrecognised rights
      notices are refused, and logos and third-party documents are not returned.
    category: coverage
    severity: warning
  - title: Some dataset restrictions may be missing from metadata
    text: >-
      International trade datasets are excluded, including Swiss and Liechtenstein commodity data and
      Austrian CN8 data; domestic retail, wholesale, distributive trade and trade-sector statistics
      are exempt, while stock-flow datasets can also be refused. Source and rights checks use returned
      metadata without inspecting separately linked ESMS documents or catalogue notices, and missing
      source declarations appear in `metadata_limitations`, so the checks do not establish rights
      clearance for every dataset; reuse must preserve the dataset DOI, access date, source
      attribution and notices describing modifications and Eurostat’s non-responsibility for the
      rendering.
    category: coverage
    severity: warning
