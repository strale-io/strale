slug: eurostat-data
name: Eurostat Data
description: "Get official Eurostat statistics by dataset code and country filters, with numeric observations, periods, units and source labels."
category: finance
cost_class: free_unlimited
quota_window: none
price_cents: 3
external_cost_cents: 0
is_free_tier: false
avg_latency_ms: 600
input_schema:
  type: object
  required: [dataset, filters]
  properties:
    dataset:
      type: string
      pattern: '^[a-z0-9_]{3,40}$'
      description: Eurostat dataset code, for example nama_10_gdp or une_rt_m. Trade datasets are excluded by code and returned metadata rules described in limitations.
    filters:
      type: object
      required: [geo]
      minProperties: 1
      maxProperties: 10
      propertyNames:
        pattern: '^[A-Za-z0-9_.-]{1,40}$'
      additionalProperties:
        oneOf:
          - type: string
            pattern: '^[A-Za-z0-9_.-]{1,40}$'
          - type: array
            minItems: 1
            maxItems: 50
            items:
              type: string
              pattern: '^[A-Za-z0-9_.-]{1,40}$'
      description: >-
        Dimension codes to one value or an array; at most 50 values total. Keys are case-insensitive;
        duplicate key variants and reserved options are refused. geo is required. Country values
        are checked by label across every returned dimension; pre-fetch country checks apply to geo, partner, citizen, counterp, natvessr, reporter and c_* ids. Country codes are uppercased. NUTS regional
        codes and supported EU/EFTA/euro-area aggregates are accepted in geo; non-country totals
        and aggregates pass in other dimensions except explicitly denied geographic groups.
        Example: {geo: [SE, DE], unit: CP_MEUR, na_item: B1GQ}.
    since_period:
      type: string
      pattern: '^\d{4}(-Q[1-4]|-(0[1-9]|1[0-2]))?$'
      description: Inclusive lower bound, YYYY, YYYY-Q1 or YYYY-MM.
    until_period:
      type: string
      pattern: '^\d{4}(-Q[1-4]|-(0[1-9]|1[0-2]))?$'
      description: Inclusive upper bound, YYYY, YYYY-Q1 or YYYY-MM.
output_schema:
  type: object
  properties:
    dataset: {type: string}
    label: {type: string}
    updated: {type: [string, 'null'], description: Upstream update timestamp in ISO 8601 when exposed; null otherwise.}
    unit: {type: string, description: Unit category code when exactly one unit is present.}
    dimensions:
      type: array
      items:
        type: object
        properties:
          id: {type: string}
          label: {type: string}
          categories:
            type: array
            items:
              type: object
              properties:
                code: {type: string}
                label: {type: string}
    observations:
      type: array
      description: >-
        One row per permitted Cartesian cell, with dimension ids mapped to category codes,
        time also exposed as period, numeric/null value and optional Eurostat status flag.
      items:
        type: object
        properties:
          period: {type: string}
          value: {type: [number, 'null']}
          status: {type: string}
        additionalProperties: true
    observation_count: {type: integer}
    dropped_observation_count: {type: integer, description: Cells removed because any dimension has a restricted country/geographic code.}
    dropped_observation_count_by_dimension:
      type: object
      additionalProperties: {type: integer}
      description: Restricted cells per dimension; one cell can contribute to multiple dimension counts.
    source: {type: string}
    licence_note: {type: string}
    metadata_limitations: {type: string}
    source_url: {type: string}
    dataset_doi: {type: string, description: Dataset DOI in the form 10.2908/CODE.}
    accessed_at: {type: string, format: date, description: Access date in ISO 8601.}
    as_of: {type: string}
data_source: Eurostat dissemination statistics API (JSON-stat 2.0)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
gdpr_art_22_classification: data_lookup
processes_personal_data: false
geography: europe
data_access:
  lane: preferred
  acquisition_method: direct_api
  upstream_vendor: Eurostat
test_fixtures:
  known_answer:
    input:
      dataset: nama_10_gdp
      filters: {geo: [SE, DE], unit: CP_MEUR, na_item: B1GQ}
      since_period: '2020'
    expected_fields:
      - {field: dataset, operator: equals, value: nama_10_gdp, reliability: guaranteed}
      - {field: source, operator: equals, value: Eurostat, reliability: guaranteed}
      - {field: observations, operator: type, value: array, reliability: guaranteed}
      - {field: observation_count, operator: type, value: number, reliability: guaranteed}
      - {field: licence_note, operator: not_null, reliability: guaranteed}
  health_check_input:
    dataset: nama_10_gdp
    filters: {geo: SE, unit: CP_MEUR, na_item: B1GQ}
    since_period: '2020'
    until_period: '2020'
output_field_reliability:
  dataset: guaranteed
  label: guaranteed
  updated: common
  unit: common
  dimensions: guaranteed
  observations: guaranteed
  observation_count: guaranteed
  dropped_observation_count: guaranteed
  dropped_observation_count_by_dimension: guaranteed
  source: guaranteed
  licence_note: guaranteed
  metadata_limitations: guaranteed
  source_url: guaranteed
  dataset_doi: guaranteed
  accessed_at: guaranteed
  as_of: guaranteed
limitations:
  - title: Historical observations can be revised
    text: Eurostat revises statistics. updated is the upstream timestamp when available; as_of is retrieval time. Status flags are preserved without interpretation.
    category: accuracy
    severity: info
  - title: Requests must fit within 5,000 cells
    text: The full dimension-size product, including missing cells, must not exceed 5,000. Sparse datasets may need narrower filters even if few values are reported. Empty or entirely null results raise an unbilled no_observations refusal.
    category: coverage
    severity: warning
  - title: Dataset and dimension codes must be known
    text: This tool does not search datasets. Find dataset and dimension codes in the Eurostat data browser at https://ec.europa.eu/eurostat/databrowser/. A geo filter on a dataset without a geo dimension returns Eurostat's dimension error.
    category: coverage
    severity: info
  - title: Commercial reuse is restricted by geography and dataset
    text: >-
      https://ec.europa.eu/eurostat/help/copyright-notice permits commercial reuse under Commission
      Decision 2011/833/EU with DOI, access date, attribution and modification/non-responsibility notices.
      geo is required. The country allowlist reflects EU27, EFTA and the official candidate list checked
      on 2026-10-26 at https://enlargement.ec.europa.eu/enlargement-policy/candidate-countries-and-potential-candidates_en
      (Kosovo is a potential candidate and excluded). Pre-fetch country refusals apply only to geo, partner, citizen, counterp, natvessr, reporter
      and c_* ids (case-insensitive). Post-fetch country detection checks ALL dimensions: a country
      code must have a category label matching or starting with its English GEO label after
      case, whitespace and punctuation normalisation (so unit NR labelled Number passes). The embedded 2026-10-26 snapshot
      contains all ISO 3166-1 alpha-2 countries and Eurostat aliases/variants, including CN_X_HK.
      Country codes require an exact, case-insensitive allowlist match. Only geo also accepts NUTS
      regional codes matching ^<allowlisted 2-letter>[0-9A-Z]{1,3}$ and the supported EU/EFTA/euro-area
      aggregates in EUROSTAT_ALLOWED_AGGREGATES (including EA11–EA21). EA14 is accepted by policy but
      absent from the checked codelist. All other geo codes are refused or dropped. In non-geo dimensions,
      non-country totals and aggregates such as citizen=TOTAL, WORLD, NAT, FOR, EXT_EU27_2020,
      EU27_2020 and EA21 pass because a total is not data for a particular country.
      Explicit geographic groups containing non-allowlisted countries (continents, Melanesia, Southern
      polar regions, Mediterranean Basin and the other groups in EUROSTAT_DENIED_GEOGRAPHIC_AGGREGATES)
      are refused or dropped across all dimensions. MEL/PLR/MED are denied; BAL (Baltic countries)
      and ESM (European Stability Mechanism) are not. Snapshot and group labels were read from
      https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/codelist/ESTAT/GEO?format=TSV&lang=en.
      Dropped cells are counted once overall and once per restricted dimension; their labels are omitted.
      Returned third-party source declarations and unrecognised rights notices are refused.
      DISSEMINATION_SOURCE_DATASET is lineage, not a source declaration. No logos or third-party documents are returned.
    category: coverage
    severity: warning
  - title: Metadata may not expose every dataset-specific restriction
    text: >-
      International trade datasets are conservatively refused by case-insensitive code prefixes ext_, ds-, comext,
      itgs_, trade_, tet, teiet, tipsex, cult_trd_, sprt_trd_, enpe_ext_, bop_its, for_trop and ei_etea;
      by the words trade, import/imports or export/exports (case-insensitive, word boundaries) in returned
      dataset titles or theme/category labels, except domestic retail trade, wholesale trade, distributive
      trade and trade sector phrases (international/foreign/extra-EU/intra-EU trade remains refused);
      by a stk_flow dimension (this conservatively also refuses nrg_stk_gas); and by DISSEMINATION_SOURCE_DATASET annotation titles
      starting with ext_, ds- or comext (case-insensitive). This covers Swiss/Liechtenstein post-1995
      commodity and Austrian CN8 restrictions. The executor checks source/rights anchors including
      SOURCE_INSTITUTIONS in returned JSON-stat source, extension and annotations, never dimension ids
      or category codes (owner is a valid dimension). Separately linked
      ESMS documents and catalogue notices are not inspected; absent source declarations are reported
      in metadata_limitations. No blanket rights clearance of every catalogue dataset is implied.
    category: coverage
    severity: warning
