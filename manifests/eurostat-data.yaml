slug: eurostat-data
name: Eurostat Data
description: "Get official Eurostat statistics by dataset code and country filters, with numeric observations, periods, units and source labels."
category: finance
cost_class: free_unlimited
quota_window: none
price_cents: 3
external_cost_cents: 0
is_free_tier: false
avg_latency_ms: 600
input_schema:
  type: object
  required: [dataset, filters]
  properties:
    dataset:
      type: string
      pattern: '^[a-z0-9_]{3,40}$'
      description: Eurostat dataset code, for example nama_10_gdp or une_rt_m. All international-trade datasets are excluded.
    filters:
      type: object
      required: [geo]
      minProperties: 1
      maxProperties: 10
      propertyNames:
        pattern: '^[A-Za-z0-9_.-]{1,40}$'
      additionalProperties:
        oneOf:
          - type: string
            pattern: '^[A-Za-z0-9_.-]{1,40}$'
          - type: array
            minItems: 1
            maxItems: 50
            items:
              type: string
              pattern: '^[A-Za-z0-9_.-]{1,40}$'
      description: >-
        Dimension codes to one value or an array; at most 50 values total. geo is required,
        limited to EU27 (EL for Greece), EFTA, official EU candidates and supported EU/euro-area aggregates.
        Example: {geo: [SE, DE], unit: CP_MEUR, na_item: B1GQ}.
    since_period:
      type: string
      pattern: '^\d{4}(-Q[1-4]|-(0[1-9]|1[0-2]))?$'
      description: Inclusive lower bound, YYYY, YYYY-Q1 or YYYY-MM.
    until_period:
      type: string
      pattern: '^\d{4}(-Q[1-4]|-(0[1-9]|1[0-2]))?$'
      description: Inclusive upper bound, YYYY, YYYY-Q1 or YYYY-MM.
output_schema:
  type: object
  properties:
    dataset: {type: string}
    label: {type: string}
    updated: {type: [string, 'null'], description: Upstream update timestamp in ISO 8601 when exposed; null otherwise.}
    unit: {type: string, description: Unit category code when exactly one unit is present.}
    dimensions:
      type: array
      items:
        type: object
        properties:
          id: {type: string}
          label: {type: string}
          categories:
            type: array
            items:
              type: object
              properties:
                code: {type: string}
                label: {type: string}
    observations:
      type: array
      description: >-
        One row per permitted Cartesian cell, with dimension ids mapped to category codes,
        time also exposed as period, numeric/null value and optional Eurostat status flag.
      items:
        type: object
        properties:
          period: {type: string}
          value: {type: [number, 'null']}
          status: {type: string}
        additionalProperties: true
    observation_count: {type: integer}
    dropped_observation_count: {type: integer, description: Cells removed because upstream returned a geo outside the commercial allowlist.}
    source: {type: string}
    licence_note: {type: string}
    metadata_limitations: {type: string}
    source_url: {type: string}
    as_of: {type: string}
data_source: Eurostat dissemination statistics API (JSON-stat 2.0)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
gdpr_art_22_classification: data_lookup
processes_personal_data: false
geography: europe
data_access:
  lane: preferred
  acquisition_method: direct_api
  upstream_vendor: Eurostat
test_fixtures:
  known_answer:
    input:
      dataset: nama_10_gdp
      filters: {geo: [SE, DE], unit: CP_MEUR, na_item: B1GQ}
      since_period: '2020'
    expected_fields:
      - {field: dataset, operator: equals, value: nama_10_gdp, reliability: guaranteed}
      - {field: source, operator: equals, value: Eurostat, reliability: guaranteed}
      - {field: observations, operator: type, value: array, reliability: guaranteed}
      - {field: observation_count, operator: type, value: number, reliability: guaranteed}
      - {field: licence_note, operator: not_null, reliability: guaranteed}
  health_check_input:
    dataset: nama_10_gdp
    filters: {geo: SE, unit: CP_MEUR, na_item: B1GQ}
    since_period: '2020'
    until_period: '2020'
output_field_reliability:
  dataset: guaranteed
  label: guaranteed
  updated: common
  unit: common
  dimensions: guaranteed
  observations: guaranteed
  observation_count: guaranteed
  dropped_observation_count: guaranteed
  source: guaranteed
  licence_note: guaranteed
  metadata_limitations: guaranteed
  source_url: guaranteed
  as_of: guaranteed
limitations:
  - title: Historical observations can be revised
    text: Eurostat revises statistics. updated is the upstream timestamp when available; as_of is retrieval time. Status flags are preserved without interpretation.
    category: accuracy
    severity: info
  - title: Requests must fit within 5,000 cells
    text: The full dimension-size product, including missing cells, must not exceed 5,000. Sparse datasets may need narrower filters even if few values are reported.
    category: coverage
    severity: warning
  - title: Dataset and dimension codes must be known
    text: This tool does not search datasets. Find dataset and dimension codes in the Eurostat data browser at https://ec.europa.eu/eurostat/databrowser/.
    category: coverage
    severity: info
  - title: Commercial reuse is restricted by geography and dataset
    text: >-
      https://ec.europa.eu/eurostat/help/copyright-notice permits commercial reuse under Commission
      Decision 2011/833/EU with attribution and modification/non-responsibility notices. geo is required;
      only EU27, EFTA, nine official candidates and explicitly supported EU/euro-area aggregates are
      allowed. All Comext/international-trade datasets are refused, covering Swiss/Liechtenstein
      post-1995 commodity restrictions and Austrian CN8 restrictions. Returned third-party source
      declarations and unrecognised rights notices are refused. No logos or third-party documents are returned.
    category: coverage
    severity: warning
  - title: Metadata may not expose every dataset-specific restriction
    text: >-
      The executor checks source and rights declarations plus trade titles/themes exposed in JSON-stat
      source, extension and annotations. It does not inspect separately linked ESMS documents or catalogue
      notices; missing source declarations are explicitly reported in metadata_limitations. The explicit
      refusal prefixes are ext_, DS- (case-insensitive), comext, itgs_ and trade_. No blanket rights
      clearance of every catalogue dataset is implied.
    category: coverage
    severity: warning
