slug: cypriot-company-data
name: Cypriot Company Data
description: "Look up a Cypriot company by VAT or company number. Director details from DRCOR are available only for C-prefix company numbers."
category: company-data
cost_class: paid_per_call
price_cents: 16
is_free_tier: false
avg_latency_ms: 2200
input_schema:
  type: object
  required:
    - vat_number
  properties:
    vat_number:
      type: string
      description: >-
        Cypriot identifier — CY VAT (CY + 8 digits + letter), bare VAT (8 digits + letter), or company number
        (C + digits, e.g. C165). The same entity can be reached via either shape.
output_schema:
  type: object
  example:
    company_name: Bank of Cyprus Public Company Limited
    native_company_name: Bank of Cyprus Public Company Limited
    registration_number: "C165"
    vat_number: C165
    country_code: CY
    legal_form: null
    status: active
    is_active: true
    registered_date: "1899-01-01"
    registered_address: "Stasinou 51, 2002, Strovolos, CY"
    lei_code: 5493000F3VYZX1KCO540
    nace_codes:
      - code: "6419"
        description: Other monetary intermediation
    company_size: Very large company
    source_as_of: "2026-04-30T12:00:00.000Z"
  properties:
    company_name: { type: string }
    native_company_name: { type: ["string", "null"] }
    registration_number: { type: string }
    vat_number: { type: string }
    country_code: { type: string }
    legal_form: { type: ["string", "null"] }
    status: { type: string, enum: [active, inactive, unknown] }
    is_active: { type: boolean }
    registered_date: { type: ["string", "null"] }
    registered_address: { type: ["string", "null"] }
    lei_code: { type: ["string", "null"] }
    nace_codes: { type: array }
    company_size: { type: ["string", "null"] }
    source_as_of: { type: ["string", "null"] }
    legal_representatives:
      type: array
      description: Canonical legal-representatives shape (DEC-20260518-A). Each entry is { type, name, role, role_code, role_group, date_of_birth, start_date }. date_of_birth + start_date are always null for CY — DRCOR open data does not publish personal IDs or per-row appointment dates.
    total_legal_representatives:
      type: integer
      description: Count of legal_representatives returned from the cy_directors cache. 0 when input was VAT-format (not resolvable against DRCOR) or no rows for this DRCOR registration number.
    tier_2_available:
      type: boolean
      description: True when at least one legal representative is returned. Only C-prefix inputs (e.g. C165) resolve against the DRCOR cache; VAT-format inputs return false.
    tier_2_available_reason:
      type: string
      description: Explanation of tier-2 availability (source + freshness + VAT-not-resolvable caveat) or non-availability.
    ubo_availability:
      type: string
      description: UBO availability flag. CY is unavailable_no_registry — Cyprus UBO Register closed to public access since 2023-01-03 (CJEU C-37/20).
    ubo_availability_reason:
      type: string
    legal_name:
      type: string
      description: Evidence Tier 1 canonical alias (DEC-20260518-A) for company_name. Set unconditionally by the executor — same reliability as company_name.
    primary_registration_id:
      type: string
      description: Evidence Tier 1 canonical alias (DEC-20260518-A) for registration_number. Set unconditionally by the executor — same reliability as registration_number.
    date_incorporated:
      type: ["string", "null"]
      description: Evidence Tier 1 canonical alias (DEC-20260518-A) for registered_date. Set unconditionally by the executor — same reliability as registered_date.
data_source: Openapi.com WW-Top (Tier-3) + data.gov.cy DRCOR open-data CSV (Tier-2 legal_representatives via C-prefix lookup)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: commercial-stable-api
gdpr_art_22_classification: data_lookup
processes_personal_data: true
personal_data_categories:
  - name
  - address
  - professional
geography: eu
test_fixtures:
  known_answer:
    input:
      vat_number: "C165"
    expected_fields:
      - { field: company_name, operator: not_null, reliability: guaranteed }
      - { field: country_code, operator: equals, reliability: guaranteed, value: CY }
      - { field: status, operator: equals, reliability: guaranteed, value: active }
      - { field: is_active, operator: equals, reliability: guaranteed, value: true }
      - { field: registered_address, operator: not_null, reliability: guaranteed }
      - { field: registration_number, operator: not_null, reliability: guaranteed }
  health_check_input:
    vat_number: "C165"
output_field_reliability:
  company_name: guaranteed
  native_company_name: common
  registration_number: guaranteed
  vat_number: guaranteed
  country_code: guaranteed
  legal_form: rare
  status: guaranteed
  is_active: guaranteed
  registered_date: common
  registered_address: guaranteed
  lei_code: common
  nace_codes: common
  company_size: common
  source_as_of: guaranteed
  legal_representatives: common
  total_legal_representatives: common
  tier_2_available: guaranteed
  tier_2_available_reason: guaranteed
  ubo_availability: guaranteed
  ubo_availability_reason: guaranteed
  # Evidence Tier 1 canonical aliases (DEC-20260518-A) — executor sets these
  # unconditionally from company_name / registration_number / registered_date
  # (src/capabilities/cypriot-company-data.ts), so reliability mirrors the
  # source field exactly. MEDIUM-4, 2026-08-17 review: declared here instead
  # of allowlisting the slug — these are known, stable fields, not a legal
  # gate like the recapture itself.
  legal_name: guaranteed
  primary_registration_id: guaranteed
  date_incorporated: common
limitations:
  - title: Tool is currently unavailable
    text: >-
      This tool is currently unavailable and returns a capability-unavailable error.
    category: availability
    severity: warning
  - title: Some companies are missing from the source catalogue
    text: >-
      Accepts CY-prefix VAT, bare VAT and C-prefix company numbers, but valid identifiers can still
      return HTTP 204 with no record. Coverage gaps include some large companies.
    category: coverage
    severity: warning
  - title: Legal form is not included
    text: The company’s legal form is not included in this tool’s response.
    category: coverage
    severity: info
  - title: Director lookup requires a C-prefix company number
    text: >-
      Directors are available only for C-prefix company-number inputs through DRCOR open data.
      CY-prefix and bare VAT inputs cannot resolve directors because the dataset uses registration
      numbers rather than VAT identifiers.
    category: coverage
    severity: info
  - title: Director details can be about four weeks old
    text: >-
      DRCOR director data refreshes monthly, so appointments and resignations filed within about four
      weeks may be missing. Appointment dates are not published, so `start_date` is always null in
      `legal_representatives`.
    category: freshness
    severity: info
  - title: UBO data not available
    text: >-
      Beneficial-owner data is not included. The Cyprus UBO Register is closed to public access.
    category: coverage
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: vendor_aggregation
  upstream_vendor: openapi
  checks: pending
