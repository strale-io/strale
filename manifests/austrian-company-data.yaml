is_free_tier: false
avg_latency_ms: 1500
input_schema:
  type: object
  properties:
    registration_number:
      type: string
      description: Austrian Firmenbuchnummer, up to 6 digits plus a check letter (e.g. "FN 93363 z" or "93363z").
    company_name:
      type: string
      description: >-
        Company name for a registry search. Must resolve to exactly one Firmenbuch entry; ambiguous names return a
        candidate list and require a follow-up call with registration_number.
  anyOf:
    - required: [registration_number]
    - required: [company_name]
