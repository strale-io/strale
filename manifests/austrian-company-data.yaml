limitations:
  - title: Name search must resolve to exactly one entry
    text: >-
      Firmenbuch name search does not rank by relevance. When a company_name query matches more than one entry and no
      unique exact name match exists, the capability refuses with a candidate list (name, FN, seat) instead of
      guessing. Callers should retry with the Firmenbuchnummer from the candidate list.
    category: coverage
    severity: info
    workaround: Call again with registration_number taken from the returned candidate list.
  - title: Status is derived, not a registry field
    text: >-
      The Kurzinformation extract has no dedicated status element. Status is derived from whether current
      (AUFRECHT="true") registration blocks exist; insolvency/liquidation markers surface in status_note only when the
      entry was resolved via name search. Struck-off (gelöscht) companies return an error rather than historical data.
    category: accuracy
    severity: info
  - title: No UBO data
    text: >-
      Austrian beneficial-ownership data lives in the WiEReg (separate register, paid BMF access) and is not part of
      the Firmenbuch HVD datasets. ubo_availability is reported as unavailable_no_registry.
    category: coverage
    severity: info
  - title: Officers limited to the Kurzinformation scope
    text: >-
      The IWG HVD tier returns the Kurzinformation extract: current officers with roles and representation authority.
      Full historical extracts, documents (Urkunden), and shareholder data are not included in the granted scope.
    category: coverage
    severity: info
  - title: VAT numbers are not accepted
    text: >-
      The Firmenbuch is keyed by Firmenbuchnummer, not UID (VAT). The previous vendor path accepted only ATU-format
      VAT input; that contract is retired. UID-to-FN resolution is not offered by the registry API.
    category: coverage
    severity: info
    workaround: Look up the company by name, or find the FN on any official company document or at firmen.wko.at.
  - title: Name-path latency
    text: >-
      Resolving by company_name costs one or two search calls plus the extract call against a SOAP registry
      (~4s typical, slower under registry load). Callers with the Firmenbuchnummer should pass registration_number,
      which is a single call (~1s).
    category: performance
    severity: info
    workaround: Pass registration_number instead of company_name when the FN is known.
  - title: Attribution obligation (CC BY 4.0)
    text: >-
      Data is reused under the Austrian IWG with a CC BY 4.0 attribution condition. Every response carries the
      attribution string in provenance; consumers republishing the data must preserve it.
    category: governance
    severity: info
