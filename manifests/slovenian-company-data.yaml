slug: slovenian-company-data
name: "Slovenian Company Data"
description: "Look up a Slovenian company in the Slovenian Business Register (PRS). Returns registration number, full name, legal form, registering authority and address."
category: company-data
cost_class: free_unlimited
quota_window: none
price_cents: 5
is_free_tier: false
data_source: >-
  Poslovni register Slovenije via data.gov.si CKAN datastore (resource beb70929-3d0d-41c6-9af2-25d525d906d3) — CC-BY
  4.0; attribution: Poslovni register Slovenije, AGENCIJA REPUBLIKE SLOVENIJE ZA JAVNOPRAVNE EVIDENCE IN STORITVE
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
avg_latency_ms: 1500
input_schema:
  type: object
  required:
    - reg_number
  properties:
    reg_number:
      type: string
      description: Slovenian matična številka (7-digit base or 10-digit including 3-digit branch suffix; main entity is suffix 000)
    company_name:
      type: string
      description: Slovenian company name (fuzzy keyword match; first hit returned)
    task:
      type: string
      description: Free-text input — first matching matična številka or company name is used
output_schema:
  type: object
  example:
    company_name: KRKA, tovarna zdravil, d.d., Novo mesto
    reg_number: "5043611000"
    hseid: "100400000138816776"
    legal_form: Delniška družba d.d.
    registration_office: Okrožno sodišče Novo mesto
    address: Šmarješka cesta 006, Novo mesto, 8000 Novo mesto, SLOVENIJA
    settlement: Novo mesto
    postal_code: "8000"
    post_office: Novo mesto
    country: SLOVENIJA
    jurisdiction: SI
  properties:
    company_name:
      type: string
    reg_number:
      type: string
    hseid:
      type: string
    legal_form:
      type: string
    registration_office:
      type: string
    address:
      type: string
    settlement:
      type: string
    postal_code:
      type: string
    post_office:
      type: string
    country:
      type: string
    jurisdiction:
      type: string
processes_personal_data: true
personal_data_categories:
  - name
  - address
  - professional
geography: eu
test_fixtures:
  health_check_input:
    reg_number: "5043611000"
  known_answer:
    input:
      reg_number: "5043611000"
    expected_fields:
      - field: company_name
        operator: not_null
        reliability: guaranteed
      - field: reg_number
        operator: equals
        reliability: guaranteed
        value: "5043611000"
      - field: hseid
        operator: equals
        reliability: guaranteed
        value: "100400000138816776"
      - field: legal_form
        operator: not_null
        reliability: guaranteed
      - field: registration_office
        operator: not_null
        reliability: guaranteed
      - field: address
        operator: not_null
        reliability: guaranteed
      - field: settlement
        operator: not_null
        reliability: guaranteed
      - field: postal_code
        operator: equals
        reliability: guaranteed
        value: "8000"
      - field: post_office
        operator: not_null
        reliability: guaranteed
      - field: country
        operator: equals
        reliability: guaranteed
        value: SLOVENIJA
      - field: jurisdiction
        operator: equals
        reliability: guaranteed
        value: SI
limitations:
  - title: Source dataset refreshes twice monthly
    text: >-
      AJPES refreshes the open dataset every two weeks. More recent registrations, address or name
      changes and dissolutions do not appear until the next snapshot.
    category: freshness
    severity: info
  - title: Status, officers, tax and financial fields are absent
    text: >-
      Returns the registration number, full name, legal form, registering authority and address only.
      Active or dissolved status, registration date, SKD/NACE codes, directors and VAT numbers are
      absent, so this result cannot support decisions requiring those fields.
    category: coverage
    severity: info
  - title: Name search does not favour active companies
    text: >-
      Name search returns the top source-ranked keyword match without additional ranking. The dataset
      has no status or activity field to distinguish active from dissolved companies.
    category: accuracy
    severity: info
    workaround: Pass matična številka (7 or 10 digits) directly when known.
output_field_reliability:
  company_name: guaranteed
  reg_number: guaranteed
  hseid: guaranteed
  legal_form: guaranteed
  registration_office: guaranteed
  address: guaranteed
  settlement: guaranteed
  postal_code: guaranteed
  post_office: guaranteed
  country: guaranteed
  jurisdiction: guaranteed

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: preferred
  acquisition_method: direct_api
