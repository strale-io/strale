limitations:
  - title: Coverage is limited to entities that have an LEI
    text: >-
      Only subsidiaries with registered LEIs appear in GLEIF’s child-company records. A subsidiary
      without an LEI is absent even when its parent relationship is recorded elsewhere; check national
      company registries for businesses outside LEI coverage.
    category: coverage
    severity: info
  - title: Direct and ultimate child lists differ
    text: >-
      The default `level` value direct returns immediate children only; ultimate returns entities
      reporting this LEI as their ultimate parent. Ultimate-child lists can be large, so use `limit`
      to bound the response.
    category: accuracy
    severity: info
  - title: Only the first page of children is returned
    text: >-
      `total_children` gives the full count, but only the first page is returned. If the count exceeds
      the returned list length, `paginated` is true; subsequent pages cannot be retrieved through this
      tool.
    category: coverage
    severity: warning

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: preferred
  acquisition_method: direct_api
  upstream_vendor: gleif
