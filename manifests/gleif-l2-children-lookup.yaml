        reliability: guaranteed
      - field: has_children
        operator: equals
        reliability: guaranteed
        value: true
      - field: is_holding_entity
        operator: equals
        reliability: guaranteed
        value: true
      - field: children
        operator: not_null
        reliability: guaranteed
      - field: paginated
        operator: equals
        reliability: guaranteed
        value: false
      - field: data_source
