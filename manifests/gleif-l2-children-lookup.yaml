output_field_reliability:
  input_lei: guaranteed
  legal_name: guaranteed
  jurisdiction: guaranteed
  level: guaranteed
  total_children: guaranteed
  has_children: guaranteed
  is_holding_entity: guaranteed
  children: guaranteed
  paginated: guaranteed
