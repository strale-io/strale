slug: gleif-l2-children-lookup
name: "LEI Subsidiaries Lookup"
description: "List the direct and ultimate subsidiaries of an entity from GLEIF ownership data, to see whether it is a holding company and what it owns."
category: compliance
cost_class: free_unlimited
quota_window: none
price_cents: 5
is_free_tier: false
avg_latency_ms: 800
input_schema:
  type: object
  required: []
  properties:
    lei:
      type: string
      description: 20-character LEI of the entity to look up children for. Canonical input.
    company_name:
      type: string
      description: Optional fallback input — company name to search GLEIF for if no LEI is known. Resolves to an LEI internally.
    jurisdiction:
      type: string
      description: Optional ISO country code (e.g. "LU") to disambiguate name search.
    level:
      type: string
      description: Optional. Either "direct" (immediate children) or "ultimate" (full descendant tree). Default direct.
    limit:
      type: integer
      description: Optional max number of children to return per page (default 20, max 200).
output_schema:
  type: object
  example:
    input_lei: 549300B4X0JHWV0DTD60
    legal_name: SPOTIFY TECHNOLOGY S.A.
    jurisdiction: LU
    level: direct
    total_children: 2
    has_children: true
    is_holding_entity: true
    children:
      - lei: 335800LYVN89V3RVI889
        legal_name: SPOTIFY INDIA LLP
        jurisdiction: IN
        country: IN
    paginated: false
    data_source: GLEIF Level 2 (Who Owns Whom)
  properties:
    input_lei:
      type: string
    legal_name:
      type: string
    jurisdiction:
      type:
        - string
        - "null"
    level:
      type: string
    total_children:
      type: integer
    has_children:
      type: boolean
    is_holding_entity:
      type: boolean
    children:
      type: array
    paginated:
      type: boolean
    data_source:
      type: string
data_source: GLEIF Level 2 (Who Owns Whom)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
gdpr_art_22_classification: data_lookup
processes_personal_data: false
geography: global
