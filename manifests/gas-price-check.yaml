slug: gas-price-check
name: Gas Price Check
description: >-
  Current gas fees on Ethereum, Polygon or BNB Chain: safe, proposed and fast prices in Gwei plus the base fee,
  computed from the priority fees actually paid over the last 20 blocks.
category: web3
cost_class: free_quota
quota_window: daily
quota_cap: 100000
price_cents: 2
is_free_tier: false
input_schema:
  type: object
  properties:
    chain_id:
      type: string
      description: "Chain ID: 1 (Ethereum), 137 (Polygon PoS) or 56 (BNB Smart Chain). Rollups are refused. Default: 1"
