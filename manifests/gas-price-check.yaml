limitations:
  - title: null
    text: >-
      Output reflects Ethereum fee history (eth_feeHistory via Alchemy) at query time. Dependent on upstream API availability; may degrade
      if the provider rate-limits or is temporarily unavailable.
    category: availability
    severity: info
    workaround: null
  - title: "Chains covered"
    text: >-
      Ethereum (1), Polygon PoS (137) and BNB Smart Chain (56). Rollups such as Base, Arbitrum and OP Mainnet are refused: most of a transaction's cost there is the fee for posting its data to Ethereum, which fee history does not contain, so these tiers would understate it.
    category: coverage
    severity: info
    workaround: null
  - title: "Fee tiers are computed, not quoted"
    text: >-
      Safe, proposed and fast are the next block's base fee plus the median priority fee paid at the 10th, 50th and 90th percentile over the last 20 blocks. They are estimates of what recent transactions paid, not a guarantee of inclusion.
    category: accuracy
    severity: info
    workaround: null
