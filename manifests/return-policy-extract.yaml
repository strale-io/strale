limitations:
  - title: Complex conditions and exceptions can be simplified
    text: >-
      Complex conditional policies and product-specific exceptions may be simplified during
      extraction.
    category: accuracy
    severity: info
    workaround: Verify extracted terms against the retailer's full return policy page for product-category-specific conditions
  - title: Output size cap per call
    text: >-
      Structured output is limited to about 2000 output tokens per call; requests exceeding this limit
      are refused rather than returned truncated. Requests with large results can exceed this limit,
      and repeating the same request does not help.
    category: coverage
    severity: info
    workaround: Read the retailer’s full return policy directly for conditions that exceed the output limit.
  - title: Sites that refuse automated requests are not read
    text: >-
      When the site answers HTTP 401, 403, 407 or 429, shows an anti-bot challenge page instead of the content, or disallows the page in robots.txt, or its robots.txt cannot be fetched (a network or server error), the call fails with an error and is not billed. Strale does not retry through another route, so repeating the call does not change the answer. Unless the address you send is already a return, refund or shipping page, common policy paths are tried first and a candidate that robots.txt disallows is skipped; if none is found, the page you sent is analysed, and policy_url names the page that was analysed.
    category: availability
    severity: info
    workaround: Check policy_url, and send the return policy page's own address when it differs.

