limitations:
  - title: null
    text: >-
      Output reflects Alchemy's JSON-RPC and transfer index for the requested chain at query time. Dependent on upstream API availability; may degrade
      if the provider rate-limits or is temporarily unavailable.
    category: availability
    severity: info
    workaround: null
  - title: "Chains covered"
    text: >-
      Ethereum (1), Base (8453), Arbitrum One (42161), OP Mainnet (10) and Polygon PoS (137), read through Alchemy; any other chain_id is refused. These are the chains for which Alchemy documents its transfer index and block timestamps. Values are in the chain's native coin, named in native_symbol (POL on Polygon).
    category: coverage
    severity: info
    workaround: null
  - title: "No gas or failure status"
    text: >-
      Transactions come from a transfer index without receipts, so gas_used and is_error are always null, and contract calls that moved none of the chain's native coin are not listed.
    category: coverage
    severity: info
    workaround: null
