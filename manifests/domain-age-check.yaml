slug: domain-age-check
name: "Domain Age Check"
description: "Find when a domain was registered: creation date, age in days, registrar and expiry. A newly registered domain is a common fraud signal."
category: data-extraction
cost_class: free_unlimited
quota_window: none
price_cents: 3
is_free_tier: false
input_schema:
  type: object
  required:
    - domain
  properties:
    domain:
      type: string
      description: Domain name to check (e.g., google.com)
output_schema:
  type: object
  properties:
    domain:
      type: string
    created_date:
      type: string
    age_days:
      type: integer
    age_years:
      type: number
    registrar:
      type: string
    expiry_date:
      type: string
    is_new:
      type: boolean
    risk_indicator:
      type: string
data_source: RDAP via the IANA bootstrap, with direct registry WHOIS fallback
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
processes_personal_data: false
geography: global
test_fixtures:
  known_answer:
    input:
      domain: "google.com"
    expected_fields:
      - field: domain
        operator: equals
        value: "google.com"
        reliability: guaranteed
      - field: age_days
        operator: gt
        value: 5000
        reliability: guaranteed
      - field: is_new
        operator: equals
        value: false
        reliability: guaranteed
  health_check_input:
    domain: "google.com"
output_field_reliability:
  domain: guaranteed
  created_date: common
  age_days: guaranteed
  age_years: guaranteed
  registrar: common
  expiry_date: common
  is_new: guaranteed
  risk_indicator: guaranteed
limitations:
  - title: Registration-date coverage
    text: >-
      Registration dates come from the registry's RDAP service, or WHOIS where the TLD has no RDAP service. Some
      ccTLD registries publish no creation date; for those, and for a TLD with neither service, the call fails and
      is not charged.
    category: coverage
    severity: info
  - title: Rate limiting
    text: >-
      Some WHOIS servers rate-limit queries, so high-volume lookups may be throttled. A throttled lookup fails and
      is not charged.
    category: dependency
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: preferred
  acquisition_method: primary_source
