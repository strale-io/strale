slug: german-company-data
name: "German Company Data"
description: "Look up a company in the German commercial register (Handelsregister). Returns name, register number, court, legal form, status, address, directors, capital, LEI, and incorporation and closure dates."
category: company-data
price_cents: 20
is_free_tier: false
avg_latency_ms: 600
# OpenRegister Free includes 500 credits per rolling 30 days. A normal name
# lookup consumes 11 credits, so 45 complete calls is the conservative
# capability-level equivalent used by the internal test budget. The Vendor
# Control Tower stores the exact reset timestamp returned by GET /v1/credits.
cost_class: free_quota
quota_window: monthly
quota_cap: 45
quota_reset_dom: 7
input_schema:
  type: object
  required: []
  properties:
    company_id:
      type: string
      description: >-
        OpenRegister canonical id, e.g. "DE-HRB-F1103-267645". Preferred when known —
        skips name resolution and consumes one fewer API call.
    hrb_number:
      type: string
      description: >-
        Handelsregister number (e.g. "HRB 2001"). When provided, 'court' is also required —
        HRB/HRA numbers are per-court and not globally unique.
    court:
      type: string
      description: >-
        Registergericht (German commercial court). Required when providing 'hrb_number'.
        Example: "Amtsgericht Landsberg a. Lech".
    company_name:
      type: string
      description: Company name for fuzzy search via /v1/autocomplete/company.
output_schema:
  type: object
  properties:
    company_name:
      type:
        - string
        - "null"
    company_id:
      type: string
    registration_number:
      type:
        - string
        - "null"
    register_type:
      type:
        - string
        - "null"
    court:
      type:
        - string
        - "null"
    country_code:
      type: string
    legal_form:
      type:
        - string
        - "null"
    status:
      enum:
        - active
        - terminated
        - unknown
      type: string
    is_active:
      type:
        - boolean
        - "null"
    registered_address:
      type:
        - object
        - "null"
    business_description:
      type:
        - string
        - "null"
    industry_codes:
      type: array
    directors:
      type: array
    capital:
      type:
        - object
        - "null"
    lei:
      type:
        - string
        - "null"
    incorporated_at:
      type:
        - string
        - "null"
    terminated_at:
      type:
        - string
        - "null"
data_source: OpenRegister (api.openregister.de)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
processes_personal_data: true
personal_data_categories:
  - name
  - address
  - professional
geography: eu
test_fixtures:
  known_answer:
    input:
      company_name: "SAP SE"
    expected_fields:
      - field: company_name
        operator: contains
        reliability: guaranteed
        value: "SAP"
      - field: country_code
        operator: equals
        reliability: guaranteed
        value: "DE"
      - field: company_id
        operator: not_null
        reliability: guaranteed
      - field: status
        operator: not_null
        reliability: guaranteed
  health_check_input:
    company_name: "SAP SE"
output_field_reliability:
  company_name: guaranteed
  company_id: guaranteed
  registration_number: guaranteed
  register_type: guaranteed
  court: guaranteed
  country_code: guaranteed
  legal_form: common
  status: guaranteed
  is_active: guaranteed
  registered_address: common
  business_description: common
  industry_codes: common
  directors: common
  capital: common
  lei: rare
  incorporated_at: common
  terminated_at: rare
limitations:
  - title: Provider credits and rate limits affect availability
    text: >-
      OpenRegister allows 500 credits per rolling 30 days on the configured plan; a name lookup
      normally uses 11 credits and a `company_id` lookup 10. HTTP 402 indicates exhausted credits and
      HTTP 429 a short-term rate limit; the tool can be paused until usable credits are restored.
    category: cost
    severity: warning
    workaround: >-
      Use `company_id` when known and reuse results within the permitted refresh window to avoid
      repeated lookups.
  - title: UBO data not covered
    text: >-
      Beneficial ownership from the German Transparenzregister is not included.
    category: coverage
    severity: info
    workaround: Request beneficial-ownership information directly from the Transparenzregister with authorised access.
  - title: Stored registry data can be up to four weeks old
    text: >-
      Company records are refreshed at least every four weeks, with daily updates for financials and
      new incorporations. The tool does not request a live Handelsregister refresh.
    category: freshness
    severity: info
    workaround: >-
      For same-day filings, check Handelsregister directly; `provenance.fetched_at` records retrieval
      time rather than the original filing time.
  - title: HRB/HRA numbers require court (Registergericht)
    text: >-
      HRB and HRA numbers are unique only within their registration court, so the same number can
      identify different companies. Both `hrb_number` and `court` are required for a number lookup.
    category: coverage
    severity: warning
    workaround: >-
      Prefer 'company_id' (OpenRegister canonical, e.g. "DE-HRB-F1103-267645") when
      known — it skips the autocomplete step and consumes one fewer Free-tier credit.

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: vendor_aggregation
  upstream_vendor: openregister
  checks: pending
