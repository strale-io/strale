slug: website-to-company
name: Website to Company
description: "Currently unavailable. Infer a company name from website metadata and try a registry lookup using its domain's country."
category: company-data
cost_class: paid_prepaid
quota_window: none
price_cents: 80
is_free_tier: false
input_schema:
  type: object
  required:
    - url
  properties:
    url:
      type: string
      description: Website URL or domain name (e.g. spotify.com or https://bmw.de)
output_schema:
  type: object
  properties:
    domain:
      type: string
    company_name_extracted:
      type: string
    country_detected:
      type: string
    company:
      type: object
    resolution_method:
      type: string
    registry_used:
      type: string
    confidence:
      type: string
    whois:
      type: object
data_source: Website metadata + national company registries
data_source_type: computed
transparency_tag: ai_generated
freshness_category: live-fetch
maintenance_class: commercial-stable-api
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
processes_personal_data: false
geography: global

test_fixtures:
  known_answer:
    input:
      url: "https://equinor.com"
    expected_fields:
      - field: domain
        operator: equals
        value: "equinor.com"
        reliability: guaranteed
      - field: resolution_method
        operator: not_null
        reliability: guaranteed
      - field: confidence
        operator: not_null
        reliability: guaranteed
  health_check_input:
    url: "https://spotify.com"

output_field_reliability:
  domain: guaranteed
  company_name_extracted: common
  country_detected: common
  company: rare
  resolution_method: guaranteed
  registry_used: rare
  confidence: guaranteed
  whois: common

limitations:
  - title: Company name extraction depends on website metadata quality
    text: >-
      Company names are inferred from website titles and metadata. Generic titles or missing metadata
      can prevent a usable name from being returned.
    category: accuracy
    severity: info
  - title: Country detection only works for ccTLDs
    text: >-
      .com, .org, .net and other gTLDs do not indicate a country.
      Country detection works for ccTLDs like .se, .de, .dk, .fi, .no, .uk.
    category: coverage
    severity: warning
  - title: WHOIS registrant details are often redacted
    text: >-
      WHOIS registrant details are redacted for most top-level domains. This tool extracts company
      names from website content instead.
    category: coverage
    severity: info
