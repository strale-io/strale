limitations:
  - title: Only publicly visible technologies are detected
    text: >-
      Detects technologies visible in public-facing web properties — internal tools and backend infrastructure are not
      visible
    category: accuracy
    severity: info
    workaround: Cross-reference with job postings (job-board-search) to infer backend technologies from required skills
  - title: Only the homepage is read
    text: >-
      One rendered fetch of the homepage and its response headers are analysed, with public DNS records. Tools that
      load only on other pages (checkout, app, docs, pricing) or only for signed-in users are not seen, and the
      list is not complete for any site.
    category: coverage
    severity: info
  - title: Versions only when the page or a header states them
    text: >-
      A version is reported only when the page or a response header states one (a generator tag, a file path,
      or a header such as Server or X-Powered-By). Many technologies state none, so version is null.
    category: accuracy
    severity: info
  - title: DNS signals describe the organisation, not the page
    text: >-
      Email provider, DNS host and domain-verification hints come from public DNS records of the registrable
      domain and the CNAME of the host. If a DNS lookup fails, the result says so under dns_status and warnings.
    category: accuracy
    severity: info
  - title: Technologies named only by the AI summary are lower confidence
    text: >-
      Entries whose evidence reads "AI analysis of the page excerpt and signals" come from a summary of part of the
      page, not from a matched signature, and can be wrong or generic.
    category: accuracy
    severity: info

