# NOTE — manifest-canonical metadata is intentionally stale relative to the
# multi-provider executor. The router at src/capabilities/vat-validate.ts
# now dispatches to VIES (EU27 + XI), HMRC (GB), Brønnøysundregistrene (NO),
# and the Swiss UID register (CH/LI), but the capability's name, description,
# input_schema, output_schema, data_source, and output_field_reliability
# below are kept matching the DB (single-provider VIES era) because the
# onboarding pipeline does not currently support updating manifest-canonical
# fields on existing capabilities.
#
# Per-call audit-trail provenance IS honest — each provider module records
# its own `provenance.source` so audit records reflect the actual upstream.
# Only the catalog-level metadata is temporarily stale.
#
# Tracked fix: Notion To-do "Multi-provider capabilities as first-class
# shape" (page 34f67c87-082c-8166-aaf6-dcaa53bfd8ec). When that ships, this
# manifest's metadata + the DB row will be updated together properly.

slug: vat-validate
name: "EU VAT Validation"
description: "Check a European VAT number in VIES and get the registered company name, address and validity. Repeat lookups within 48 hours come from cache, and cached data is served while VIES is down."
category: validation
cost_class: free_unlimited
quota_window: none
price_cents: 2
is_free_tier: false
input_schema:
  type: object
  required:
    - vat_number
  properties:
    vat_number:
      type: string
      description: EU VAT number including country prefix (e.g. SE556703748501)
output_schema:
  type: object
  example:
    valid: true
    vat_number: SE556703748501
    company_name: Spotify AB
    country_code: SE
    request_date: 2026-04-03+02:00
    company_address: "REGERINGSGATAN 19 \n111 53 STOCKHOLM"
  properties:
    valid:
      type: boolean
    vat_number:
      type: string
    company_name:
      type: string
    country_code:
      type: string
    company_address:
      type: string
data_source: VIES (EU VAT Information Exchange System, European Commission)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
processes_personal_data: false
geography: eu
test_fixtures:
  known_answer:
    input:
      vat_number: DE811128135
    expected_fields:
      - field: valid
        operator: is_true
        reliability: guaranteed
  health_check_input:
    vat_number: SE556703748501
output_field_reliability:
  valid: guaranteed
  vat_number: guaranteed
  company_name: guaranteed
  country_code: guaranteed
  company_address: guaranteed
limitations:
  - title: VIES can be unavailable or limit requests
    text: >-
      VIES can be unavailable or throttle requests under unpublished per-member-state limits.
      Transient faults are retried, and cached results, including older fallback results, can be
      returned during outages.
    category: availability
    severity: warning
    workaround: Lookups within 48 hours can use cached results; if VIES is unavailable and no cached result exists, retry later.
  - title: Registration changes and cached results can lag
    text: >-
      Results can be cached for 48 hours, and national registry changes can take a further 24 hours to
      appear in VIES. Check the national tax authority directly for same-day registration or
      deregistration confirmation.
    category: freshness
    severity: info
    workaround: For real-time same-day verification, contact the national tax authority directly.
  - title: Swiss UID public-tier VAT lookup is boolean only
    text: >-
      Swiss UID validation returns valid or invalid only, without a company name or address. This tool
      does not perform the separate enrichment lookup, whose public service is limited to 20 requests
      per minute.
    category: coverage
    severity: info
    workaround: For Swiss company name + address, call the swiss-company-data capability.
  - title: UK VAT checks are unavailable without HMRC access
    text: >-
      GB VAT numbers return a credentials-pending error when the HMRC connection is not configured.
    category: availability
    severity: info
    workaround: Use vat-format-validate for GB format checks; it does not confirm VAT registration.

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: preferred
  acquisition_method: direct_api
  upstream_vendor: European Commission VIES; national VAT registries including Brønnøysundregistrene
