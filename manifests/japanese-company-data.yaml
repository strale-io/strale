slug: japanese-company-data
name: Japanese Company Data
description: Look up a Japanese company in the National Tax Agency's corporate
  number system by its 13-digit number or name.
category: data-extraction
cost_class: free_unlimited
quota_window: none
price_cents: 80
is_free_tier: false
input_schema:
  type: object
  anyOf:
    - required:
        - corporate_number
    - required:
        - company_name
    - required:
        - task
  properties:
    corporate_number:
      type: string
      minLength: 2
      description: 13-digit corporate number with valid NTA check digit, or registered
        company name
    company_name:
      type: string
      minLength: 2
      maxLength: 150
      description: Registered Japanese or English company name. Multiple matches
        require a corporate number.
    task:
      type: string
      minLength: 2
      description: Corporate number or literal registered company name;
        natural-language requests are not resolved.
output_schema:
  type: object
  properties:
    status:
      type: string
      enum:
        - active
        - inactive
        - dissolved
        - closed
        - unknown
    registration_number:
      type: string
    company_name:
      type:
        - string
        - "null"
    business_type:
      type:
        - string
        - "null"
    address:
      type:
        - string
        - "null"
    registration_date:
      type:
        - string
        - "null"
    industry:
      type:
        - string
        - "null"
    directors:
      type:
        - string
        - "null"
    assignment_date:
      type:
        - string
        - "null"
    last_updated:
      type:
        - string
        - "null"
    english_name:
      type:
        - string
        - "null"
    furigana:
      type:
        - string
        - "null"
    postal_code:
      type:
        - string
        - "null"
    process_code:
      type:
        - string
        - "null"
    process_description:
      type:
        - string
        - "null"
    close_date:
      type:
        - string
        - "null"
    close_reason_code:
      type:
        - string
        - "null"
    close_reason:
      type:
        - string
        - "null"
    successor_corporate_number:
      type:
        - string
        - "null"
    search_excluded:
      type:
        - boolean
        - "null"
    attribution:
      type: string
data_source: National Tax Agency Corporate Number Web-API v4 (Japan)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
