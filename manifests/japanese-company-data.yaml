limitations:
  - title: Corporate-number register coverage
    text: Covers all entities assigned a Japanese corporate number, including
      non-company organisations. Officers, financial statements and industry
      data are not provided. The number-assignment date is not an incorporation
      date.
    category: coverage
    severity: info
  - title: Names and addresses follow the register
    text: Japanese and registered English names are supported. English names are
      optional. Multiple matches require a corporate number. Names or address
      characters supplied only as image references may be incomplete;
      search-excluded records can contain obsolete addresses. Number withdrawal
      records can omit the name.
    category: coverage
    severity: info
  - title: Registry status is not a trading or insolvency assessment
    text: Closure and restoration follow NTA process codes and closure reasons. A
      registrar closure does not establish dissolution. An open record does not
      establish trading activity or absence of insolvency.
    category: coverage
    severity: info
  - title: Official data reuse and attribution
    text: "NTA API Article 7 incorporates the content terms and Public Data License
      1.0, permitting commercial reuse and redistribution with attribution and
      processing disclosure. Responses include the Article 6 disclaimer. Terms:
      https://www.houjin-bangou.nta.go.jp/webapi/riyokiyaku.html and
      https://www.houjin-bangou.nta.go.jp/riyokiyaku/ (read 2026-10-27). Heavy
      bursts are prohibited; access restrictions are honoured without retries."
    category: coverage
    severity: info
  - title: Qualified invoice issuer status is not included
    text: Corporate numbers do not establish T-number invoice registration. That
      check requires the separate qualified-invoice-system application ID and
      API.
    category: coverage
    severity: info
data_access:
  lane: preferred
  acquisition_method: direct_api
  upstream_vendor: nta-houjin
external_cost_cents: 0
avg_latency_ms: 1500
