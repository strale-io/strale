limitations:
  - title: Interim register, published weekly
    text: >-
      Reads ESMA's interim MiCA register (the NCASP.csv file on ESMA's MiCA page), which lists entities that national
      competent authorities have reported as providing crypto-asset services without authorisation. It is
      republished weekly and is interim; ESMA plans to fold it into its own IT systems. Not being on the list does
      not confirm compliance.
    category: freshness
    severity: info
    workaround: null
  - title: Stale or unavailable register
    text: >-
      `register_last_updated` is the file's publication date. Past 45 days the answer carries `register_stale: true`
      and a note; past 120 days, or when ESMA cannot be read, the call fails (and is not charged) instead of
      answering from old data.
    category: availability
    severity: info
    workaround: null
  - title: Name matching
    text: >-
      Matches by website, then a case-insensitive name contains on the legal and commercial name; at most three
      matches are returned.
    category: coverage
    severity: info
    workaround: null

