limitations:
  - title: Breach databases and custom policies are not checked
    text: >-
      Evaluates entropy and common patterns — cannot check against breach databases or organization-specific password
      policies
    category: coverage
    severity: info
    workaround: Check candidate passwords against a breached-password database separately.
  - title: Passwords submitted before 27 October 2026 may still be held
    text: >-
      The password is never sent to a third party and is not stored: it is replaced before anything
      about the call is written down or hashed, so the transaction record keeps only a placeholder.
      Requests made before 27 October 2026 were recorded with the password, and those records are held
      until their normal 90-day redaction.
    category: privacy
    severity: info
    workaround: If you scored a live password before 27 October 2026, treat it as exposed and change it.

