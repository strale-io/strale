output_field_reliability:
  data: guaranteed
  page_title: guaranteed
limitations:
  - title: Some website sources are unsupported
    text: >-
      Unsupported website URLs return a policy error before the page is read. Repeating the same
      request does not return content.
    category: coverage
    severity: warning
  - title: Login, CAPTCHA and multi-step pages are inaccessible
    text: Renders pages via headless browser — pages requiring login, CAPTCHA, or multi-step navigation cannot be accessed
    category: coverage
    severity: info
    workaround: Use an accessible public page containing the information you need.
  - title: Complex layouts can lose structural context
    text: AI extraction interprets page content — complex data tables or deeply nested layouts may lose structural context
    category: accuracy
    severity: info
    workaround: Use structured-scrape with CSS selectors when you know the page structure, and review complex tables against the original.
  - title: Output size cap per call
    text: >-
      Structured output is limited to about 16000 output tokens per call; requests exceeding this
      limit are refused rather than returned truncated. Requests with large results can exceed this
      limit, and repeating the same request does not help.
    category: coverage
    severity: info
    workaround: Narrow the 'extract' instruction, or split the request into multiple calls (e.g. one page or one section at a time)
  - title: Pages are limited to 16 MiB of HTML
    text: >-
      Pages with more than 16 MiB of HTML are refused with a caller_input error naming the input
      field. The call is not charged, and the page is not retried through another fetch or rendering
      route.
    category: coverage
    severity: info

