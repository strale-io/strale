limitations:
  - title: Sources whose Terms of Service forbid automated access are rejected
    text: >-
      URLs on sites whose Terms of Service prohibit automated access (Trustpilot, Glassdoor,
      LinkedIn, Google Search and the major social platforms) are rejected before any fetch is
      attempted, returning a policy error with compliant alternatives where they exist. Retrying
      will not succeed. Strale adds a source back only under a licensed API agreement.
    category: coverage
    severity: warning
  - title: Pages requiring login, CAPTCHA, or multi-step navigation cannot be accessed via headless browser
    text: Renders pages via headless browser — pages requiring login, CAPTCHA, or multi-step navigation cannot be accessed
    category: coverage
    severity: info
    workaround: For authenticated content, pre-fetch the HTML and pass it directly as input instead of a URL
  - title: AI extraction may lose structural context in complex data tables or deeply nested page layouts
    text: AI extraction interprets page content — complex data tables or deeply nested layouts may lose structural context
    category: accuracy
    severity: info
    workaround: Use structured-scrape with CSS selectors for precise extraction when you know the page structure
  - title: Output size cap per call
    text: >-
      Extractions whose structured output would exceed the per-call budget (~16k output tokens) are refused
      rather than returned truncated — for example a page listing 100+ items when 'extract' asks for every one
      of them in detail. Retrying the identical request will not help.
    category: coverage
    severity: info
    workaround: Narrow the 'extract' instruction, or split the request into multiple calls (e.g. one page or one section at a time)
