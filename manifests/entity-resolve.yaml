slug: entity-resolve
name: Entity Resolve
description: Resolve a company LEI, ISIN, BIC, VAT or registry number to a canonical GLEIF entity, with its available identifiers and legal address.
category: company-data
price_cents: 15
external_cost_cents: 0
cost_class: free_unlimited
quota_window: none
is_free_tier: false
data_source: GLEIF public API; VIES via vat-validate for EU VAT inputs
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
gdpr_art_22_classification: data_lookup
processes_personal_data: false
geography: global
avg_latency_ms: 800
data_access:
  lane: preferred
  acquisition_method: direct_api
  upstream_vendor: gleif
input_schema:
  type: object
  required: [identifier]
  additionalProperties: false
  properties:
    identifier:
      type: string
      minLength: 1
      maxLength: 100
      description: Company identifier; LEI and ISIN check digits are checked before fetching.
    type:
      type: string
      enum: [lei, bic, isin, vat, registry]
      description: Identifier type. Supply a hint when the identifier cannot be detected unambiguously.
    country:
      type: string
      pattern: '^[A-Za-z]{2}$'
      description: ISO2 country code, required for registry identifiers.
output_schema:
  type: object
  required: [resolved, as_of]
  properties:
    resolved: { type: boolean }
    reason: { type: string }
    match_method:
      type: string
      enum: [lei_direct, isin_mapping, bic_mapping, registry_id, name_country]
    bic_matched: { type: string }
    confidence:
      type: string
      enum: [exact, probable]
    entity:
      type: object
      required: [legal_name, lei, lei_status, jurisdiction, legal_form, registration_authority_id, registry_number, entity_status, headquarters_country, legal_address]
      properties:
        legal_name: { type: string }
        lei: { type: string }
        lei_status: { type: [string, 'null'] }
        jurisdiction: { type: [string, 'null'] }
        legal_form: { type: [string, 'null'] }
        registration_authority_id: { type: [string, 'null'] }
        registry_number: { type: [string, 'null'] }
        entity_status: { type: [string, 'null'] }
        headquarters_country: { type: [string, 'null'] }
        legal_address:
          type: [object, 'null']
          description: GLEIF company legal address, preserved as published; not a person's address.
          properties:
            language: { type: [string, 'null'] }
            addressLines: { type: array, items: { type: string } }
            addressNumber: { type: [string, 'null'] }
            addressNumberWithinBuilding: { type: [string, 'null'] }
            mailRouting: { type: [string, 'null'] }
            city: { type: [string, 'null'] }
            region: { type: [string, 'null'] }
            country: { type: [string, 'null'] }
            postalCode: { type: [string, 'null'] }
    identifiers:
      type: object
      required: [lei, bic, bic_count, isin_count, registry_number]
      properties:
        lei: { type: string }
        bic: { type: array, maxItems: 25, items: { type: string } }
        bic_count: { type: integer, minimum: 0 }
        isin_count: { type: integer, minimum: 0 }
        vat: { type: string }
        registry_number: { type: [string, 'null'] }
    as_of:
      type: string
      format: date-time
      description: GLEIF Golden Copy publication date where available, otherwise fetch time.
test_fixtures:
  known_answer:
    input: { identifier: HWUPKR0MPOU8FGXBT394, type: lei }
    expected_fields:
      - { field: resolved, operator: equals, value: true, reliability: guaranteed }
      - { field: as_of, operator: not_null, reliability: guaranteed }
  health_check_input: { identifier: HWUPKR0MPOU8FGXBT394, type: lei }
output_field_reliability:
  resolved: guaranteed
  reason: rare
  match_method: common
  bic_matched: rare
  confidence: common
  entity: common
  entity.legal_name: common
  entity.lei: common
  entity.lei_status: common
  entity.jurisdiction: common
  entity.legal_form: common
  entity.registration_authority_id: common
  entity.registry_number: common
  entity.entity_status: common
  entity.headquarters_country: common
  entity.legal_address: common
  entity.legal_address.language: common
  entity.legal_address.addressLines: common
  entity.legal_address.addressNumber: rare
  entity.legal_address.addressNumberWithinBuilding: rare
  entity.legal_address.mailRouting: rare
  entity.legal_address.city: common
  entity.legal_address.region: common
  entity.legal_address.country: common
  entity.legal_address.postalCode: common
  identifiers: common
  identifiers.lei: common
  identifiers.bic: common
  identifiers.bic_count: common
  identifiers.isin_count: common
  identifiers.vat: rare
  identifiers.registry_number: common
  as_of: guaranteed
limitations:
  - title: LEI coverage only
    text: Only entities with GLEIF LEI records can resolve. A clean absence or nonunique match returns resolved false; identifiers are those published by GLEIF.
    category: coverage
    severity: info
  - title: VAT matches are probable
    text: EU and XI VAT inputs use VIES, but DE and ES inputs are refused because trader names are unavailable there; use a registry number with country and type registry instead. Other VAT inputs resolve only on a unique legal-name and country match, marked probable, and stale validation is rejected.
    category: coverage
    severity: info
  - title: Registry authority and number
    text: Registry inputs need a country, an identifiable GLEIF registration authority and number formatting matching GLEIF. Multiple candidates are not automatically selected.
    category: coverage
    severity: info
  - title: BIC and ISIN mappings can be incomplete
    text: GLEIF BIC and ISIN mappings can be incomplete. Source data does not imply endorsement by GLEIF.
    category: coverage
    severity: info
  - title: VIES availability and latency
    text: VAT inputs depend on VIES availability and take about 1–3 seconds because they call VIES first. LEI, ISIN, BIC and registry inputs do not depend on VIES.
    category: freshness
    severity: info
  - title: BIC mapping and output limits
    text: An unmatched 11-character BIC is retried once with its first eight characters plus XXX, which identifies the main office rather than the branch; `bic_matched` records the matched code. At most 25 entries appear in `identifiers.bic`, while `bic_count` gives the full source count.
    category: coverage
    severity: info
