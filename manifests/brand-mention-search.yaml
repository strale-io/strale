limitations:
  - title: Social, private and paywalled mentions are excluded
    text: Searches web results via Serper.dev — does not cover social media posts, private forums, or paywalled content
    category: coverage
    severity: info
    workaround: >-
      Check the brand’s official social accounts and relevant forums directly for mentions outside
      web-search coverage.
  - title: New mentions can take over 24 hours to appear
    text: Results depend on Google's index — very recent mentions (under 24 hours) may not yet appear
    category: freshness
    severity: info
    workaround: >-
      Check the original publication directly for mentions from the last 24 hours.
  - title: Output size cap per call
    text: >-
      Structured output is limited to about 3000 output tokens per call; requests exceeding this limit
      are refused rather than returned truncated. A high `max_results` value can exceed this limit; an
      identical retry does not help.
    category: coverage
    severity: info
    workaround: Reduce max_results to shrink the number of search results analysed per call

