slug: tech-stack-detect
name: "Tech Stack Detection"
description: "Detect the technology a website runs on (CMS, frameworks, analytics, CDN, payments and marketing tools) from its headers and HTML."
category: web-intelligence
cost_class: free_unlimited
quota_window: none
price_cents: 3
is_free_tier: false
input_schema:
  type: object
  required: []
  properties:
    url:
      type: string
      description: Website URL (e.g. https://example.com)
    domain:
      type: string
      description: Domain name (e.g. example.com) — use this or url
  anyOf:
    - required:
        - url
    - required:
        - domain
output_schema:
  type: object
  example:
    url: https://example.com/
    technologies_detected: 5
    technologies:
      - name: Nginx
        category: hosting
        confidence: high
        evidence: HTTP header server
        version: 1.24.0
      - name: WordPress
        category: cms
        confidence: high
        evidence: meta generator tag
        version: 6.4.2
      - name: Google Tag Manager
        category: tag-manager
        confidence: high
        evidence: HTML content pattern
        version: null
      - name: PHP
        category: framework
        confidence: medium
        evidence: implied by WordPress
        version: null
      - name: Google Workspace
        category: email
        confidence: high
        evidence: DNS MX record aspmx.l.google.com
        version: null
    by_category:
      hosting:
        - Nginx
      cms:
        - WordPress
      tag-manager:
        - Google Tag Manager
      framework:
        - PHP
      email:
        - Google Workspace
    signals:
      has_analytics: false
      has_chat_widget: false
      has_payment_processing: false
      has_marketing_automation: false
      has_error_monitoring: false
      has_tag_manager: true
      has_consent_management: false
    dns:
      status: ok
      records_found:
        mx: 5
        txt: 3
        ns: 2
        cname: 0
      failed_lookups: []
    warnings: []
    coverage_note: >-
      Detected from one fetch of the homepage, its response headers and public DNS records (MX, TXT, NS, CNAME).
      It lists what those show, not every technology the company uses: tools loaded only after JavaScript runs,
      on other pages or on the server are not visible.
  properties:
    url:
      type: string
    technologies_detected:
      type: number
    technologies:
      type: array
    by_category:
      type: object
    signals:
      type: object
    dns:
      type: object
    warnings:
      type: array
    coverage_note:
      type: string
data_source: Homepage HTTP response (headers, cookies, HTML) and public DNS records (MX, TXT, NS, CNAME)
data_source_type: scrape
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: scraping-fragile-target
