output_field_reliability:
  url: guaranteed
  technologies_detected: guaranteed
  technologies: guaranteed
  by_category: guaranteed
  signals: guaranteed
  dns: guaranteed
  warnings: guaranteed
  coverage_note: guaranteed
  technologies.version: common
limitations:
  - title: Some website sources are unsupported
    text: >-
      Trustpilot, Glassdoor, LinkedIn, Google Search, Google Patents, Reddit and the major social
      platforms (Facebook, Instagram, X) are not supported and return a policy error before the page
      is read. Repeating the same request does not return content.
    category: coverage
    severity: warning
  - title: Sites that block automated access return a refusal
    text: >-
      When the site answers HTTP 401, 403, 407 or 429, shows an anti-bot challenge page instead of the
      content, or disallows the page in robots.txt, or its robots.txt cannot be fetched (a network or
      server error), the call fails with an error and is not billed. Strale does not try another route
      around the block. Repeating the call gets the same answer while the site keeps refusing; when
      robots.txt could not be fetched, wait at least 5 minutes before trying again.
    category: availability
    severity: warning
  - title: Only the homepage is read
    text: >-
      One fetch of the homepage is analysed. Tools that load only after JavaScript runs, only on other
      pages (checkout, app, docs, pricing) or only for signed-in users are not seen, and a page that
      shows no recognisable technology returns an empty list with a warning, not a claim that none is in use.
    category: coverage
    severity: info
    workaround: Run the call on the specific page address (url) where the tool is expected to load.
  - title: Niche or custom technologies can be missed
    text: >-
      Detection uses a fixed table of several hundred common technologies. Niche, custom-built or
      self-hosted tools are not recognised, and the list is not complete for any site.
    category: coverage
    severity: info
    workaround: >-
      Check the raw HTTP headers in the response for custom X-Powered-By or Server values that indicate unlisted
      technology
  - title: Versions only when the page or a header states them
    text: >-
      A version is reported only when the page or a response header states one (a generator tag, a file path,
      or a header such as Server or X-Powered-By). Many technologies state none, so version is null. A stated
      version can belong to a bundled library rather than the product itself.
    category: accuracy
    severity: info
  - title: DNS signals describe the organisation, not the page
    text: >-
      Email provider, DNS host and domain-verification hints come from public DNS records (MX, TXT, NS) of the
      registrable domain and the CNAME of the host. They show services the organisation uses, not what the page
      loads. If a DNS lookup fails, the result says so under dns and warnings and the DNS-derived items are missing.
    category: accuracy
    severity: info
  - title: Server-only technologies are not visible
    text: >-
      Detection based on HTTP headers, cookies, HTML signatures and public DNS — technologies loaded conditionally
      or server-side only may not be detected
    category: accuracy
    severity: info
    workaround: Complement with ssl-check results to infer infrastructure choices not visible in the HTML
  - title: Pages are limited to 16 MiB of HTML
    text: >-
      Pages with more than 16 MiB of HTML are refused with a caller_input error naming the input
      field. The call is not charged, and the page is not retried through another fetch or rendering
      route.
    category: coverage
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: customer_directed_fetch
  checks: pending
  checks_note: "Pending: fetches go through robots.txt and block checks (PR #723), but a per-tool review of every fetch (redirect targets, challenge pages on rendered routes, links followed to other hosts) is not yet recorded."
