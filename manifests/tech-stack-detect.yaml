# Auto-generated from database on 2026-03-17; description/output example
# refreshed from the live DB row on 2026-08-15 when the anyOf input contract
# was synced to prod (the DB had drifted to required:[] with no anyOf, so
# paying agents sent {} and hit a runtime refusal the schema said couldn't happen).

slug: tech-stack-detect
name: "Tech Stack Detection"
description: "Detect the technology a website runs on (CMS, frameworks, analytics, CDN, payments and marketing tools) from its headers and HTML."
category: web-intelligence
cost_class: free_unlimited
quota_window: none
price_cents: 3
is_free_tier: false
input_schema:
  type: object
  required: []
  properties:
    url:
      type: string
      description: Website URL (e.g. https://example.com)
    domain:
      type: string
      description: Domain name (e.g. example.com) — use this or url
  anyOf:
    - required:
        - url
    - required:
        - domain
output_schema:
  type: object
  example:
    cdn: null
    cms: null
    url: https://google.com
    hosting: null
    analytics:
      - Google Analytics
    confidence: low
    css_framework: null
    meta_framework: null
    frontend_framework: null
    other_technologies:
      - Custom JavaScript
      - Schema.org markup
      - Nonce-based CSP
  properties:
    cms:
      type: string
    url:
      type: string
    hosting:
      type: string
    analytics:
      type: array
    css_framework:
      type: string
    frontend_framework:
      type: string
data_source: HTTP response analysis (headers, JavaScript libraries, meta tags)
data_source_type: scrape
transparency_tag: ai_generated
freshness_category: live-fetch
maintenance_class: scraping-fragile-target
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
processes_personal_data: false
geography: global
test_fixtures:
  known_answer:
    input:
      url: https://google.com
    expected_fields:
      - field: url
        operator: not_null
        reliability: guaranteed
  health_check_input:
    url: https://example.com
output_field_reliability:
  cms: guaranteed
  url: guaranteed
  hosting: guaranteed
  analytics: guaranteed
  css_framework: guaranteed
  frontend_framework: guaranteed
limitations:
  - title: Some website sources are unsupported
    text: >-
      Trustpilot, Glassdoor, LinkedIn, Google Search, Google Patents, Reddit and the major social
      platforms (Facebook, Instagram, X) are not supported and return a policy error before the page
      is read. Repeating the same request does not return content.
    category: coverage
    severity: warning
  - title: Niche or custom technologies can be missed
    text: Database covers 1,000+ technologies — niche or custom-built tools may not be identified
    category: coverage
    severity: info
    workaround: >-
      Check the raw HTTP headers in the response for custom X-Powered-By or Server values that indicate unlisted
      technology
  - title: Server-only technologies are not visible
    text: >-
      Detection based on HTTP headers, JavaScript libraries, and HTML signatures — technologies loaded conditionally or
      server-side only may not be detected
    category: accuracy
    severity: info
    workaround: Complement with dns-lookup and ssl-check results to infer infrastructure choices not visible in the HTML
  - title: Pages are limited to 16 MiB of HTML
    text: >-
      Pages with more than 16 MiB of HTML are refused with a caller_input error naming the input
      field. The call is not charged, and the page is not retried through another fetch or rendering
      route.
    category: coverage
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: customer_directed_fetch
  checks: pending
  checks_note: "Pending: fetches go through robots.txt and block checks (PR #723), but a per-tool review of every fetch (redirect targets, challenge pages on rendered routes, links followed to other hosts) is not yet recorded."
