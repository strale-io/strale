# Auto-generated from database on 2026-03-17; description/output example
# refreshed from the live DB row on 2026-08-15 when the anyOf input contract
# was synced to prod (the DB had drifted to required:[] with no anyOf, so
# paying agents sent {} and hit a runtime refusal the schema said couldn't happen).

slug: tech-stack-detect
name: Tech Stack Detection
description: >-
  Detect technologies used by a website. Identifies CMS, frameworks, analytics, CDN, payment providers and
  marketing tools from HTTP headers and HTML patterns.
category: web-intelligence
cost_class: free_unlimited
quota_window: none
price_cents: 3
is_free_tier: false
input_schema:
  type: object
  required: []
  properties:
    url:
      type: string
      description: Website URL (e.g. https://example.com)
    domain:
      type: string
      description: Domain name (e.g. example.com) — use this or url
  anyOf:
    - required:
        - url
    - required:
        - domain
output_schema:
  type: object
  example:
    cdn: null
    cms: null
    url: https://google.com
    hosting: null
    analytics:
      - Google Analytics
    confidence: low
    css_framework: null
    meta_framework: null
    frontend_framework: null
    other_technologies:
      - Custom JavaScript
      - Schema.org markup
      - Nonce-based CSP
  properties:
    cms:
      type: string
    url:
      type: string
    hosting:
      type: string
    analytics:
      type: array
    css_framework:
      type: string
    frontend_framework:
      type: string
data_source: HTTP response analysis (headers, JavaScript libraries, meta tags)
data_source_type: scrape
transparency_tag: ai_generated
freshness_category: live-fetch
maintenance_class: scraping-fragile-target
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
processes_personal_data: false
geography: global
test_fixtures:
  known_answer:
    input:
      url: https://google.com
    expected_fields:
      - field: url
        operator: not_null
        reliability: guaranteed
  health_check_input:
    url: https://example.com
output_field_reliability:
  cms: guaranteed
  url: guaranteed
  hosting: guaranteed
  analytics: guaranteed
  css_framework: guaranteed
  frontend_framework: guaranteed
limitations:
  - title: Sources whose Terms of Service forbid automated access are rejected
    text: >-
      URLs on sites whose Terms of Service prohibit automated access (Trustpilot, Glassdoor,
      LinkedIn, Google Search and the major social platforms) are rejected before any fetch is
      attempted, returning a policy error with compliant alternatives where they exist. Retrying
      will not succeed. Strale adds a source back only under a licensed API agreement.
    category: coverage
    severity: warning
  - title: Database covers 1,000+ technologies but niche or custom-built tools may not be identified
    text: Database covers 1,000+ technologies — niche or custom-built tools may not be identified
    category: coverage
    severity: info
    workaround: >-
      Check the raw HTTP headers in the response for custom X-Powered-By or Server values that indicate unlisted
      technology
  - title: Only detects client-side and header-visible technologies — server-side-only tools are not visible
    text: >-
      Detection based on HTTP headers, JavaScript libraries, and HTML signatures — technologies loaded conditionally or
      server-side only may not be detected
    category: accuracy
    severity: info
    workaround: Complement with dns-lookup and ssl-check results to infer infrastructure choices not visible in the HTML
  - title: Pages are limited to 16 MiB of HTML
    text: >-
      The fetch refuses a page whose HTML exceeds 16 MiB, enforced while streaming
      rather than after buffering. That is ~5x the heaviest ordinary web page, so
      normal targets are unaffected. An oversized page returns a caller_input
      refusal naming the field, and is not retried through another fetch path; no
      charge is taken.
    category: coverage
    severity: info
