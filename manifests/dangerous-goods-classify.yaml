slug: dangerous-goods-classify
name: Dangerous Goods Classify
description: >-
  Classify dangerous goods by UN number or substance name. Returns hazard class, packing group, labels, marine pollutant
  status. 200+ substances.
category: data-extraction
cost_class: free_unlimited
quota_window: none
price_cents: 2
is_free_tier: false
input_schema:
  type: object
  required:
    - substance
  properties:
    substance:
      type: string
      description: Substance name or UN number (e.g. UN1203, Gasoline)
output_schema:
  type: object
  example:
    error: >-
      No dangerous goods found matching "test". Try a UN number (e.g. 'UN1203') or substance name (e.g. 'Gasoline',
      'Lithium', 'Acid').
    query: test
    matches: []
    total_matches: 0
  properties:
    query:
      type: string
    matches:
      type: array
    total_matches:
      type: integer
    error:
      type: string
data_source: Algorithmic (UN dangerous goods classification, ADR/IMDG/IATA rules)
data_source_type: computed
transparency_tag: algorithmic
freshness_category: computed
maintenance_class: pure-computation
processes_personal_data: false
geography: global
test_fixtures:
  known_answer:
    input:
      substance: acid
    expected_fields:
      - field: query
        operator: not_null
        reliability: common
      - field: matches
        operator: not_null
        reliability: common
      - field: total_matches
        operator: not_null
        reliability: common
  health_check_input:
    substance: acid
output_field_reliability:
  query: guaranteed
  matches: guaranteed
  total_matches: guaranteed
  error: rare
limitations:
  - title: >-
      AI-based dangerous goods classification is a preliminary screen only — certified testing and documentation are
      required
    text: >-
      AI-based classification guidance — official dangerous goods classification requires certified testing and
      documentation
    category: accuracy
    severity: warning
    workaround: Use as a preliminary screen and confirm the UN number and packing group with your certified DG advisor
