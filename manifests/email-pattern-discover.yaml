slug: email-pattern-discover
name: Email Pattern Discover
description: Detect likely corporate email format for a domain. Checks MX records, identifies email provider (Google Workspace, Microsoft 365, etc.), and suggests common patterns.
category: web-intelligence
cost_class: free_unlimited
quota_window: none
price_cents: 5
input_schema:
  type: object
  # The executor throws unless one of domain/url is present, so neither
  # `required: [domain]` (what this manifest claimed) nor `required: []`
  # (what the DB served) described it. Declared as anyOf, matching the
  # contract the code actually enforces.
  required: []
  anyOf:
    - required:
        - domain
    - required:
        - url
  properties:
    domain:
      type: string
      description: Domain name (e.g. stripe.com)
    url:
      type: string
      description: URL to extract the domain from (alternative to `domain`)
output_schema:
  type: object
  properties:
    domain:
      type: string
    accepts_email:
      type: boolean
    email_provider:
      type: string
    mx_records:
      type: array
    patterns:
      type: array
    recommendation:
      type: string
data_source: DNS protocol + public website HTML
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
# Fetches the domain's homepage HTML, so it breaks when a site changes —
# not a stable API contract.
maintenance_class: scraping-fragile-target
# Regex-harvests real addresses from page HTML and returns them as
# `public_emails_found`. Those are personal data; declaring false here was
# simply untrue, and the database already had this right.
processes_personal_data: true
personal_data_categories:
  - email
  - name
geography: global
test_fixtures:
  known_answer:
    input:
      domain: stripe.com
    expected_fields:
      - field: domain
        operator: not_null
        reliability: guaranteed
      - field: accepts_email
        operator: not_null
        reliability: guaranteed
      - field: mx_records
        operator: not_null
        reliability: guaranteed
  health_check_input:
    domain: stripe.com
output_field_reliability:
  domain: guaranteed
  accepts_email: guaranteed
  mx_records: guaranteed
  patterns: guaranteed
  recommendation: guaranteed
  email_provider: common
  inferred_pattern: rare
  public_emails_found: rare
  common_pattern_addresses: common
limitations:
  - title: Pattern inference is heuristic, not verified per-address
    text: Returned patterns are based on email-provider conventions and any public emails found on the domain's homepage. Individual addresses must still be validated with email-validate before sending.
    category: accuracy
    severity: info
    workaround: Combine output with email-validate on candidate addresses
  - title: Domain-level only — does not enumerate users
    text: Returns the likely format pattern (e.g. first.last@example.com), not a list of employees. Personnel discovery is not supported.
    category: coverage
    severity: info
