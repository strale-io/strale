slug: email-validate
name: "Email Validation"
description: "Check email syntax, mail-server records, disposable domains, role addresses and likely typos. Returns checks without confirming a mailbox exists."
category: validation
cost_class: free_unlimited
quota_window: none
price_cents: 3
is_free_tier: true
input_schema:
  type: object
  required:
    - email
  properties:
    email:
      type: string
      description: Email address to validate
output_schema:
  type: object
  example:
    email: test@google.com
    valid: true
    domain: google.com
    mx_records:
      - smtp.google.com
    format_valid: true
    is_disposable: false
    has_mx_records: true
    is_role_address: false
    is_free_provider: false
  properties:
    email:
      type: string
    valid:
      type: boolean
    is_disposable:
      type: boolean
    has_mx_records:
      type: boolean
    is_role_address:
      type: boolean
data_source: Algorithmic (syntax) + DNS protocol (MX record verification)
data_source_type: api
transparency_tag: algorithmic
freshness_category: computed
maintenance_class: free-stable-api
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
processes_personal_data: true
personal_data_categories:
  - email
geography: global
test_fixtures:
  known_answer:
    input:
      email: clearly-invalid
    expected_fields:
      - field: format_valid
        operator: is_false
        reliability: common
  health_check_input:
    email: test@example.com
output_field_reliability:
  email: guaranteed
  valid: guaranteed
  # format_valid is returned on both code paths (the format-failure early
  # return and the full path), so it is genuinely guaranteed.
  format_valid: guaranteed
  # Everything below is `common`, not `guaranteed`: when the address fails the
  # format check the executor returns early with only
  # {valid, email, format_valid, reason} and none of these fields are present.
  # `domain` in particular was previously absent from this map entirely, which
  # blocked checkReadiness; annotating it `guaranteed` would have recreated the
  # "expected non-null on optional field" class that broke 8 EU registries.
  is_disposable: common
  has_mx_records: common
  is_role_address: common
  is_free_provider: common
  mx_records: common
  domain: common
  # Only ever present on the format-failure path.
  reason: rare
  # Only present when the domain has no MX records AND the domain is within
  # edit distance 2 of a known provider.
  did_you_mean: rare
limitations:
  - title: New disposable domains can be missed
    text: Disposable email detection covers major providers but new throwaway domains may not be flagged
    category: coverage
    severity: info
    workaround: Check the domain’s age when investigating suspicious traffic.
  - title: A valid result does not prove the mailbox exists
    text: Catch-all domains (common in enterprises) will show as valid even for non-existent mailboxes
    category: accuracy
    severity: info
    workaround: >-
      Require confirmation through a verification link before relying on a mailbox.
# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: preferred
