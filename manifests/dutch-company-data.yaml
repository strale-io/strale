slug: dutch-company-data
name: Dutch Company Data
description: >-
  Look up Dutch company data via Openapi.com WW-Top (Tier-3 vendor aggregator). Accepts Dutch VAT/BTW number
  (NL + 9 digits + B + 2 digits). Returns name, registration number, status, registered address, registration
  date, LEI, primary NACE code, and last-update timestamp. KvK 8-digit registration numbers are NOT accepted by
  the upstream API.
category: company-data
cost_class: paid_per_call
price_cents: 16
is_free_tier: false
avg_latency_ms: 2200
input_schema:
  type: object
  required:
    - vat_number
  properties:
    vat_number:
      type: string
      description: Dutch VAT/BTW number (NL + 9 digits + B + 2 digits, e.g. NL803441526B01). KvK numbers are NOT accepted.
output_schema:
  type: object
  example:
    company_name: ASML Holding N.V.
    native_company_name: ASML Holding N.V.
    registration_number: "17085815"
    vat_number: NL803441526B01
    country_code: NL
    legal_form: null
    status: active
    is_active: true
    registered_date: "1994-10-04"
    registered_address: "De Run 6501, 6501, 5504 DR, Veldhoven, NL"
    lei_code: 724500Y6DUVHQD6OXN27
    nace_codes:
      - code: "2611"
        description: Manufacture of electronic components
    company_size: Very large company
    source_as_of: "2026-04-30T12:00:00.000Z"
  properties:
    company_name: { type: string }
    native_company_name: { type: ["string", "null"] }
    registration_number: { type: string }
    vat_number: { type: string }
    country_code: { type: string }
    legal_form: { type: ["string", "null"] }
    status: { type: string, enum: [active, inactive, unknown] }
    is_active: { type: boolean }
    registered_date: { type: ["string", "null"] }
    registered_address: { type: ["string", "null"] }
    lei_code: { type: ["string", "null"] }
    nace_codes: { type: array }
    company_size: { type: ["string", "null"] }
    source_as_of: { type: ["string", "null"] }
data_source: Openapi.com WW-Top (Tier-3 vendor aggregator of EU company registries)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: commercial-stable-api
gdpr_art_22_classification: data_lookup
processes_personal_data: true
personal_data_categories:
  - name
  - address
  - professional
geography: eu
test_fixtures:
  known_answer:
    input:
      vat_number: NL803441526B01
    expected_fields:
      - { field: company_name, operator: not_null, reliability: guaranteed }
      - { field: vat_number, operator: equals, reliability: guaranteed, value: NL803441526B01 }
      - { field: country_code, operator: equals, reliability: guaranteed, value: NL }
      - { field: status, operator: equals, reliability: guaranteed, value: active }
      - { field: is_active, operator: equals, reliability: guaranteed, value: true }
      - { field: registered_address, operator: not_null, reliability: guaranteed }
      - { field: registration_number, operator: not_null, reliability: guaranteed }
  health_check_input:
    vat_number: NL803441526B01
output_field_reliability:
  company_name: guaranteed
  native_company_name: common
  registration_number: guaranteed
  vat_number: guaranteed
  country_code: guaranteed
  legal_form: rare
  status: guaranteed
  is_active: guaranteed
  registered_date: common
  registered_address: guaranteed
  lei_code: common
  nace_codes: guaranteed
  company_size: common
  source_as_of: guaranteed
limitations:
  - title: Tool is currently unavailable
    text: >-
      This tool is currently unavailable and returns a capability-unavailable error.
    category: availability
    severity: warning
  - title: KvK numbers rejected
    text: Openapi WW-Top accepts only NL-prefix VAT format. KvK 8-digit registration numbers return 406.
    category: coverage
    severity: info
  - title: Legal form is not included
    text: The company’s legal form is not included in this tool’s response.
    category: coverage
    severity: info
  - title: Directors are not included
    text: Director and legal representative details are not included in this tool’s response.
    category: coverage
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: vendor_aggregation
  upstream_vendor: openapi
  checks: pending
