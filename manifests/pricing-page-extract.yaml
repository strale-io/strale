  - title: Interactive pricing pages can hide plan details
    text: Dynamic pricing pages with complex JavaScript interactions may not fully render all plan tiers
    category: accuracy
    severity: info
    workaround: If results appear incomplete, pass the direct pricing page URL rather than the homepage
  - title: Output size cap per call
    text: >-
      Structured output is limited to about 1,500 output tokens per call; requests exceeding this
