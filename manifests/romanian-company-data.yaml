slug: romanian-company-data
name: Romanian Company Data
description: >-
  Look up Romanian company data via Openapi.com WW-Top (Tier-3 vendor aggregator). Accepts Romanian VAT (RO + 8
  digits), 13-digit CUI, or 8-digit CUI. Returns name, registration number, status, registered address,
  registration date, LEI, primary NACE code, and last-update timestamp. PARTIAL coverage — 7-digit CUI entities
  (legacy banks, older corporations) are structurally rejected by the upstream catalog.
category: company-data
cost_class: paid_per_call
price_cents: 16
is_free_tier: false
avg_latency_ms: 2200
input_schema:
  type: object
  required:
    - vat_number
  properties:
    vat_number:
      type: string
      description: >-
        Romanian VAT (RO + 8 digits, e.g. RO13267213), 13-digit CUI, or 8-digit CUI. 7-digit CUI entities are
        not in the upstream catalog (Banca Transilvania RO5022670, OMV Petrom RO1590082 confirmed unreachable).
output_schema:
  type: object
  example:
    company_name: Societatea de Producere a Energiei Electrice in Hidrocentrale Hidroelectrica S.A.
    native_company_name: Societatea de Producere a Energiei Electrice in Hidrocentrale Hidroelectrica S.A.
    registration_number: "13267213"
    vat_number: RO13267213
    country_code: RO
    legal_form: null
    status: active
    is_active: true
    registered_date: "2000-07-29"
    registered_address: "Bulevardul Ion Mihalache, Bucharest, RO"
    lei_code: 787200IISRQXO9PRB732
    nace_codes:
      - code: "3511"
        description: Production of electricity
    company_size: Very large company
    source_as_of: "2026-04-30T12:00:00.000Z"
  properties:
    company_name: { type: string }
    native_company_name: { type: ["string", "null"] }
    registration_number: { type: string }
    vat_number: { type: string }
    country_code: { type: string }
    legal_form: { type: ["string", "null"] }
    status: { type: string, enum: [active, inactive, unknown] }
    is_active: { type: boolean }
    registered_date: { type: ["string", "null"] }
    registered_address: { type: ["string", "null"] }
    lei_code: { type: ["string", "null"] }
    nace_codes: { type: array }
    company_size: { type: ["string", "null"] }
    source_as_of: { type: ["string", "null"] }
data_source: Openapi.com WW-Top (Tier-3 vendor aggregator of EU company registries)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: commercial-stable-api
gdpr_art_22_classification: data_lookup
processes_personal_data: true
personal_data_categories:
  - name
  - address
  - professional
geography: eu
test_fixtures:
  known_answer:
    input:
      vat_number: RO13267213
    expected_fields:
      - { field: company_name, operator: not_null, reliability: guaranteed }
      - { field: vat_number, operator: equals, reliability: guaranteed, value: RO13267213 }
      - { field: country_code, operator: equals, reliability: guaranteed, value: RO }
      - { field: status, operator: equals, reliability: guaranteed, value: active }
      - { field: is_active, operator: equals, reliability: guaranteed, value: true }
      - { field: registered_address, operator: not_null, reliability: guaranteed }
      - { field: registration_number, operator: not_null, reliability: guaranteed }
  health_check_input:
    vat_number: RO13267213
output_field_reliability:
  company_name: guaranteed
  native_company_name: common
  registration_number: guaranteed
  vat_number: guaranteed
  country_code: guaranteed
  legal_form: rare
  status: guaranteed
  is_active: guaranteed
  registered_date: common
  registered_address: guaranteed
  lei_code: common
  nace_codes: common
  company_size: common
  source_as_of: guaranteed
limitations:
  - title: Tool is unavailable
    text: >-
      This tool is unavailable and returns a capability-unavailable error.
    category: availability
    severity: warning
  - title: Seven-digit CUI identifiers are not supported
    text: >-
      Accepts RO followed by exactly 8 digits, bare 8-digit identifiers or bare 13-digit identifiers.
      Seven-digit CUI identifiers are rejected with HTTP 406 even when they identify a registered
      company.
    category: coverage
    severity: warning
  - title: Legal form is not included
    text: The company’s legal form is not included in this tool’s response.
    category: coverage
    severity: info
  - title: Directors are not included
    text: Director and legal representative details are not included in this tool’s response.
    category: coverage
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: vendor_aggregation
  upstream_vendor: openapi
  checks: pending
