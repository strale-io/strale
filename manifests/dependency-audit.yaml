limitations:
  - title: >-
      Transitive and runtime dependencies are not checked
    text: >-
      Checks only the dependencies declared in the file, against the npm or PyPI registry and OSV.dev; it cannot
      detect transitive vulnerability chains or runtime-only dependencies
    category: accuracy
    severity: info
    workaround: Supplement with npm audit or pip-audit for vulnerability scanning that includes transitive dependencies
  - title: OSV.dev and registry availability
    text: >-
      If OSV.dev is down, rate-limited or returns an unreadable answer, the call fails and is not charged. If a
      registry lookup fails for a dependency, that dependency is marked unavailable, still checked against OSV.dev
      by its declared version, and the registry is named in unavailable_sources.
    category: availability
    severity: info

