output_field_reliability:
  backlinks: guaranteed
  top_anchors: guaranteed
  total_backlinks: guaranteed
  referring_domains_count: guaranteed
  # Google's `/goto` redirect wrapper (2026-10-30): links past the top
  # three come back opaque and are resolved through Serper's free
  # `/resolve`. These say what resolution could not open, so a caller
  # never has to read an absent link as an absent result.
  unresolved_link_count: guaranteed

limitations:
  - title: Only pages Google search returns are found
    text: >-
      Backlinks come from one Google search (through Serper) for pages that mention the domain, up to 10 results. This is not a link index: pages that link without naming the domain, and recently created or niche backlinks, can be missing, and a listed page may mention the domain without linking to it.
    category: coverage
    severity: info
    workaround: Check referring pages directly for recently created or missing backlinks.
  - title: API responses are limited to 4 MiB
    text: >-
      API response bodies above 4 MiB are refused during download rather than parsed.
    category: coverage
    severity: info
  - title: A failed search is never read as no backlinks
    text: >-
      If the Google search through Serper fails, times out or is not configured, the call fails unbilled rather than returning an empty list. An empty list means the search answered and found no page other than the domain's own (its subdomains are never counted as backlinks).
    category: availability
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: vendor_api
  upstream_vendor: serper
  checks: recorded
  checks_note: "Serper.dev (google.serper.dev) per-call search API, the only source since the Common Crawl leg was removed (PR #1017). Serper confirmed in writing on 2026-10-27 that use as an upstream source within a value-added per-call API is permitted under its standard terms (DQ-39, accepted 2026-10-28; recorded in apps/api/src/lib/vendor-terms.ts). Results are processed into Strale's own schema, one search per request, never passed through as-is; Google's own rights are not granted by Serper."
