output_field_reliability:
  backlinks: guaranteed
  top_anchors: guaranteed
  total_backlinks: guaranteed
  referring_domains_count: guaranteed
  # Google's `/goto` redirect wrapper (2026-10-30): links past the top
  # three come back opaque and are resolved through Serper's free
  # `/resolve`. These say what resolution could not open, so a caller
  # never has to read an absent link as an absent result.
  unresolved_link_count: guaranteed
  unavailable_sources: rare

limitations:
  - title: Recent or niche backlinks can be missing
    text: Uses CommonCrawl index data — covers a subset of the web and may miss recently created or niche backlinks
    category: coverage
    severity: info
    workaround: Check referring pages directly for recently created or missing backlinks.
  - title: API responses are limited to 4 MiB
    text: >-
      API response bodies above 4 MiB are refused during download rather than parsed.
    category: coverage
    severity: info
  - title: A failed source is named, never read as no backlinks
    text: >-
      If Common Crawl and Serper both fail, the call fails unbilled rather than returning an empty list. Common Crawl mostly returns the domain's own pages, which (with its subdomains) are never counted as backlinks, so when Serper is needed (fewer than 5 backlinks found) and fails or is not configured, and no backlink was found, the call also fails unbilled. If one fails and the other answers with backlinks, the list comes from the one that answered and the failed source is named in unavailable_sources.
    category: availability
    severity: info

