slug: uk-disqualified-director-check
name: "UK Disqualified Director Check"
description: "Search the UK register of disqualified directors by name, or fetch one full record by officer ID: dates, court, reason and the companies involved."
category: compliance
cost_class: free_quota
quota_window: daily
quota_cap: 600
known_rate_limit:
  value: 120
  unit: per_minute
  source_url: https://developer-specs.company-information.service.gov.uk/guides/rateLimiting
price_cents: 10
is_free_tier: false
input_schema:
  type: object
  required: []
  anyOf:
    - required: [name]
    - required: [officer_id]
    - required: [task]
  properties:
    name:
      type: string
      description: Individual's name to search for in the disqualified officers register
    officer_id:
      type: string
      description: Companies House disqualified-officer ID (from a prior search's candidates[].officer_id) — fetches full disqualification detail
    task:
      type: string
      description: Free-text alias for name
output_schema:
  type: object
  example:
    mode: search
    query: Smith
    total_results: 42
    candidates:
      - officer_id: AbC123xYZ
        name: SMITH, John
        date_of_birth: "1970-01"
        address_snippet: "123 Example Street, London"
        snippet: null
  properties:
    mode:
      type: string
    query:
      type: string
    total_results:
      type: integer
    candidates:
      type: array
    # Detail-mode (officer_id input) top-level fields — absent in search mode
    officer_id:
      type: string
    found:
      type: boolean
    name:
      type: string
data_source: UK Companies House (Disqualified Officers register)
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: free-stable-api
# SA.2b: per-capability PII classification (F-A-003, F-A-009)
processes_personal_data: true
gdpr_art_22_classification: screening_signal
geography: uk
test_fixtures:
  known_answer:
    input:
      name: Smith
    expected_fields:
      - field: mode
        operator: not_null
        reliability: guaranteed
      - field: mode
        operator: type
        reliability: guaranteed
        value: string
      - field: query
        operator: not_null
        reliability: guaranteed
      - field: total_results
        operator: not_null
        reliability: guaranteed
      - field: total_results
        operator: type
        reliability: guaranteed
        value: number
      - field: candidates
        operator: not_null
        reliability: guaranteed
      - field: candidates
        operator: type
        reliability: guaranteed
        value: array
  health_check_input:
    name: Smith
output_field_reliability:
  mode: guaranteed
  query: guaranteed
  total_results: guaranteed
  candidates: guaranteed
  # Present only in detail mode (officer_id input): common, not guaranteed
  officer_id: common
  found: common
  name: common
  disqualification_count: rare
  disqualifications: rare
limitations:
  - title: Search returns candidates without selecting a match
    text: >-
      Names are not unique, so search returns candidates with names, dates of birth and address
      snippets rather than selecting a person. Confirm the date of birth or address, then request full
      details using the chosen `officer_id`.
    category: accuracy
    severity: warning
    workaround: Always confirm date_of_birth or address before treating a search candidate as a confirmed match
  - title: Only the UK public disqualification register is covered
    text: >-
      Covers formal director disqualifications recorded by UK Companies House / the Insolvency Service.
      Disqualifications or equivalent sanctions under other jurisdictions' regimes are out of scope.
    category: coverage
    severity: info
  - title: Checks depend on Companies House access
    text: >-
      The tool returns an error if the Companies House connection is not configured.
    category: coverage
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: preferred
  acquisition_method: direct_api
