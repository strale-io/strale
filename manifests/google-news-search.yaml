slug: google-news-search
name: Google News Search
description: "Search Google News results by query, country, language and time range. Returns headlines, sources, snippets and relative publication times."
category: web-scraping
cost_class: paid_prepaid
quota_window: none
price_cents: 10
is_free_tier: false
avg_latency_ms: 1500
data_source: Serper.dev (licensed Google SERP API) — Google News vertical
data_source_type: api
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: commercial-stable-api
gdpr_art_22_classification: data_lookup
processes_personal_data: false
geography: global
input_schema:
  type: object
  required: []
  properties:
    query:
      type: string
      description: News search query (min 2 chars)
    q:
      type: string
      description: Alias for query
    search:
      type: string
      description: Alias for query
    task:
      type: string
      description: Free-text alias for query
    num_results:
      type: number
      description: "Max results to return (default 10, cap 20)"
    time_range:
      type: string
      description: "Optional recency filter: hour | day | week | month | year. Omit for all time."
    country:
      type: string
      description: Optional ISO 3166 country to scope results (e.g. "se", "Sweden")
    language:
      type: string
      description: Optional interface language (e.g. "en", "sv")
  anyOf:
    - required: [query]
    - required: [q]
    - required: [search]
    - required: [task]
output_schema:
  type: object
  example:
    query: artificial intelligence
    time_range: null
    country: null
    result_count: 5
    results:
      - position: 1
        title: "AI breakthrough announced"
        url: "https://news.example.com/article"
        source: "Example News"
        published: "2 hours ago"
        snippet: "Researchers today announced..."
        image_url: null
  properties:
    query: { type: string }
    time_range: { type: ["string", "null"] }
    country: { type: ["string", "null"] }
    result_count: { type: integer }
    results:
      type: array
      description: Ranked news results (title, url, source, relative publish time, snippet, image_url)
    unresolved_url_count:
      type: number
    link_resolution_attempted:
      type: boolean
test_fixtures:
  known_answer:
    input:
      query: artificial intelligence
      num_results: 5
    expected_fields:
      - { field: query, operator: equals, reliability: guaranteed, value: artificial intelligence }
      - { field: result_count, operator: not_null, reliability: guaranteed }
      - { field: results, operator: not_null, reliability: guaranteed }
      - { field: results, operator: type, reliability: guaranteed, value: array }
  health_check_input:
    query: technology news
    num_results: 3
output_field_reliability:
  query: guaranteed
  time_range: guaranteed
  country: guaranteed
  result_count: guaranteed
  results: guaranteed
  # Google's `/goto` redirect wrapper (2026-10-30): links past the top
  # three come back opaque and are resolved through Serper's free
  # `/resolve`. These say what resolution could not open, so a caller
  # never has to read an absent link as an absent result.
  unresolved_url_count: guaranteed
  link_resolution_attempted: guaranteed

limitations:
  - title: Publish times are relative strings, not timestamps
    text: >-
      Google News returns relative publish times ("2 hours ago", "3 days ago") which are passed
      through verbatim — no fabricated ISO timestamps. Callers needing exact times should fetch the
      article.
    category: accuracy
    severity: info
  - title: Results vary with Google News rankings
    text: >-
      Coverage and ordering follow Google News's own ranking for the query/locale; re-running the
      same query can return different results. This is a discovery surface, not an archive.
    category: freshness
    severity: info

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: vendor_api
  upstream_vendor: serper
  checks: recorded
  checks_note: "Serper.dev (google.serper.dev) per-call search API. Serper confirmed in writing on 2026-10-27 that use as an upstream source within a value-added per-call API is permitted under its standard terms (DQ-39, accepted 2026-10-28; recorded in apps/api/src/lib/vendor-terms.ts). Results are processed into Strale's own schema, one search per request, never passed through as-is; Google's own rights are not granted by Serper."
