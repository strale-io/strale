slug: c2pa-inspect
name: "C2PA Content Credentials"
description: "Read the C2PA Content Credentials in a media file: verify the signature and show the tool that made it, the signer, edits, and any AI-generation flags."
category: media
cost_class: free_unlimited
quota_window: none
price_cents: 10
is_free_tier: false
input_schema:
  type: object
  required:
    - url
  properties:
    url:
      type: string
      format: uri
      description: HTTP(S) URL of an image (JPEG, PNG, WebP, AVIF, HEIF, TIFF, DNG) to inspect for C2PA manifests
output_schema:
  type: object
  example:
    source_url: "https://example.com/photo.jpg"
    media_type: "image/jpeg"
    bytes_size: 184320
    has_c2pa: true
    manifest_count: 1
    active_manifest:
      label: "urn:uuid:1234..."
      claim_generator: "Adobe Photoshop 25.0"
      title: "photo.jpg"
      vendor: "Adobe"
      format: "image/jpeg"
      signer:
        issuer: "C=US, O=Adobe Inc., CN=Adobe Photoshop CS Test Cert"
        time: "2024-06-15T10:30:00Z"
      signature_valid: true
      assertions:
        - label: "c2pa.actions"
          kind: "Json"
        - label: "c2pa.hash.data"
          kind: "Json"
      assertions_count: 4
      ingredients_count: 0
      ai_generated: false
    validation_status: []
  properties:
    source_url:
      type: string
    media_type:
      type: string
    bytes_size:
      type: integer
    has_c2pa:
      type: boolean
    manifest_count:
      type: integer
    active_manifest:
      type: ["object", "null"]
    validation_status:
      type: array
data_source: c2pa-rs (Adobe Content Authenticity Initiative reference implementation)
data_source_type: computed
transparency_tag: algorithmic
freshness_category: live-fetch
maintenance_class: pure-computation
processes_personal_data: false
geography: global
test_fixtures:
  known_answer:
    input:
      url: "https://raw.githubusercontent.com/contentauth/c2pa-rs/main/sdk/tests/fixtures/CA.jpg"
    expected_fields:
      - field: source_url
        operator: not_null
        reliability: guaranteed
      - field: media_type
        operator: equals
        reliability: guaranteed
        value: "image/jpeg"
      - field: bytes_size
        operator: not_null
        reliability: guaranteed
      - field: has_c2pa
        operator: is_true
        reliability: guaranteed
      - field: manifest_count
        operator: not_null
        reliability: guaranteed
      # active_manifest is `common` in output_field_reliability (nullable in
      # output_schema) — asserting not_null contradicted the manifest's own
      # declaration and failed the P0 prod sweep. Common fields are not
      # asserted in known_answer checks (CLAUDE.md field-reliability rules).
  health_check_input:
    url: "https://raw.githubusercontent.com/contentauth/c2pa-rs/main/sdk/tests/fixtures/CA.jpg"
output_field_reliability:
  source_url: guaranteed
  media_type: guaranteed
  bytes_size: guaranteed
  has_c2pa: guaranteed
  manifest_count: guaranteed
  active_manifest: common
  validation_status: guaranteed
limitations:
  - title: Images only; video and audio are not supported
    text: >-
      Supports JPEG, PNG, WebP, AVIF, HEIF, TIFF, DNG and GIF images. Video and audio formats,
      including MP4, M4A, MP3 and WAV, are not supported.
    category: coverage
    severity: info
    workaround: Convert the relevant frame to a still image before inspection.
  - title: 15 MB per-fetch size cap
    text: >-
      Fetched media is limited to 15 MB. Supply a smaller derivative or downsampled image for larger
      originals.
    category: coverage
    severity: info
    workaround: Provide a publicly accessible URL for a downsampled image.
  - title: Public HTTP or HTTPS URL required
    text: >-
      Accepts only publicly accessible HTTP or HTTPS URLs. Direct uploads and base64-encoded media are
      not supported.
    category: coverage
    severity: info
    workaround: Host the media on a publicly accessible URL (e.g. S3 public object, CDN) before calling.
  - title: Unlisted signers can report as untrusted
    text: >-
      `signature_valid` checks cryptographic verification against the tool’s bundled trust list; a
      valid signature from an unlisted signer can still report untrusted in `validation_status`.
      Assess `signer.issuer` together with `signature_valid`.
    category: accuracy
    severity: warning
    workaround: >-
      Inspect validation_status for codes ending in ".untrusted" and decide whether to trust the
      signer organisation separately.
  - title: AI-generation flag is heuristic, not authoritative
    text: >-
      ai_generated returns true if any manifest assertion label matches a known generative-AI marker
      (c2pa.training-mining, com.adobe.generative-ai, etc.). C2PA does not yet have a single canonical "this content
      is AI" assertion, so absence of the flag does not prove the content is human-made.
    category: accuracy
    severity: warning
    workaround: >-
      For high-stakes decisions, also inspect the assertions array for vendor-specific generative-AI labels not in the
      built-in list.

# Data-access lane and acquisition method (DEC-20261023-A; lib/data-access.ts).
data_access:
  lane: allowed_with_checks
  acquisition_method: customer_directed_fetch
  checks: pending
