exit_gaps:
- id: G1
  gap: 212 preserved Decision rows carry a unique ID but no formal record, collision entry, or deferral
    decision.
  blocking: true
  owner: session
  closes_when: Every row reaches formally_migrated, intentionally_historical, or obsolete_or_superseded
    through contradiction-checked batches, or an explicitly reviewed rule classifies pre-readiness feature-scope
    rows as evidence-only.
  evidence:
  - docs/project/m2-closure-register.yaml
  - docs/decisions/README.md
- id: G2
  gap: 34 historical IDs reused across 69 Notion rows remain unresolved in the collision registry and
    are excluded from formal records and relation targets.
  blocking: true
  owner: session
  closes_when: Each collision is resolved atomically with source evidence and independent review, or every
    row is given an evidence-backed documented_only disposition.
  evidence:
  - docs/decisions/id-collisions.yaml
  - archive/sessions/2026-09-01-decision-collision-identity-plan.md
- id: G3
  gap: 'DEC-20260422-A collides across surfaces: one Notion row and one Git-native protocol claim share
    the ID, and the Notion-only registry cannot represent it.'
  blocking: true
  owner: session
  closes_when: A reviewed identity mechanism represents source-qualified Git-native claims and both meanings
    receive distinct record keys or evidence-only dispositions.
  evidence:
  - archive/sessions/2026-09-01-m2-enforcement-protocol-source-gaps.md
- id: G4
  gap: Four formal records (DEC-20260504-A, DEC-20260822-A, DEC-20260831-A, DEC-20260901-A) have no Notion
    source row and rest on Git provenance alone.
  blocking: false
  owner: session
  closes_when: Each record's provenance metadata states the Git origin explicitly; verified in this register's
    formal_records section, so this gap is informational.
  evidence:
  - docs/decisions/records/DEC-20260504-A.md
  - docs/decisions/records/DEC-20260822-A.md
  - docs/decisions/records/DEC-20260831-A.md
  - docs/decisions/records/DEC-20260901-A.md
- id: G5
  gap: Five preserved rows have an empty ID property although their titles embed an ID string.
  blocking: false
  owner: session
  closes_when: A reviewed rule either accepts the title-embedded ID as identity with a source-qualified
    key or classifies the rows as evidence-only; no inference is made until then.
  evidence:
  - docs/project/m2-closure-register.yaml
- id: G6
  gap: 6 rows are superseded in the source and not migrated; they can enter the graph only with their
    successors.
  blocking: false
  owner: session
  closes_when: Each successor is migrated or classified and the superseded row is either migrated as a
    superseded record or left as evidence.
  evidence:
  - docs/project/m2-closure-register.yaml
- id: G7
  gap: DEC-20260517-B is preserved as evidence but its durable objective (audited, validated reference-data
    changes) has no current formal record.
  blocking: false
  owner: session
  closes_when: An explicit supersession batch records the current mechanism and marks the historical row
    superseded.
  evidence:
  - archive/sessions/2026-09-01-m2-enforcement-protocol-source-gaps.md
- id: G8
  gap: 'Of 15 legacy-authority sources, none is fully migrated: 4 partial, 10 not started, 1 unclear.
    Protocol extraction into the router and the docs/company split are the M2-relevant parts; physical
    moves belong to M5.'
  blocking: true
  owner: session
  closes_when: CLAUDE.md protocol full text is represented in the coverage manifest and router, docs/company
    settled entries are in formal records or evidence, and the handoff directory has a recorded disposition.
  evidence:
  - docs/project/m2-closure-register.yaml
  - docs/project/PROTOCOL-ROUTER.md
- id: G9
  gap: The plan's M2 exit requires a fresh independent review of the reconciled truth before M4; the review
    route changed on 2026-09-01 and no closing review of the full M2 candidate set has been recorded.
  blocking: true
  owner: session
  closes_when: A fresh independent review (per the recorded route) passes the complete M2 candidate set
    at an exact commit and its verdict is archived.
  evidence:
  - docs/strategy/2026-08-31-repo-native-operating-model-migration.md
  - archive/sessions/2026-09-01-m2-claude-verification-backlog.md
