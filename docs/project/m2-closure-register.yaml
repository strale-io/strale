# M2 closure disposition register - AUTHORED M2 CANDIDATE, NOT ACTIVE PROJECT AUTHORITY.
# Validated by scripts/m2-closure-register-lib.mjs (npm run context:check / context:test).
# The M1 bare inventory's contract, schema, and hashing algorithm are unchanged; this file
# classifies its entries. Its generated hash and detected-reference values were refreshed by
# the generator as usual, because the audit's own files reference inventory targets.
# Dispositions are audit findings about migration state, never restatements of decision content.
# Public boundary: a Decision row appears here only if its page id and historical ID are already
# public on main; a clear title appears only where docs/decisions/id-collisions.yaml already
# publishes that exact string. Scope and date are never published here, not even hashed (main
# does not publish them for these rows and a per-row hash would be recoverable); they are bound
# only by digests.public_rows.scope_date_digest, which the operator script recomputes from the
# archive. Every other title is a hash, and rows that are not yet public live in the private
# archive (private_rows) and are represented here by counts and digests.
# Row identity fields are copies from the private preservation archive; they are verified against
# it by scripts/m2-closure-verify-private-rows.mjs, not by CI.
# Boundary, stated exactly: no page id, Decision ID, clear title, scope, or date appears here that
# is not already on main. New artefacts: the 24 title_sha256 values on public rows are per-row
# commitments to titles that are not public, and the aggregate digests (public rows, all rows,
# private rows, scope/date, private next-batch candidates) and counts are commitments to the
# preserved set as a whole. None reveals a title, scope, date, or body without the archive.
# What validation proves: structure, that every Decision disposition is derived from evidence
# (records, collision registry, protocol labels, gap reports, identity fields), that inventory
# dispositions match the migration map, coverage of every open bucket by a gap, provenance and
# digest consistency, and no silent removal. What it does not prove: the truth of reviewer-authored
# prose (progress, remaining, rationale, closes_when, selection_rule), the plan-statement
# dispositions, or which gaps are blocking. Those are judgements reviewed in the PR.
