excluded_sections:
  - heading: "Workflow Protocol"
    reason: >-
      Section header grouping the workflow-protocol subsections that
      follow; each subsection is classified on its own below.
  - heading: "Session Start"
    reason: >-
      Prescribes declaring session intent and choosing Quick or Full mode,
      but names no governing decision and is not enforced by any
      repository check; full criteria live in .claude/PROTOCOL.md.
  - heading: "Repo-native migration continuation — pre-cutover"
    reason: >-
      States explicitly that it is a navigation pointer to the migration
      checkpoint document, not a protocol in its own right.
  - heading: "Notion Access (REQUIRED)"
    reason: "Reference list of Notion workspace URLs and page ids, not a protocol."
  - heading: "Notion Workspace Structure (8 sections under Project Home)"
    reason: "Structural reference describing the Notion workspace layout, not a protocol."
  - heading: "Notion Governance Rules (enforced)"
    reason: >-
      Governs conduct inside Notion, which lives outside this repository,
      so no repository check can verify it, and no decision id names it.
  - heading: "GitHub Access (REQUIRED)"
    reason: "Reference data naming the repository and branch pattern, not a protocol."
  - heading: "Project Spec"
    reason: "Pointer to the Notion project home for the build plan, not a protocol."
  - heading: "Tech Stack"
    reason: "Reference list of technology choices, not a protocol."
  - heading: "Project Structure"
    reason: "Reference file-tree diagram of the repository layout, not a protocol."
  - heading: "Active Decisions"
    reason: >-
      A running decision log; each entry is governed by its own decision
      id and record, not by this heading.
  - heading: "Capabilities & Quality"
    reason: >-
      Descriptive platform facts about the capability catalog and quality
      history, not a session protocol.
  - heading: "Quick Session Checklist"
    reason: >-
      Restates steps already governed by the Session Start and Session
      contract headings; not itself independently enforced or
      decision-tied.
  - heading: "Full Session Checklist"
    reason: >-
      An expanded restatement of the Quick Session Checklist covering the
      same already-classified steps.
  - heading: "Report Filing Convention"
    reason: >-
      Prescribes where reports are filed and names the repository-root
      allowlist, but no repository check enforces placement and no
      decision id governs it.
  - heading: "Workflow Invariants (Non-Negotiable)"
    reason: >-
      Governs conduct inside Notion (never edit Journal or Decision
      content, no deletion), which lives outside this repository and
      carries no decision id or repository check.
  - heading: "Degraded Mode"
    reason: >-
      Short operational fallback guidance for Notion or Git unavailability,
      not code-enforced and not tied to a decision id.
  - heading: "Cross-Repo Updates"
    reason: >-
      Section header introducing the frontend-file update triggers; the
      governing rules are its two subsections, classified separately
      below.
