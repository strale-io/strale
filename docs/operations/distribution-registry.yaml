# Distribution surfaces register (M3 batch 3, T6).
#
# SHADOW REGISTER. authority_active is always false. The Notion Distribution
# Registry (Notion page 32e67c87-082c-81de-861f-dcc53576304c) stays the
# authority for distribution status until the founder-gated M4 cutover. This
# file exists so a repo-native reader can be shadow-compared against it in
# the meantime (scripts/distribution-lib.mjs, scripts/digest-shadow.mjs).
#
# Populated from verifiable evidence only, never from memory: the four root
# discovery manifests (context7.json, glama.json, server.json,
# smithery.yaml), every published package under packages/ (name and
# registry from its own manifest, confirmed live by npm view / a PyPI JSON
# fetch), pull requests on repositories outside strale-io authored by
# petterlindstrom79 (gh search prs), one handoff-named surface search
# missed, and docs/company/DIRECTORY-MAP.md, a fifth named source: it
# already backed the Glama and Smithery rows above, and review round 1
# corrected an earlier inconsistency (it was being read as evidence for
# some rows and refused as an unnamed source for others) by treating it as
# a source for every surface it documents evidence for, not only the two
# it happened to be cited on first (see
# docs/operations/distribution-registry.md for the full source log with
# hit counts). status_date is the date the cited evidence shows,
# not the date this row was written. See
# docs/operations/distribution-registry.md for the design, the searches
# run, and the social-media-post tracking decision.
