  verdict_reasoning: >
    Every criterion the acceptance gate itself names is met by direct
    production measurement, with the two most consequential jobs (the armed
    enforcement jobs) showing cadence within 0.04h of their declared period
    across ten-plus deploys, and the previously-56x-overrun weekly sweep now
