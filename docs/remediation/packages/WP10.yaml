    quality_floor: >
      7 tick_complete events in the last 7 days (declared 24h period; pre-fix
      was 51/7d). 10 events since the merge (10 days), gaps between
      consecutive ticks averaging 24.03h with stddev 0.01h (36 seconds) across
      9 gaps spanning ~120 deploys — a boot-relative reset would have produced
      dozens of irregular sub-hour gaps, not a steady ~24h cadence.
    capability_promotion: >
      7 tick_complete events in the last 7 days (declared 24h; pre-fix was
      45/7d). 11 events since the merge, gaps averaging 24.02h stddev 0.01h
