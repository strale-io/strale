      are triggered by ordinary per-test-run escalation checks, not the sweep.
      Using job_schedule directly is the more precise signal and is what this
      verdict rests on.
    no_stranded_or_crashing_jobs: >
      All 19 job_schedule rows (the 11 originally-migrated jobs, 7 aux slots,
