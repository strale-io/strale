acceptance:
  date: "2026-09-02"
  verdict: ACCEPTED
  overdue_by_days: 3   # gate was due 2026-08-30; T4 picked this up on 2026-09-02
  receipt: archive/receipts/2026-09-02-audit-wp10-cadence-verdict.json
  query: apps/api/scripts/wp10-cadence-verdict.mjs
  evidence:
    deploys_since_merge: >
      120 commits merged to main between ce5e63f (2026-08-23) and HEAD
      (2feb22bf, 2026-09-02) — `git log --oneline ce5e63f..2feb22bf | wc -l`.
      GET https://api.strale.io/health returned commit 2feb22bf35a5 at
      measurement time, confirming HEAD is the deployed commit, i.e. all 120
      merges correspond to real Railway redeploys (Dockerfile GitHub-source
      pipeline redeploys on every push to main), not just landed commits. This
      satisfies "at least one deploy/restart occurred since ce5e63f" by two
