package: WP9
title: Capability Invocation Facts
status: IMPLEMENTED_AWAITING_REVIEW
depends_on: [WP4, WP8]
risks: [CR-06]

objective: >
  Record what a capability invocation actually did, once, as a fact — so the
  quality floor and the breaker reason from evidence rather than from whichever
  table happens to have a row.

# Measured against PRODUCTION, not read off the audit.
production_evidence:
  the_floor_joins_on_capability_id: >
    jobs/quality-floor.ts:172 — `JOIN transactions t ON t.capability_id = c.id`.
    That is the entire basis on which a capability is quarantined or proposed
    for deactivation.
  solution_steps_produce_no_such_row: >
    A solution execution writes ONE transaction with `capability_id = NULL` and
    `solution_slug` set. The individual step results live inside that row's
    `output.steps` JSONB. 694 such rows exist, all with a null capability_id.
    So a capability invoked as a solution step produces ZERO rows carrying its
    id, and the floor's join cannot see it at all.
  hidden_volume: >
    126 sub-calls in the last 30 days are buried in `output.steps` and invisible
    to the floor, against 178,277 direct capability rows (overwhelmingly the
    internal harness). The absolute number is small today; the structural gap is
    not, and it grows with every bundle sold.
  what_this_means_concretely: >
    A capability that fails ONLY inside bundles is invisible to the quality
    floor. It cannot be quarantined, because as far as the floor's query is
    concerned it has no traffic. Conversely a capability quarantined on direct
    traffic keeps being invoked as a step until WP8 gated that — and WP8's gate
    is the only thing standing between the two views today.

defects:
  no_invocation_record: >
    There is no row that says "capability X was invoked at time T and this is
    what happened". There is a transaction row, which conflates the CALL
    (billing, rail, customer) with the INVOCATION (did this capability work).
    For a direct call the two coincide; for a solution step they do not, and the
    step's outcome is stored as JSON inside someone else's row.
  the_floor_reads_billing_rows_for_a_quality_question: >
    `transactions` is a billing artefact. Using it as the quality signal is why
    the floor needs `is_free_tier = false`, an internal-email exclusion list, a
    deleted_at filter and a status whitelist — four filters that exist to undo
    the fact that it is reading the wrong table.
  wp4_outcome_is_computed_then_discarded: >
    lib/execution-outcome.ts already produces exactly the fact this package
    needs — success, failure_class, billable, fault, counts_against_capability,
    output_assessment. It is used for the billing decision and then thrown away.
    The invocation fact should be that outcome, persisted.

design:
  one_row_per_invocation: >
    Written wherever a capability executor is invoked — the /v1/do rails, the
    x402 capability rail, and each solution STEP. Carries the capability slug,
    the canonical ExecutionOutcome fields, latency, and the parent transaction
    if there is one.
  the_floor_consumes_facts: >
    Replacing a join on billing rows with a read of invocation facts makes
    solution steps count. That is the exit condition, and the acceptance signal
    is that a capability failing only inside bundles becomes quarantinable.
    An earlier version of this line claimed the swap "removes the four
    compensating filters". It does not, and review said so: the fact branch
    still carries a free-tier filter, an internal-account exclusion and a
    verdict discriminator, and adds context_kind. Only deleted_at goes, and only
    because the column does not exist on facts. The gain is that solution steps
    are visible, not that the query gets shorter.
  not_a_second_audit_trail: >
    Deliberately distinct from the transaction audit record and from
    health_monitor_events. This answers "did this capability work", nothing
    else. It carries no customer content, so it is not subject to the 90-day
    content redaction and can be retained on its own schedule.

exit_conditions:
  - one immutable invocation fact per capability execution, including solution sub-calls
  - the quality floor consumes facts rather than joining billing rows
  - a capability failing only inside bundles is quarantinable, proved by test
  - the fact carries the WP4 canonical outcome rather than re-deriving one
  - a guard prevents a new invocation path skipping the fact
  - independent adversarial review passes

# ── Migration and retention implications, recorded explicitly ────────────────
migration:
  block: "0100_capability_invocations"
  creates: >
    capability_invocations, three indexes (slug+created, transaction, created),
    and an append-only trigger. Defer-not-throw: a throw aborts boot and a failed
    Railway deploy does not cut over (DEC-20260504-C). Until the table exists the
    floor falls back to its transactions query -- true only because the floor
    asks to_regclass FIRST, in its own round trip. The first version asserted
    that fallback and did not implement it: Postgres resolves relations at parse
    time, so the epoch probe would have raised on a missing table, the error
    would have escaped the decision loop, and the tick would have written no
    decisions AND no heartbeat. The heartbeat is the DEC-20260504-C proof that
    the job ran, so a deferred migration would have taken the armed quality
    floor down and erased the evidence of its own failure. Found by review.
  trigger_is_created_not_recreated: >
    The first version ran DROP TRIGGER IF EXISTS then CREATE TRIGGER on every
    boot. Blocks receive the DB handle rather than a transaction, so those
    autocommit separately -- every boot (~4/day in prod) opened a window with no
    append-only protection on a table whose entire purpose is immutability, and
    took ACCESS EXCLUSIVE on a table the customer path inserts into. Now created
    only when pg_trigger says it is absent. The function stays CREATE OR
    REPLACE, which takes no lock on the table.
  no_lock_timeout: >
    Block 0100 deliberately does NOT set one. SET LOCAL lock_timeout outside a
    transaction block is discarded, and blocks are handed the DB handle, so the
    idiom two neighbouring blocks use has never done anything there either. A
    bound that does not bind is worse than none, because the next reader
    believes the DDL is protected. Safety comes instead from no statement taking
    a heavy lock on an existing table.
  append_only_rule: >
    UPDATE is refused outright. DELETE is refused only inside 35 days — the
    floor's 30-day window plus margin. Blocking DELETE outright would make the
    table unprunable and guarantee a future incident whose only fix is dropping
    the trigger, i.e. the protection disappearing exactly when someone is under
    pressure. Bounding it targets the real threat: erasing evidence the floor is
    about to read.
  no_backfill: >
    Deliberately none. Backfilling ~180k rows from historical transactions inside
    a startup migration is a bulk write under DEC-20260504-B, and the epoch
    bridge removes the need for it — facts from the first one written,
    transactions before that instant. Nothing is double-counted and the
    transactions branch contributes nothing once the table outlives the window.
  deploy_verification: >
    DEC-20260504-C requires querying prod for the effect, not reading a log line.
    After deploy: SELECT to_regclass('public.capability_invocations') must be
    non-null; SELECT count(*) FROM capability_invocations WHERE created_at >
    NOW() - INTERVAL '1 hour' must be non-zero once traffic has flowed; and the
    next quality-floor tick's heartbeat event must carry evidence_holes = 0.

retention:
  window_days: 180
  guard_days: 35
  rationale: >
    Six times the floor's 30-day window. Not a compliance artefact and not on the
    1095-day tier: a fact carries no customer content by design — no inputs, no
    outputs, no error strings, only the verdict — so nothing here is what the
    90-day content redaction exists to remove, and nothing an Art. 15 or Art. 17
    request reaches. The purge is LIMIT-paginated per DEC-20260504-B; the table
    is created empty so the first run has no backlog, but it accrues roughly 6k
    rows a day once the writer is live.
  invariant_tested: >
    Retention must stay strictly above the trigger's delete guard, and the
    TypeScript constant must match the interval the migration installs. Both are
    asserted, because the failure mode of them drifting is a purge that throws
    nightly inside a bulk job — the class of failure this platform has let run
    unnoticed for days before.

mutation_results:
  tool: apps/api/scripts/mutation-test.mjs
  protocol: "green -> red -> green, clean tree at both ends"
  caught:
    - "fold ignores fact rows entirely"
    - "fact failures always count, ignoring the WP4 verdict"
    - "solution steps stop recording on the FAILURE path"
    - "guardedExecute stops deriving a failure outcome"
    - "revenue taken from the fact instead of the billing table"
    - "x402 gateway stops deriving a failure outcome"
    - "/v1/do stops recording entirely"
  claim_withdrawn: >
    An earlier version of this list claimed a mutation "epoch bridge dropped so
    the floor reads only billing rows" was caught. Review checked and found no
    test referencing the epoch at all, so nothing could have reddened
    behaviourally -- the mutation I actually ran was on the fold source
    discriminator and I labelled it wrongly. Withdrawn. The epoch bridge is now
    covered by source-level assertions in jobs/quality-floor.test.ts.

  survived_then_fixed:
    - >
      Removing ONE of guardedExecute's two recordInvocation calls survived. The
      guard asked whether a file records at all, and a file that records only its
      successes passes that question while handing the floor a completion rate
      that can never fall below 100% no matter how broken the capability is —
      worse than no signal, because it reads as health. The rail-completeness
      invariant now requires two record sites and at least one error-outcome
      derivation PER FILE, so wiring one rail twice cannot cover for another
      wired once. The mutation now reddens.

exit_condition_status:
  immutable_invocation_facts_incl_solution_subcalls: MET
  floor_consumes_facts_not_billing_rows: MET
  bundle_only_capability_is_quarantinable: MET      # proved by test, mutation-checked
  fact_carries_wp4_outcome_not_a_rederivation: MET
  guard_prevents_a_new_path_skipping_the_fact: MET  # found a real hole in guardedExecute
  rail_completeness_invariant: MET                  # added after a mutation survived
  migration_and_retention_recorded: MET
  independent_adversarial_review: PENDING

# Not part of this package. Recorded so the boundary is explicit rather than
# assumed: the public-copy correction, the production-authorization controls
# (branch controls/production-authorization) and the stranded-transaction
# reconciliation are separate artefacts and must not enter this PR.
out_of_scope:
  - public-copy correction (docs/remediation/PUBLIC-COPY-CORRECTION.md)
  - production authorization controls (controls/production-authorization)
  - stranded-transaction reconciliation (Brief A)

# -- Independent review round 1: FAIL, five blocking findings, all remediated --
review_round_1:
  verdict: FAIL_REMEDIATION_REQUIRED
  b1_deferred_migration_killed_the_floor: >
    The epoch probe named capability_invocations unconditionally. Block 0100 is
    defer-not-throw, so on a deferred block the probe raises, the error escapes
    past the decision loop, and the tick writes no decisions AND no heartbeat --
    the DEC-20260504-C proof query being the very thing that stops being
    written. The floor is armed in production: 78 enforce ticks in 20 days, 8
    quarantines. Fixed by asking to_regclass first, in its own round trip, and
    skipping the fact query entirely when the table is absent.
  b2_lock_timeout_was_a_no_op: >
    SET LOCAL outside a transaction block is discarded and blocks get the DB
    handle. The intended 3s DDL bound did not exist; the real bound was the 30s
    statement_timeout, and a timed-out lock wait would defer the block -- which
    under B-1 killed the floor. Removed, with the reason recorded, rather than
    left as a bound that does not bind.
  b3_revenue_lost_the_internal_account_exclusion: >
    Revenue moved out of the fold, which had summed price_cents over rows that
    had already passed the internal-account, free-tier and clamp filters. The
    replacement query carried none of them. Measured against production: 202
    active capabilities went from zero external revenue to non-zero purely on
    internal accounts, so requiresHuman -- the flag deciding whether a
    deactivation proposal is a Petter-only call -- stopped discriminating.
    Filters restored.
  b4_the_load_bearing_defence_did_not_exist: >
    invocation-facts.ts documented two defences and called the volume
    cross-check the load-bearing one, on the grounds that a marker event is
    written to the same database that just refused the fact. Only the marker
    existed. Now implemented as detectFactVolumeShortfall, deliberately coarse
    because facts and transactions do not correspond one-to-one by design.
  b5_the_prescribed_proof_query_returned_nothing: >
    evidence_holes appeared only on per-decision events, but a zero-decision
    tick is the steady state, so the DEC-20260504-C verification this package
    prescribed could not be run at all. The heartbeat now carries
    facts_table_present, fact_epoch, evidence_holes and evidence_shortfalls.
  dead_code_removed: >
    droppedInvocationFactCount() was documented as exposed for the health
    surface and had zero consumers.
  still_open_non_blocking:
    - >
      N-2: composite capabilities such as website-to-company invoke other
      executors in-process via getExecutor and record no facts -- structurally
      the same defect WP9 closes for solution steps. Dormant today; that
      capability is deactivated in production. The guard cannot see it because
      it searches for the literal customer_paid context marker, which such a
      file does not contain. Recorded rather than fixed: widening the guard to
      every getExecutor caller would flag the provider chain and the test
      harness, which legitimately do not record.
    - >
      N-1: recordInvocation is awaited on a separate pooled connection inside
      the open wallet transaction. It cannot poison that transaction, but it is
      a nested pool acquisition and carries no timeout of its own.
    - >
      N-6: the table stores user_id for 180 days and the trigger refuses UPDATE
      unconditionally, so there is no mechanism to honour an Art. 16 or Art. 17
      request against it. "No customer content" is not the same as "no personal
      data". Needs a decision, not necessarily a code change.
