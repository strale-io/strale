verification_gates:
  VERIFY-IP:
    status: RESOLVED
    resolved: "2026-09-02"
    blocks: []   # was [WP12]; WP12 unblocked, see packages above
    confidence: high
    method: >
      Empirical, not documentary. DNS: api.strale.io CNAMEs to a Railway-
      generated *.up.railway.app hostname resolving straight to a Railway
      edge IP -- no CDN hop. Response headers (Server: railway-hikari,
      x-railway-edge: ams1) show only Railway's own edge, no cf-ray or other
      CDN fingerprint. Decisive test: 3 POST /v1/do calls to the free-tier
      email-validate capability from this machine -- no spoof, a single
      spoofed X-Forwarded-For, and a multi-value spoofed X-Forwarded-For plus
      a spoofed X-Real-IP -- all three produced the IDENTICAL ipHash in the
      response's audit request_context, proving Railway's single edge hop
      overwrites/strips client-supplied XFF and X-Real-IP rather than
      appending to them. Script: apps/api/scripts/verify-ip-probe.mjs.
      Receipt: archive/receipts/2026-09-02-audit-verify-ip-proxy-hops.json.
    answer: >
      Exactly ONE proxy hop (Railway's own edge; no Cloudflare/CDN in front
      of api.strale.io). The leftmost X-Forwarded-For entry IS the true
      client IP for requests through this path; client-supplied
      X-Forwarded-For / X-Real-IP values cannot reach the application.
      Current code (getClientIp, leftmost-XFF) is CORRECT and not spoofable
      through this path.
    note: >
      Corrects FABLE-REAUDIT.md's CR-19 framing ("every extractor reads
      leftmost XFF (spoofable)") for the topology as it actually exists.
      Railway's own documentation is silent on XFF handling and its
      community forum carries two directly contradictory staff answers on
      the same question -- neither was relied on; the verdict rests on the
      direct empirical test only. Caveat: single-machine, single-point-in-time
      test against the public custom domain; does not cover Railway internal
      private networking or a future platform-level change. See
      docs/remediation/CURRENT-STATE.md "VERIFY-IP resolved" for the full
      writeup.
  VERIFY-DEP:
    status: TRIAGE_COMPLETE
    resolved: "2026-09-02"
    blocks: []   # was [WP13]; triage done, upgrade work remains (see WP13.reachability_triage)
    note: >
      1 critical / 14 high counted (7 moderate / 2 low not triaged --
      out of this pass's scope). Reachability triage run:
      archive/receipts/2026-09-02-audit-wp13-dependency-reachability.json.
      10 of 15 critical/high advisories reachable from the running API import
      graph, including the sole critical's UNreachability (shell-quote, dev-
      tooling-only) and the highest-value reachable finding (drizzle-orm SQL
      injection, direct dependency). 5 unreachable, each with a traced reason
      (unused MCP-SDK express/OAuth transport, or dev-CLI-only nesting).
  VERIFY-LEGAL: {status: OPEN, blocks: [WP14], note: "Dilisense role, DPA, assent evidence"}
  VERIFY-P3:
    status: COMPLETE
    complete:
      - "index / orphans / delisting / free-x402 / publication — production read-only, done at audit time"
      - "settlement — closed by WP5 (durable x402 payment state and its reconciler), ACCEPTED"
      - "process-kill — closed by WP10, which MEASURED the production restart interval at a 1.0h median rather than assuming one"
      - "cadence — WP10's seven-day gate MET 2026-09-02: docs/remediation/packages/WP10.yaml acceptance block"
    outstanding: []
    note: >
      Previously an undifferentiated PARTIAL, which read as though none of it
      had moved. All four deferred portions are now closed; the last
      (cadence) closed 2026-09-02 via WP10's acceptance measurement.

