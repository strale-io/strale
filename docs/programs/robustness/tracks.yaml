  - id: T1
    title: "R1: Untrusted-input bounds (url-to-markdown parse bound first)"
    status: active
    gate: none
    depends_on: []
    owner: session
    next_action: "Owner: orchestrator; Codex builds, Claude reviews (DEC-20261101-A).
      Check the head of codex/url-to-markdown-parse-bound. It sat at its brief
      commit 627d8402 at the last check (orchestrator state, 2026-11-06 about 21:05
      Swedish time). When the head moves, run an independent untrusted-input
      review in a separate context. The brief, on that branch at
      docs/lanes/codex/url-to-markdown-parse-bound-brief.md, asks for three
      things. First, measure before and after. Second, add a linear pre-pass
      before jsdom that bounds nesting depth, attributes per tag and attribute
      length, or else a worker with a hard timeout. Third, throw rather than
      return empty Markdown. Hold the review to the lesson from company-enrich
      (#947): parse time is what matters, not size. Fix the findings, then open
      the PR with auto-merge. If no result arrives within the run limit of 3
      briefs, Claude builds it from the same brief. Then sweep the other places
      that hand fetched markup to jsdom (lib/company-enrich/structured-metadata.ts,
      which builds its DOM from bounded HTML since #947, and lib/nta-corporate.ts, which bounds the
      response before building a DOM) and record each one's bound in a single
      receipt. Unverified: the jsdom timings in the brief (16 KB nested div 1.5 s,
      1.4 MB attribute flood 452 s) were measured during the company-enrich
      reviews; url-to-markdown itself has not been measured, and the brief's
      first step does that."
    resume_file: handoff/_general/from-code/2026-11-06-orchestrator-state.md
    exit:
      - "A receipt shows every adversarial input in the brief (nested div 16, 32
        and 64 KB, nested formatting tags 16 and 32 KB, a 1 MB attribute flood, 16
        MB of flat tags) finishing well under 1 s or throwing unbilled, with a
        fail-before run on the unfixed file."
      - "Normal pages convert exactly as before; the existing url-to-markdown and
        readability tests pass."
      - "Every jsdom call site on fetched or caller-supplied markup in
        apps/api/src has a stated bound in the sweep receipt, or a fix."
    evidence: []
