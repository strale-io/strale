      T7 as a narrowing candidate, not edited here. Confirm acquisition_method and
      the data-access lane are present in provenance on every tool
      (DEC-20261023-A)."
    resume_file: docs/research/2026-11-06-customer-promise-inventory.md
    exit:
      - Provenance coverage is 100% of tools in the static contract and the
        production count of null provenance is zero or explained per tool.
      - Zero transparency-tag mismatches and zero data_source mismatches remain, or
        each is a recorded narrowing.
      - The chain verifies on the sample, and the mutation test fails against an
        altered row.
      - Every audit-page regulatory statement maps to a populated field or is queued
        for narrowing.
