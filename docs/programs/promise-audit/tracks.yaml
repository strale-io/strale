      after refusalDetails, and the x402 and batch rails that spread details
      from the thrown object use it too. package-docs' npm 403/429 message
      now starts with the source-block prefix, so every rail agrees.
      Found in its review, not fixed there: x402 and /v1 solution summaries
      still advise retry with backoff when every step was a source block
      (x402-gateway-v2.ts all-steps-failed, solution-execute.ts top-level
      details); the batch replay path rebuilds failed items without
      source-block or refusal advice; the x402 next_step names GET
      /v1/capabilities rather than GET /x402/catalog; a solution step's
      200-character truncation can cut the RFC 9309 marker for hostnames over about
      70 characters; invoice-counterparty/compose.ts re-wraps a step's block.
      Next: (41), (42); then measuring past billed calls from
      the affected paths since their earliest releases, deciding refunds per
      policy with a DEC-20260504-B drain plan, and the wallet-debit sweep against
      listed and dry-run prices (P-011, P-008). Do not assume the proposed
      degraded billing marker shipped. No production financial run or refund was
      performed by any wave. Pre-existing defects found in the wave 2a review,
      not fixed there: dependency-audit severity is always low because OSV
      querybatch returns only id and modified (critical CVEs billed as low;
      summary and aliases empty); unpinned PyPI requirements and registry-404
      dependencies never reach OSV, and malicious-removed npm packages with MAL-
      advisories are billed as 0 vulnerabilities; dependency-audit with only
      404s and unavailable sources and nothing queryable bills an empty audit
      (requireSomeAnswer edge); business-day-check next and previous business
      day use only the current year's holidays (wrong on 31 Dec), and a 404 for
      an unknown country code such as ZZ is billed as weekends-only (both
      fixed in #1027);
      eori-validate bills valid false for GB EORI numbers (the EU service says
      Not valid); package-security-audit with a nonexistent explicit npm version
      gets an empty OSV answer and is billed low; holiday-calendar getHolidays
      caches a non-list 200 body for 24h. Found in wave 2b, not fixed there:
      github-repo-analyze reads only README.md (a readme.md or README.rst reads
      as No README); startup-domain-check uses DNS, not RDAP, so a registered
      domain with no DNS records still reads available."
