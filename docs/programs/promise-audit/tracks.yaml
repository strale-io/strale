  - id: T3
    title: "T3: Evidence, provenance and audit records"
    status: queued
    gate: none
    depends_on: []
    owner: session
    next_action: "Owner: orchestrator, with a Codex lane for the static scans (no
      secrets needed). Run four checks and write each as a receipt: (1) a static
      contract over every executor that a success carries provenance.source and
      fetched_at, plus a read-only production count of the last 14 days of
      successes with null provenance, by capability; (2) a tag-versus-executor scan
