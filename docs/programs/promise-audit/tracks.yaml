      receipt per family."
    resume_file: docs/research/2026-11-06-customer-promise-inventory.md
    exit:
      - Every listed-entity reference case for sanctions and PEP returns a match, and
        no clean control returns a hit above the documented false-positive rate; any
        miss is traced to Dilisense and recorded.
      - Each registry reference entity returns the expected status, and every forced
