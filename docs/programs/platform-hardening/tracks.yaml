      served calls over 290 tools since the deploy. Follow-up outside the exit
      criteria, carried in the handoff - 16 tools returned a response missing a
      field their manifest declares guaranteed, and 14 of those are absent from
      the static consistency allowlist, so only runtime measurement finds them;
      the cause per tool is not diagnosed, the samples are small, and the live
      alert will essentially never fire at these volumes, which is the case for
      the weekly persisted-miss check the H3 handoff proposed.
    resume_file: docs/research/2026-10-27-codebase-architecture-review.md
