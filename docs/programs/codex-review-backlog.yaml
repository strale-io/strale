  review_by: "2026-09-07"
  routing: >
    Until Codex returns, a fresh read-only Claude agent that did not author
    the batch performs the independent review, and the batch is recorded
    here. When Codex returns, drain this register before starting new work
    that would add to it. A Codex verdict of FAIL on merged work opens a
    remediation batch; it does not revert automatically.

