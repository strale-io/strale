# CTO-readiness program — track register.
# Validated by `npm run programs:check` (tests: `npm run programs:test`).
# Human view: PROGRAM.md; this file wins on any disagreement.
# Status enum: queued | active | blocked | founder_gated | done | rehomed
# Exactly one track is `active` at any time. A `blocked` or `founder_gated`
# track must name its blocker. A `done` track must list evidence paths that are
# tracked regular files on main. A `rehomed` track must name where it went.
# Only `done` satisfies a dependency. `program_status` is active (exactly one
# active track), paused (no active track; at least one founder_gated or blocked
# track and nothing runnable), or complete (every track done or rehomed).
# Every track declares `gate`: none (not sequenced by the migration), m2 (M2
# work), m2-exit (the single M2 exit gate), post-m2 (M3 and later). The M2
# closure register's validator refuses any post-m2 track that is active or
# done while a blocking M2 gap remains, or that does not depend (transitively)
# on the m2-exit track; adding a track cannot bypass this because the field
# is required.
