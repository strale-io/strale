  - id: cdp-bazaar-curation
    to: "CDP support (address open: the x402 docs publish no support email and route help to Discord, checked 2026-10-29; D3 rules out Discord and forum posts. The sender uses CDP's official support contact, or asks Petter)"
    subject: "Request for x402 Bazaar curation review: Strale (api.strale.io)"
    asked: Whether Strale's x402 endpoints can be reviewed for the curated (featured) Bazaar tier, the right channel for that, and anything in our metadata or availability that would stop them qualifying
    unblocks: Distribution track D3 (tracks.yaml T4, DEC-20261027-B §9 item 1)
    sent:
    sent_by:
    follow_up_by:
    status: draft
    note: D3 follow-up rule, which replaces the usual two follow-ups. Set follow_up_by to 45 days after sending; if no answer by then, send one follow-up, then close the row as dropped. Before sending, re-run Coinbase's validator on /x402/v2/vat-validate (POST https://api.cdp.coinbase.com/platform/v2/x402/validate) and send only if it still returns valid true. Earlier contact checked, docs/company/coinbase-bazaar-email.md, a draft to Coinbase about indexing withdrawn unsent on 2026-08-15 because its premise was wrong; this row asks about curation, a different question.
    body: |
      Hello CDP team,

      I run Strale, a library of tools that AI agents call and pay for per call over x402 on
      Base mainnet. Your "Get discovered" guide describes a curated tier of the x402 Bazaar.
      I would like to ask for Strale's endpoints to be reviewed for it.

      - Endpoints: https://api.strale.io/x402/v2/<tool>, with the full list at
        https://api.strale.io/x402/catalog
      - Receiving address: 0x66D7C2F952362BFB24FD7F02a9beC9c754ea83bC (Base)
      - Our 402 responses carry serviceName, tags, iconUrl, an input schema and an example
        input in extensions.bazaar. Your validation endpoint returns valid: true
        for, for example, https://api.strale.io/x402/v2/vat-validate.
      - Our flagship category is official-source company and VAT data; each answer
        names its source and when it was fetched.

      Two questions:
      1. Is there a process for requesting a curation review, and is this the right place
         to ask?
      2. Is there anything in our metadata or availability that would keep these endpoints
         from qualifying?

      Thank you,
      Petter
      Strale (Moonlighter AB, Sweden)
      petter@strale.io
  - id: registercheck-terms-provenance
    to: info@registercheck.de (Openlaw GmbH, Munich; address from the registercheck.de imprint as indexed by search on 2026-10-29, the page itself rate-limited the session; confirm on the imprint before sending; from petter@strale.io)
    subject: "registercheck.de API: licence for resale, data provenance and pricing"
    asked: Whether per-call results may be resold inside another API product with attribution; how the register copy is obtained and whether that can be documented; caching and retention limits; SLA and support; pricing currency, credit cost, volume terms and pay-per-call without commitment
    unblocks: Vendor evaluation of registercheck (config/vendors.yaml id registercheck) and the coverage comparison in docs/research/2026-10-29-registercheck-coverage-comparison.md
    sent:
    sent_by:
    follow_up_by:
    status: draft
    note: Openlaw sells to AI agents too, so it is also a potential competitor; the body says no more about Strale than the opening line. No account exists and none is to be created before a written answer to questions 1 and 2.
    body: |
      Hello,

      I run Strale, a library of tools that AI agents call and pay for per call. We are
      looking at registercheck.de as a source of German commercial-register data and have
      a few questions before we create an account. Your terms page was not readable for us,
      so please point me to the current terms if they answer any of these.

      1. Licence: may we resell per-call results from your API inside our own API product,
         with registercheck.de and the commercial register named as the source? If yes,
         under which terms or plan?
      2. Provenance: how is your copy of the register obtained, for example through an
         official licence or bulk channel, per-document purchases, or automated retrieval
         from handelsregister.de? Can you document this in writing?
      3. Storage: are there limits on caching or retaining results on our side? We delete
         stored response content after 90 days.
      4. Service: do you offer an SLA or uptime commitment, and what support channel and
         response times apply?
      5. Pricing: what currency are prices in, what does one credit cost on each plan, are
         there volume terms, and can we pay per call without a monthly commitment?

      Thank you,
      Petter
      Strale (Moonlighter AB, Sweden)
      petter@strale.io
