  status: forbidden
  surfaces: [homepage developers section, iban-validate manifest description]
  decided_by: "strale-frontend/docs/handoffs/2026-08-23-codex-website-handoff-v2/04_FINAL_CLAIM_AUDIT.md#9"
  note: iban-validate is format/checksum validation only. The manifest's own limitation says so.

- id: full-vies-verification-implied
  claim: /\b(provides?|performs?|includes?|does)\s+full VIES verification\b/
  is_regex: true
  status: forbidden
  surfaces: [homepage risk-and-verification section, vat-format-validate manifest description]
  decided_by: "strale-frontend/docs/handoffs/2026-08-23-codex-website-handoff-v2/04_FINAL_CLAIM_AUDIT.md#7"
  note: >
    vat-format-validate is format-level only. Flags a capability CLAIMING
    to provide/perform full VIES verification — deliberately does not
    match vat-format-validate's own correct redirect text ("Use
    vat-validate for full VIES verification"), which is the honest
    disclosure this rule exists to preserve, not catch.

