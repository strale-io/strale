- id: strale-operates-scrapers
  claim: /\b(our scrapers?|we (scrape|crawl)|strale (scrapes|crawls|operates scrapers?)|self-hosted scrapers?|scrap(es|ing|ed) (linkedin|facebook|instagram|twitter|x\.com|tiktok|google (search|results)))\b/
  is_regex: true
  status: forbidden
  surfaces: [homepage, README, methodology page]
  decided_by: DEC-20261023-A
  note: >
    Originally DEC-20260428-A Tier 1. Under DEC-20261023-A Strale reads
    single public pages per call (a page the customer names, or a public
    source Strale chose), honouring blocks and robots.txt with an honest
    user agent. That is not "scraping" in the customer-facing sense and is
    described as per-call reading of public pages, never as Strale running
    scrapers.

- id: bulk-crawling-claim
  claim: /\bbulk (crawl(ing)?|scrap(e|ing))\b/
  is_regex: true
  status: forbidden
  surfaces: [homepage, README, methodology page]
  decided_by: DEC-20261023-A
  note: Bulk crawling, pre-fetching and mirroring stay prohibited under DEC-20261023-A (formerly DEC-20260428-A and the DEC-20260813-A per-call carve-out).

- id: captcha-bypass-claim
  claim: /\b(captcha|CAPTCHA)\s*(solving|bypass(ing)?)\b/
  is_regex: true
  status: forbidden
  surfaces: [homepage, README, methodology page]
  decided_by: DEC-20261023-A
  note: CAPTCHA solving is on the absolute-prohibition list alongside robots.txt evasion and login-wall circumvention.

- id: framework-native-integration
  claim: /\bnative (pydantic-ai|langchain|crewai|semantic-kernel|google-adk|openai-agents)\b/
  is_regex: true
  status: needs_evidence
  evidence: apps/api/scripts/check-framework-packages.mjs
  surfaces: [distribution PRs, package READMEs, npm/PyPI descriptions]
  decided_by: DEC-20260422-A
  note: >
    Every claim of framework-native integration must be backed by a
    passing check-framework-packages.mjs run for that package. Case
    study: pydantic-ai maintainer closed a PR with "Shame on you" after
    finding pydantic-ai-strale had zero pydantic-ai-specific code
    (archive/sessions/CONTAINMENT_REPORT.md).

