# Claims register — one row per public claim Strale has ruled on.
# Schema: claims.schema.json. Checker: ../../scripts/check-claims.mjs
# (`npm run claims:check`). Writing rules: VOICE.md.
#
# Scope boundary: vendor-name drift (a stale vendor mention after a
# switch, e.g. "OpenSanctions" three days after moving to Dilisense) is
# NOT tracked here — that is apps/api/scripts/check-platform-facts-drift.ts's
# job, which already owns the canonical vendor list in platform-facts.ts.
# This register is for CLAIM PHRASING: certifications, superlatives,
# scope-widening framing, and forbidden/needs-evidence statements that
# aren't about which vendor is active.
#
# Audit items from the source claim audit
# (strale-frontend/docs/handoffs/2026-08-23-codex-website-handoff-v2/04_FINAL_CLAIM_AUDIT.md)
# that intentionally have no row here, because they are about a NUMBER or
# a LIVE VALUE being static rather than a fixed phrase, which a
# phrase-matching register cannot express: the static global price range,
# the static free-tool count, "Completed"/current-looking timestamps on
# fixtures (section 1), bank_code=500 (section 9), the $0.0540 current price
# (section 10), the 13/13 and "20 Aug" static values (section 11), and the
# active-tool, country, customer and static x402 coverage counts (section
# 14). Those belong to apps/api/scripts/check-platform-facts-drift.ts and
# to the platform facts endpoint. Every phrase-shaped item in the audit has
# a row, including "Sign in" (section 13).

- id: revenue-user-social-proof
  claim: /\b(trusted by|used by)\s+\d+(\+|\s*(companies|customers|developers|teams))?\b/
  is_regex: true
  status: forbidden
  surfaces: [homepage, README, package READMEs]
  decided_by: "strale-frontend/docs/handoffs/2026-08-23-codex-website-handoff-v2/04_FINAL_CLAIM_AUDIT.md#14"
  note: >
    No customer-count or revenue social proof until real, disclosable
    evidence exists. "Claims intentionally absent from homepage" list.

- id: sign-in-no-login-product
  claim: /\bsign in\b/
  is_regex: true
  status: forbidden
  surfaces: [homepage, README, package READMEs]
  decided_by: "strale-frontend/docs/handoffs/2026-08-23-codex-website-handoff-v2/04_FINAL_CLAIM_AUDIT.md#13"
  note: >
    There is no login product: API keys and x402 are the only access
    paths, so a "Sign in" control or sentence promises something that does
    not exist. "Sign up" and "get an API key" are fine.

- id: soc2-certified
  claim: /\bSOC\s*2\b/
  is_regex: true
  status: forbidden
  surfaces: [homepage, README, methodology page]
  decided_by: "strale-frontend/docs/handoffs/2026-08-23-codex-website-handoff-v2/04_FINAL_CLAIM_AUDIT.md#14"
  note: Strale has no SOC 2 attestation. Revisit only after a real audit completes.

