# Scheduled mechanism reachability register (T6 M3 batch 5).
#
# One entry per scheduled mechanism that runs a repository script: a step
# inside a .github/workflows/*.yml job with an `on.schedule` cron trigger.
# `npm run scheduled:check` (scripts/check-scheduled-reachability.mjs,
# scripts/scheduled-reachability-lib.mjs) parses every workflow under
# .github/workflows/ with the `yaml` package (never a regex over raw text)
# and proves, for every entry here, that its workflow exists, carries a
# schedule trigger, has a step matching `step` whose resolved command
# invokes `runs`, that `runs` exists on disk, and that the step's `env`
# reads exactly the secrets named. The reverse direction runs too: every
# step in a scheduled workflow that invokes a repository script must have
# an entry here (SCHEDULED_STEP_UNDECLARED), so a new scheduled step
# cannot land undeclared.
#
# This register changes no workflow's behaviour. It is read-only evidence
# that reachability which used to be assumed (DEC-20260504-C names exactly
# this failure class) is instead checked on every PR via ci.yml.
#
# Survey (archive/sessions/2026-09-11-m3-remaining-scope-inventory.md,
# section 4) found seven script-invoking steps in weekly-drift.yml and one
# in m3-digest-shadow.yml. stale-branches.yml has a schedule trigger too,
# but every one of its steps runs inline shell/`gh` commands, never a
# repository script file -- so it contributes no entry here. The Railway
# strale-digest-cron service is scheduled but is not a GitHub Actions
# workflow at all; it is recorded below as verifiable: false, since its
# cron schedule lives in Railway's own project configuration
# (apps/api/railway-config.md), and this repository holds no Railway API
# credential to read it (config/env-manifest.yaml).
schema_version: 1
mechanisms:
  - id: weekly-drift-manifest-drift
    workflow: .github/workflows/weekly-drift.yml
    trigger: schedule
    step:
      match: id
      value: manifest-drift
    runs: apps/api/scripts/sweep-manifest-drift.ts
    secrets: [DATABASE_URL]
    purpose: >
      Sweeps manifests/*.yaml against the live capabilities/solutions
      tables for drift between what a manifest declares and what the
      database actually holds.

  - id: weekly-drift-facts-drift
    workflow: .github/workflows/weekly-drift.yml
    trigger: schedule
    step:
      match: id
      value: facts-drift
    runs: apps/api/scripts/check-platform-facts-drift.ts
    secrets: []
    purpose: >
      Catches hardcoded capability counts, vendor names, and other facts
      that have drifted from apps/api/src/lib/platform-facts.ts across the
      public surfaces (frontend marketing copy, llms.txt, agent card,
      methodology pages).

  - id: weekly-drift-fetch-timeout
    workflow: .github/workflows/weekly-drift.yml
    trigger: schedule
    step:
      match: id
      value: fetch-timeout
    runs: apps/api/scripts/check-fetch-timeout-coverage.mjs
    secrets: []
    purpose: >
      Confirms every external fetch() call in a capability executor carries
      an AbortSignal.timeout(), per the Adding New Capabilities pipeline
      requirement in CLAUDE.md.

  - id: weekly-drift-vendor-roster
    workflow: .github/workflows/weekly-drift.yml
    trigger: schedule
    step:
      match: id
      value: vendor-roster
    runs: apps/api/scripts/check-vendor-roster-drift.ts
    secrets: [NOTION_TOKEN]
    purpose: >
      Flags vendor rows in the Notion Vendor Roster whose "Last evaluated"
      date is older than a Decisions DB entry in the window that mentions
      that vendor -- the 2026-04-30 failure mode where DEC-20260429-A
      deferred OpenSanctions but the Roster row stayed stale for a day.
      Since T6 batch 4b this step also prints (never fails on) the shadow
      comparison against config/vendors.yaml.

  - id: weekly-drift-audit-record-shape
    workflow: .github/workflows/weekly-drift.yml
    trigger: schedule
    step:
      match: id
      value: audit-record-shape
    runs: apps/api/scripts/check-shape-contracts.mjs
    secrets: []
    purpose: >
      Registry-driven wire-shape contract check (CONTRACTS array) --
      currently AuditRecord -- between apps/api/src/routes/audit.ts and
      strale-frontend/src/lib/compliance-types.ts. Reads the sibling
      strale-frontend checkout via STRALE_FRONTEND_PATH (job env, not a
      secret) and skips cleanly when that checkout is absent.

  - id: weekly-drift-toast-readability
    workflow: .github/workflows/weekly-drift.yml
    trigger: schedule
    step:
      match: id
      value: toast-readability
    runs: apps/api/scripts/check-audit-trail-readability.mjs
    secrets: [DATABASE_URL]
    purpose: >
      Full-detoast readability pass over compliance-critical JSONB columns
      (transactions.audit_trail), added after a 2026-08-12 lost-TOAST-chunk
      incident sat undetected for four months.

  - id: weekly-drift-output-schema
    workflow: .github/workflows/weekly-drift.yml
    trigger: schedule
    step:
      match: id
      value: output-schema
    runs: apps/api/scripts/check-output-schema.ts
    secrets: [DATABASE_URL]
    purpose: >
      Scans capabilities.output_schema for char-indexed corruption
      ({"0":"{","1":"\"",...}), the signature of a JS string getting
      JSON.stringify'd twice on some write path.

  - id: m3-digest-shadow-comparison
    workflow: .github/workflows/m3-digest-shadow.yml
    trigger: schedule
    step:
      match: name
      value: Run the repo-native digest shadow comparison
    runs: scripts/digest-shadow.mjs
    secrets: [NOTION_TOKEN]
    purpose: >
      Report-only shadow run of the repo-native digest priority readers
      (T6 M3 batch 2) against the live Notion digest data. Never fails the
      build, never writes anywhere, never changes what the production
      digest email renders. NOTION_TOKEN is mapped to the digest code's own
      NOTION_API_KEY variable name (config/env-manifest.yaml documents the
      two-name pair).

  - id: railway-digest-cron
    verifiable: false
    reason: >
      The strale-digest-cron Railway service (which runs
      apps/api/dist/jobs/daily-digest.js on Railway's own cron scheduler,
      documented cron "30 5 * * *" UTC) is not a GitHub Actions workflow --
      its schedule and start command live in Railway's project
      configuration, which this repository does not hold a credential to
      read (config/env-manifest.yaml lists no Railway API token). This
      register cannot mechanically verify it; it is recorded here so the
      gap is documented rather than silently unaccounted for.
    evidence:
      - apps/api/railway-config.md
    purpose: >
      Runs the daily digest email job once per day
      (apps/api/src/jobs/daily-digest.ts).
