# Vendor state register (M3 batch 3, T6). SHADOW MODE: authority_active is
# false and stays false until the founder-gated M4 cutover. The Notion
# Vendor Roster and Active Vendor Stack remain the authority until then;
# nothing here is read by production code or by any runtime decision.
# Design: docs/strategy/2026-09-10-m3-vendor-state-model.md. Inventory this
# register was populated from: archive/sessions/2026-09-10-m3-vendor-state-inventory.md.
#
# `npm run vendors:check` validates this file against config/vendors.schema.json
# and cross-checks it against apps/api/src/lib/dependency-manifest.ts
# PROVIDERS, apps/api/coverage-matrix/*.yaml provider values,
# config/env-manifest.yaml provider values, apps/api/src/lib/platform-facts.ts
# STALE_VENDORS, and history against the base branch. The env-manifest field
# is free text (the design document's recorded evidence conflict), so it is
# resolved by exact string lookup against each vendor's id, name and aliases,
# not by a schema reference.
#
# A surface's label is not evidence of use. Vendors named only by the
# coverage matrix were checked against the host their capability's executor
# actually calls, for every row whatever its status: openownership is unknown
# for that reason, "PSC register" is an alias of companies-house, and the ES
# row's "Openapi.com" label is stale (see openapi-com). Those coverage-matrix
# labels are wrong on the coverage matrix itself; this register does not edit
# it.
#
# A verification.* or authorization.status is "unknown" unless a repo file
# verifies it. Absence of evidence is recorded as unknown, never implied as
# verified. The only verified fields are redistribution (may Strale resell
# what the API returns?) for the ten vendors the two vendor-terms audits
# ruled on: docs/security/2026-09-06-vendor-terms-audit.md and
# docs/security/2026-09-10-vendor-terms-audit-batch-2.md. Each records the
# audit's outcome (permitted, conditional, prohibited). Four vendors whose
# every capability the audits switched off are held. The one decision link,
# with re-evaluation triggers, is dilisense, sourced from
# docs/decisions/records/DEC-20260429-A.md, whose own text names the
# retention decision and the review triggers.
#
# T6 batch 4a (this batch, shadow checks only, no runtime code touched) added
# fourteen vendors from apps/api/src/lib/platform-facts.ts STALE_VENDORS:
# opensanctions-self-host (held, DEC-20260429-A, the record text names the
# self-host deferral directly), and thirteen rejected/held entries whose
# code comment cites DEC-20260430-A or names no decision at all -
# surepay, monitorpay, movitz, banfico, ipid, bottomline, yapily, middesk,
# persona, socure, govlink and complyadvantage (rejected, decision: unknown,
# because DEC-20260430-A.md's own text does not name any of them as rejected
# even though the code comment attributes the rejection to it) - plus a new
# appended lifecycle entry on the existing openownership vendor (held, on
# apps/api/docs/ubo-resolve-uk-bods-evaluation.md's own "Recommendation:
# DEFER" text). vendors:check now cross-checks STALE_VENDORS in both
# directions (STALE_VENDOR_UNREGISTERED, STALE_VENDOR_STATE_MISMATCH failures;
# STALE_VENDOR_LIST_MISSING warning) and reports, as a warning, every provider
# the boot-time vendor_capability_dependencies sync in startup-migrations.ts
# skips (DEPENDENCY_SYNC_SKIPPED): a non-retired provider whose tier is not
# paid or self-hosted, or which is paid/self-hosted but was never seeded a
# vendor_accounts row at boot. Neither check changes runtime code or reads
# this register from production; both are read-only reports over the
# existing dependency-manifest.ts and startup-migrations.ts source.
#
# non_vendor_sentinels: provider strings on other surfaces that deliberately
# name no vendor. "Other" appears on apps/api/coverage-matrix/*.yaml rows
# (adverse-media-check, fr-bodacc-lookup, slovenian-company-data,
# uk-cop-check, us-ein-match). "internal" appears on config/env-manifest.yaml
# rows for platform-internal config with no external vendor. Counts are left
# out on purpose: vendors:check reads both surfaces live (rule 7).
#
# T6 batch 5 added the public vendor-list cross-check: every value in
# apps/api/src/lib/platform-facts.ts STATIC_FACTS.vendors must resolve to
# exactly one vendor here (STATIC_VENDOR_UNREGISTERED otherwise) whose
# current state is active or fallback (STATIC_VENDOR_STATE_MISMATCH
# otherwise); STATIC_FACTS_UNREADABLE if the map itself cannot be parsed.
# STATIC_FACTS.vendors is also a surface for the dead-alias rule (rule 7).
# This is the check that would have caught the two vendors STATIC_FACTS
# named with no register entry: BODACC (fr_litigation), added below as its
# own vendor, and Liberty Data (us_ein), which is not a separate vendor from
# the existing einsearch entry - apps/api/src/capabilities/us-ein-match.ts:7
# names the company operating einsearch.com as "Liberty Data Solutions", so
# "Liberty Data" is registered as an alias of einsearch, not a second
# identity for the same vendor. Four more STATIC_FACTS.vendors values named
# an existing vendor by a display string its aliases did not yet carry
# (Serper.dev (Google), Anthropic Claude, Coinbase x402 facilitator (USDC on
# Base), GLEIF L2); each was added as an alias of its existing vendor
# (serper, anthropic, coinbase-cdp, gleif respectively) for the same reason
# - same vendor, a different display string than the one already on file.
