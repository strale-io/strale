# Vendor state register (M3 batch 3, T6). SHADOW MODE: authority_active is
# false and stays false until the founder-gated M4 cutover. The Notion
# Vendor Roster and Active Vendor Stack remain the authority until then;
# nothing here is read by production code or by any runtime decision.
# Design: docs/strategy/2026-09-10-m3-vendor-state-model.md. Inventory this
# register was populated from: archive/sessions/2026-09-10-m3-vendor-state-inventory.md.
#
# `npm run vendors:check` validates this file against config/vendors.schema.json
# and cross-checks it against apps/api/src/lib/dependency-manifest.ts
# PROVIDERS, apps/api/coverage-matrix/*.yaml, and history against the base
# branch. It does not check config/env-manifest.yaml's provider field against
# this register (that field is free text today, per the design document's
# recorded evidence conflict); a future batch.
#
# Every verification.* and authorization.status below is "unknown" by
# design: no repo file in this batch verifies terms, pricing, licensing,
# redistribution rights, or authorization for any vendor here. Absence of
# evidence is recorded as unknown, never implied as verified. The one
# exception carrying a decision link and re-evaluation triggers is
# dilisense, sourced from docs/decisions/records/DEC-20260429-A.md, whose
# own text names the retention decision and the review triggers.
#
# non_vendor_sentinels: provider strings on other surfaces that deliberately
# name no vendor. "Other" appears on 5 apps/api/coverage-matrix/*.yaml rows
# (adverse-media-check, fr-bodacc-lookup, slovenian-company-data,
# uk-cop-check, us-ein-match). "internal" appears on 65
# config/env-manifest.yaml rows for platform-internal config with no
# external vendor.
