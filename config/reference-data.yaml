# Reference-data register (robustness R2).
#
# One row per reference dataset hard-coded into the tools: legal lists, tax and
# VAT rates, deadlines, code lists. Each row says where the data comes from,
# when it was last checked against that source, and when it is next due. Built
# from docs/research/2026-11-06-reference-data-inventory.md (80 datasets), with
# the fixes of PRs #954, #956, #961, #962 and #963 applied.
#
# Checked by scripts/check-reference-data.mjs (npm run refdata:check, in CI):
#   - every row's file exists and contains its symbol, and every tool has a manifest;
#   - every *_AS_OF / *_VERIFIED_ON / *_FETCHED_AT / *_CHECKED_ON date
#     constant under apps/api/src has a row
#     naming it (as_of_symbol), and the row's as_of equals the constant. Moving
#     one without the other fails the PR, so the register cannot fall behind
#     the code;
#   - PR CI never fails because time has passed. Rows that are due are reported
#     by the weekly drift sweep (.github/workflows/weekly-drift.yml, step
#     reference-data), which opens or updates the weekly drift issue, and
#     at session start (scripts/handoff/orient.mjs), whichever account runs.
#
# Fields
#   harm             A wrong compliance or legal answer; B wrong money figure;
#                    C wrong validation or lookup result; D cosmetic or low stakes.
#   as_of            the date the values are valid as of, or null if they were
#                    never checked against the source. Usually the check date;
#                    for a versioned source, the version date (then checked_on
#                    is set). Equals the code's as_of_symbol constant when the
#                    row names one. A dated row cites its evidence.
#   checked_on       the date of the last check, when as_of instead dates the
#                    source's own version (a FATF plenary, a consolidated text).
#                    Absent means the same as as_of.
#   review_days      days after the last check when the next one is due.
#   next_review_by   optional: brings the due date forward for a source on a
#                    calendar, such as FATF's plenaries.
#   first_review_by  for an undated row: the date its first check is due. This
#                    spreads the inherited backlog of undated rows over time
#                    rather than reporting all of it at once.
#   active           false when every tool is in DEACTIVATED (auto-register.ts),
#                    which the check enforces; such rows are never due.
#
# Clearing a due row: check the values against recheck_against, fix the code,
# move the dataset's *_AS_OF constant (add one if it has none) and set as_of,
# evidence and review_days here in the same PR. Values that cannot be confirmed
# keep their old value, marked "unverified as of <date>" in the code. They are
# never guessed. A source behind a bot challenge is read from a secondary copy
# that the code names, never by getting around the challenge (DEC-20261023-A).
#
# A new hard-coded dataset gets a row in the PR that adds it. The check catches
# a dated one; an undated one is caught only in review (REVIEW.md).
