# Environment manifest (T14). One row per distinct `process.env.NAME` read
# under apps/api/src, apps/api/scripts, packages and scripts.
#
# `npm run env:check` enforces what is provable from this file and the code:
# every read has a row, every row is read (or retired / read_indirectly), no
# duplicates, the schema, and the row contradictions in checkRowContradictions.
# `npm run env:example` regenerates both .env.example files from it.
#
# WHAT NO CHECK CAN SEE: whether `set_in` is true. Confirming that a value
# really is in Railway needs a credential CI must not hold, so it is an
# operator audit. The `railway` element of every row below was last verified
# on 2026-09-02 against `railway variables --json` on the `strale` service
# (names only, values never read) — that audit corrected 46 of 127 rows: it
# removed a false Railway claim from 43 and added a missing one to 3.
# Re-verify the same way after any change to the
# service's variables, and update this date when you do. The `.env`,
# `.env.test` and `workflow` elements are NOT covered by that audit: they
# describe developer machines and workflow secrets, and carry whatever the
# row's author asserted.
