[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-strale"
version = "0.2.0"
description = "LangChain integration for Strale — pay-per-call tools as agent tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Strale", email = "hello@strale.io" }]
keywords = ["langchain", "strale", "ai", "agent", "tools", "capabilities"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "langchain-core>=1.0,<2",
    "requests>=2.28.0",
    "pydantic>=2.7.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "responses>=0.25"]

[project.urls]
Homepage = "https://strale.dev?src=pypi-readme&utm_source=pypi-readme&utm_medium=listing&utm_campaign=distribution-d0-d1"
Repository = "https://github.com/strale-io/strale"
Changelog = "https://github.com/strale-io/strale/blob/main/packages/langchain-strale/CHANGELOG.md"
Documentation = "https://strale.dev/docs?src=pypi-readme&utm_source=pypi-readme&utm_medium=listing&utm_campaign=distribution-d0-d1"

[tool.setuptools.packages.find]
include = ["langchain_strale*"]
