name: CI

# ─── Documentation-only fast path ───────────────────────────────────────
#
# A pull request whose every changed file (against the PR's base) falls
# under docs/**, archive/**, handoff/**, or one of the root pointer files
# (CLAUDE.md, AGENTS.md, WORKTREES.md, README.md, top-level *.md) changes no
# code the `check` job's CODE steps or the `integration-db` job could ever
# disagree with. Those M2-closure-style batches were paying the full ~10
# minute apps/api suite plus the ephemeral-Postgres integration lane for
# zero code change.
#
# The `classify` job below computes that verdict once, from `git diff
# --name-only <merge-base>...<head>` (never a third-party action), and every
# CODE step downstream (builds, typecheck, lint scripts that scan source,
# `npm test`) is individually gated on `needs.classify.outputs.docs_only ==
# 'false'`. Every REGISTER step (the small `*:check` / `*:test` registers —
# programs, research, design, env, models, claims, docs, archive index,
# receipts, migrations, context, handoff, and the
# check-shape-contracts.mjs drift check, plus the content scanners that
# read docs/ and handoff/ or manifest data: check-no-committed-secrets,
# check-pii, check-manifest-guaranteed-consistency) runs
# unconditionally on every PR,
# in the same order as before this change, because those scripts read
# docs/config content that a docs-only PR can itself change and none of
# them import the built packages. A push to `main` always sets
# `docs_only=false` and runs everything — `main` is where the gate must
# never be soft.
#
# The `check` job keeps its name so branch protection's required-check list
# does not need to change; only individual steps inside it are skipped.
# `integration-db` is gated at the job level since every one of its steps is
# CODE (DB schema, migrations, integration suite).
#
# Two narrower verdicts sit beside docs_only (DEC-20261024-A, way-of-working
# review step 1). `briefs_changed` gates the CEO-brief lint to PRs that touch
# a brief or the linter itself. The archive/handoff index is regenerated by
# the pre-commit hook (scripts/handoff/regenerate-indexes.mjs), so CI only
# warns when it is stale.

on:
  push:
    branches: [main]
  pull_request:
  # GitHub merge queue. A queued PR is tested as the exact merge commit it
  # will become, so the queue needs every required check to run on this
  # event, or it waits forever. classify treats it like a push to main (not a
  # pull_request event), so the full gate runs: no docs-only fast path in the
  # queue.
  merge_group:

jobs:
  # ─── Change classification ──────────────────────────────────────────────
  #
  # Computes docs_only once so both `check`'s CODE steps and the whole
  # `integration-db` job can gate on the same verdict. fetch-depth 0 is
  # required to resolve the merge-base with the PR's base branch.
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      briefs_changed: ${{ steps.diff.outputs.briefs_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify whether every changed file is documentation-only
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          # main and the merge queue always run everything — never soften the gate on trunk.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull_request event (${{ github.event_name }}); docs_only=false, briefs_changed=true"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "briefs_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")

          echo "Merge base: $MERGE_BASE"
          echo "Changed files:"
          echo "$CHANGED"

          node scripts/production-watch/classify.mjs "$MERGE_BASE" "$HEAD_SHA" "$GITHUB_OUTPUT" pull_request

  # ─── langchain-strale offline suite (distribution T12) ──────────────────
  #
  # Drives the Python LangChain package's tools through langchain-core's own
  # primitives (a fake chat model with bind_tools, ToolCall -> ToolMessage)
  # with HTTP mocked, so it needs no key and no network. Runs on the
  # langchain-core floor the package declares and on the latest 1.x, so a
  # new langchain-core release that breaks the package shows up here.
  langchain-strale:
    needs: classify
    if: needs.classify.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            langchain_core: 'langchain-core==1.0.0'
          - python: '3.13'
            langchain_core: 'langchain-core>=1,<2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "${{ matrix.langchain_core }}" -e "packages/langchain-strale[test]"
      - run: python -m pytest packages/langchain-strale/tests -q -rs

  # ─── Ephemeral-Postgres integration lane (WP1) ──────────────────────────
  #
  # DB-critical behaviour — wallet locking, idempotency uniqueness, Stripe
  # crediting, audit-chain linkage — cannot be proven against a mocked db
  # module. Integration suites for it already existed in the repo, but every
  # one of them is gated on DATABASE_URL_TEST, and that variable was set in no
  # workflow. They therefore called describe.skip on every CI run since they
  # were written: green, and proving nothing.
  #
  # This job gives them a real database. Schema is materialised from
  # src/db/schema.ts via drizzle-kit push, so the lane tracks the same file the
  # application imports rather than a hand-maintained copy that can drift.
  #
  # Kept as its own job so the deterministic unit suite stays fast and a
  # database problem is legible as a database problem. The service container
  # is published on localhost, which is what the loopback guard in
  # src/test-support/integration-db.ts requires.
  #
  # Entirely CODE (schema materialisation, migrations, an integration test
  # suite) — gated at the job level on the documentation-only fast path.
  integration-db:
    needs: classify
    if: needs.classify.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: strale_test
        ports:
          - 5432:5432
        # Without a health check the first migration can race the server's
        # startup and fail the whole job for no real reason.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUDIT_HMAC_SECRET: ci-placeholder-secret-at-least-32-chars-long-0123456789
      FRONTEND_URL: https://strale.dev
      ADMIN_SECRET: ci-placeholder-admin-secret-at-least-32-chars-0123456789
      DATABASE_URL_TEST: postgresql://postgres:test@localhost:5432/strale_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # apps/api imports from strale-mcp/tools; app.ts cannot load without it.
      - run: npm --workspace=packages/mcp-server run build
      # BEFORE any write. `drizzle-kit push --force` is itself a write and
      # could alter or drop real schema if DATABASE_URL_TEST ever resolved to a
      # production database, so a check placed after it has already lost.
      #
      # The in-process guard checks the URL — loopback host, test-named
      # database. Both are properties of the address, and an address can lie: a
      # PgBouncer or tunnel can publish localhost/strale_test and route it to
      # production. This asks the database what it CONTAINS instead, which a
      # proxy cannot forge because it has to serve the real rows to be useful.
      # An absent table is fine here (fresh database); a full one is not.
      # Verified against production: refuses on 340 capabilities and 899k
      # transactions.
      - name: Verify the target database is disposable (before any write)
        working-directory: apps/api
        run: node scripts/assert-disposable-test-db.mjs

      # Materialise the schema in the throwaway database. --force skips the
      # interactive confirmation; the target is a fresh container, and
      # drizzle.config.ts refuses to run without DATABASE_URL_TEST.
      - name: Materialise test schema from src/db/schema.ts
        working-directory: apps/api
        run: npx drizzle-kit push --force
      # WP7: run the startup migrations too, exactly as boot does.
      #
      # `drizzle-kit push` materialises TABLES AND COLUMNS from schema.ts. It
      # does not create sequences, partial indexes, constraints or seed rows —
      # those live in startup-migrations.ts and run at boot. So a code path
      # depending on one of them passes locally (where the object was created by
      # hand) and fails in CI with an error that reads like a broken feature.
      # That is what happened here: `nextval('transactions_chain_seq')` had no
      # sequence, so nothing was hashed at all.
      #
      # Running both is also the more faithful lane — it is the sequence
      # production actually executes, so a migration that disagrees with the
      # schema now fails here rather than at boot (DEC-20260504-C).
      - name: Apply startup migrations (as boot does)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/strale_test
        run: npx tsx scripts/apply-startup-migrations.ts
      # STRALE_REQUIRE_INTEGRATION_DB makes a missing database a hard error
      # inside useTestDatabase() rather than a skip. Vitest exits 0 for a fully
      # skipped file, so without this the job would stay green while asserting
      # nothing — which is exactly how these suites lay dormant for months. If
      # the filter stops matching any file, vitest exits non-zero with "No test
      # files found", so the empty-lane case is covered too.
      # --no-file-parallelism is required, not a preference. Vitest runs each
      # test file in its own worker process, and each of these imports the app,
      # whose pool opens up to 30 connections. Nine files in parallel therefore
      # ask for far more than the server's max_connections of 100, and suites
      # drop out with a different count on every run. Measured: parallel gives
      # 8/9 files with 39-44 of 45 tests; sequential gives 45/45 across
      # repeated runs. They also share one database, so serialising them
      # removes cross-file interference at the same time.
      - name: Run DB integration suites (fails closed if the DB is missing)
        working-directory: apps/api
        env:
          STRALE_REQUIRE_INTEGRATION_DB: "1"
        run: npx vitest run --no-file-parallelism integration.test.ts

  image-boot-smoke:
    needs: classify
    if: needs.classify.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: strale_boot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:test@localhost:5432/strale_boot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
      # Real Dockerfile, loaded into Actions' Docker daemon. Layer cache keeps
      # unchanged dependency/build layers between runs (target: <6 min).
      - name: Build production image
        timeout-minutes: 6
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: strale-boot-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Production inherited its base schema from the original Drizzle push
      # (WP11); startup migrations alter existing tables, not an empty DB.
      # Push is TEST ONLY (drizzle.config.ts); subsequent deploys run only CMD.
      - name: Guard the disposable database
        working-directory: apps/api
        run: node scripts/assert-disposable-test-db.mjs
      - name: Bootstrap base schema and offline catalogue fixture
        working-directory: apps/api
        run: |
          npx drizzle-kit push --force
          node scripts/seed-boot-smoke.mjs
      - name: Boot real image with database-only networking
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker network create --internal boot-smoke
          docker network connect --alias postgres boot-smoke "$POSTGRES_CONTAINER"
          docker run --detach --name strale-boot-smoke --network boot-smoke \
            -e DATABASE_URL=postgresql://postgres:test@postgres:5432/strale_boot_test \
            -e AUDIT_HMAC_SECRET="$(openssl rand -hex 32)" -e FRONTEND_URL=http://localhost:3000 \
            -e NODE_ENV=production -e RAILWAY_GIT_COMMIT_SHA="$GITHUB_SHA" strale-boot-smoke
          started_at=$(docker inspect --format '{{.State.StartedAt}}' strale-boot-smoke)
          docker exec -i strale-boot-smoke node --input-type=module - "$started_at" "$GITHUB_SHA" \
            < scripts/ci/boot-probe.mjs | tee boot-result.json
          node --input-type=module -e 'import fs from "node:fs"; const {boot_ms} = JSON.parse(fs.readFileSync("boot-result.json", "utf8")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `boot_ms: ${boot_ms}\n`); if (boot_ms > 12000) console.log(`::warning::Boot took ${boot_ms}ms (warning threshold 12000ms)`);'
          docker exec strale-boot-smoke node -e "fetch('https://example.com',{signal:AbortSignal.timeout(10000)}).then(()=>process.exit(1),()=>process.exit(0))"
          # index.ts enforces the executor minimum before listen. Also prove
          # that this boot traversed registration, not just a catalogue fixture.
          docker logs strale-boot-smoke > boot-container.log 2>&1
          grep -E 'Health gate passed: [0-9]+ executors registered' boot-container.log
          if grep -q 'Fatal startup error' boot-container.log; then exit 1; fi
      - name: Logs and cleanup
        if: always()
        run: |
          docker logs strale-boot-smoke || true
          docker rm -f strale-boot-smoke || true
          docker network rm boot-smoke || true

  check:
    needs: [classify, image-boot-smoke]
    # A skipped required job can count as successful. Always run check and
    # explicitly fail its first step when a required dependency did not pass.
    # !cancelled() rather than always(): a cancelled run stays cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      # Required by apps/api/src/lib/audit-token.ts (F-0-001). Not secret —
      # just a 32+ char placeholder so the module-load assertion passes
      # under test. Production secret is set in Railway (Phase A Q1).
      AUDIT_HMAC_SECRET: ci-placeholder-secret-at-least-32-chars-long-0123456789
      # Required by apps/api/src/routes/wallet.ts for Stripe top-up redirect
      # URLs. Any HTTPS string works for test — the real value lives on
      # Railway. Without this, any test that imports app.ts (i.e. every
      # request-level test) fails at module load.
      FRONTEND_URL: https://strale.dev
    steps:
      - name: Require successful image boot (or intentional docs-only skip)
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          SMOKE_RESULT: ${{ needs.image-boot-smoke.result }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFY_RESULT" != success ]]; then
            echo "::error::Change classification did not succeed"
            exit 1
          fi
          if [[ "$SMOKE_RESULT" == success || ( "$DOCS_ONLY" == true && "$SMOKE_RESULT" == skipped ) ]]; then
            exit 0
          fi
          echo "::error::Image boot smoke did not succeed ($SMOKE_RESULT)"
          exit 1
      - uses: actions/checkout@v4
        with:
          # The project-context checks compare against origin/main (operator-action
          # history, closure-register removal checks); a shallow clone has no such ref.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # apps/api imports from `strale-mcp/tools`, which resolves to
      # packages/mcp-server/dist/tools.js(+.d.ts). The Dockerfile builds
      # the MCP server before the API for exactly this reason; CI must
      # do the same or typecheck can't find the module. See the seed CI
      # in #9 + the Phase B+C merge in #8.
      # CODE (build) — skipped on a documentation-only PR; none of the
      # REGISTER steps below import the built package.
      - if: needs.classify.outputs.docs_only == 'false'
        run: npm --workspace=packages/mcp-server run build
      # packages/langchain imports `straleio` (packages/sdk-typescript) by
      # its published dist/index.d.ts, same reasoning as mcp-server above —
      # its own typecheck (below, via root `npm run typecheck`) can't resolve
      # the module until sdk-typescript has been built at least once.
      # CODE (build) — same gate as mcp-server above.
      - if: needs.classify.outputs.docs_only == 'false'
        run: npm --workspace=packages/sdk-typescript run build
      # Phase 2 T2.1 (2026-08-17): widened from apps/api/src only to also
      # cover apps/api/scripts + apps/api/test (tsconfig.scripts.json,
      # apps/api's typecheck:scripts script) and the published TS packages
      # (sdk-typescript, langchain, semantic-kernel-strale, mcp-server) —
      # see the root package.json `typecheck` chain for the full list.
      # Previously only apps/api/src was ever typechecked; scripts/ and
      # test/ were tsx-transpiled but never checked, and the four packages
      # were never built or typechecked in CI at all.
      # CODE (tsc) — no source changed on a documentation-only PR.
      - if: needs.classify.outputs.docs_only == 'false'
        run: npm run typecheck
      # Codex review follow-up (2026-08-17, same PR as the T2.1 typecheck
      # widening above): tsconfig.scripts.json is TS/MTS only — it does NOT
      # cover the non-archived .mjs files (26 at the 2026-08-17 review) in apps/api/scripts, several of
      # which are themselves CI gate scripts (check-pii.mjs,
      # check-tier-coverage.mjs, etc.). Full checkJs coverage surfaced 166
      # errors (mostly noImplicitAny) when trialed, too large for a
      # same-pass fix — see tsconfig.scripts.json's DECLARED BOUNDARY
      # comment. This is the syntax-level floor in the meantime: proves
      # every .mjs parses as valid ESM, no more.
      # CODE (parses apps/api/scripts/*.mjs source).
      - if: needs.classify.outputs.docs_only == 'false'
        run: node apps/api/scripts/check-mjs-syntax.mjs
      # CODE (lints apps/api/src).
      - if: needs.classify.outputs.docs_only == 'false'
        run: npm --workspace=apps/api run lint:no-bare-catch
      # Money-integrity 2026-08-12: caller-URL capabilities must use safeFetch
      # or the ToS gate — raw fetch shipped as blocklist side doors ten times.
      # CODE (lints apps/api/src).
      - if: needs.classify.outputs.docs_only == 'false'
        run: npm --workspace=apps/api run lint:no-unguarded-user-fetch
      # The SSRF inventory guard hardcodes its walk root relative to the
      # repo root (`apps/api/src/capabilities`); invoking it via the
      # workspace wrapper sets cwd to `apps/api/` and ENOENTs. Call it
      # directly from the repo root (GitHub Actions default cwd) instead.
      # The sibling `lint:no-bare-catch` script accepts its walk root as
      # argv ("src"), so the workspace wrapper still works for that one.
      # CODE (walks apps/api/src/capabilities).
      - if: needs.classify.outputs.docs_only == 'false'
        run: node apps/api/scripts/check-ssrf-inventory.mjs
      # F-0-014 guard: no new `console.*` calls. Script is cwd-independent
      # (resolves paths from import.meta.url), so the workspace wrapper works.
      # CODE (lints apps/api/src).
      - if: needs.classify.outputs.docs_only == 'false'
        run: npm --workspace=apps/api run lint:no-new-console
      # SCF-3 guard: no API code access to transactions.integrity_hash_status
      # (owned by an untracked external workflow — see schema.ts comment).
      # CODE (lints apps/api/src).
      - if: needs.classify.outputs.docs_only == 'false'
        run: node apps/api/scripts/check-no-external-column-access.mjs
      # DEC-20260422-A: every framework-named *-strale package must contain
      # at least one real import from the framework it claims to integrate
      # with. Blocks the "hollow package" class of incident that surfaced
      # with pydantic-ai on 2026-04-21. See archive/sessions/CONTAINMENT_REPORT.md.
      # CODE (scans packages/*-strale source).
      - if: needs.classify.outputs.docs_only == 'false'
        run: node apps/api/scripts/check-framework-packages.mjs
      - if: needs.classify.outputs.docs_only == 'false'
        run: npm test --workspace=packages/zapier-strale
      # D8: the n8n node is built, linted with n8n's own rules and driven
      # through n8n-workflow's primitives offline (no paid calls).
      - if: needs.classify.outputs.docs_only == 'false'
        run: npm run lint --workspace=packages/n8n-nodes-strale
      - if: needs.classify.outputs.docs_only == 'false'
        run: npm test --workspace=packages/n8n-nodes-strale
      # D6: the AI SDK package's offline tool-loop test (mock model, mocked API).
      - if: needs.classify.outputs.docs_only == 'false'
        run: npm test --workspace=packages/ai-sdk-strale
      - if: needs.classify.outputs.docs_only == 'false'
        run: node --test apps/api/scripts/check-framework-packages.test.mjs
      # DEC-20260822-A: the CEO morning brief must stay a business synthesis.
      # Prose drifts back toward its author's frame, and the daily report had
      # already become an engineering activity log once. This lints every brief
      # in docs/company/briefs/ for structure, length, technical vocabulary and
      # the five fields the charter requires on any founder escalation. Rules
      # live in src/lib/ceo-brief-lint.ts and are unit-tested there; this step
      # is the reachability half — a gate nobody runs is a gate that does
      # nothing, which this repo has shipped three times.
      # Scoped (DEC-20261024-A, way-of-working review rank 8): runs on a PR
      # only when classify reports briefs_changed — a brief, the linter, its
      # rules or this workflow changed. Always runs on main. The linter's unit
      # tests run in `npm test` regardless.
      - if: needs.classify.outputs.briefs_changed == 'true'
        run: npx tsx apps/api/scripts/check-ceo-brief.ts
      # No credential in a recognised vendor token format may reach a tracked
      # file. Scans tracked files only — the public history is what matters,
      # and history is not retractable. Added 2026-08-22.
      # CODE (scans every tracked file, code and docs alike, for secrets —
      # kept as CODE per the explicit classification list rather than
      # reclassified to REGISTER; see the PR body).
      - run: node apps/api/scripts/check-no-committed-secrets.mjs
      # Phase A0b CI lint (wired 2026-08-17, Phase 2 T2.2 — written
      # 2026-08-12 but never wired in): apps/api/scripts/*.{ts,mts,mjs} must route
      # executor invocation through guardedExecute/assertGuardedAllow, not
      # call an executor obtained directly from getExecutor(). Pure static
      # scan of the scripts directory, no DB/network needed. Superseded and
      # made check-paid-api-preflight.ts (archived) redundant per the
      # 2026-08-12 scripts-rightsizing audit.
      # CODE (scans apps/api/scripts source).
      - if: needs.classify.outputs.docs_only == 'false'
        run: node apps/api/scripts/check-no-direct-getexecutor-in-scripts.mjs
      # Cert-audit C6 follow-up: every fetch() must be timeout-bounded.
      # Pre-existing offenders are tracked in fetch-timeout-allowlist.txt;
      # --strict fails CI on new offenders.
      # CODE (scans apps/api/src for fetch() calls).
      - if: needs.classify.outputs.docs_only == 'false'
        run: node apps/api/scripts/check-fetch-timeout-coverage.mjs --strict
      # Phase 3b (DEC-20260513-B + DEC-20260513-C): every manifest's
      # output_field_reliability.guaranteed entries must be enumerated in
      # output_schema.properties or output_schema.example. Pre-existing
      # drift tracked in scripts/manifest-consistency-allowlist.txt;
      # --strict fails CI on new offenders. Pairs with the runtime sentinel
      # at lib/guaranteed-fields-sentinel.ts which fires at scheduler-tick
      # time, and with onboard.ts verifyFixtures which fires at manifest
      # authoring time.
      # CODE (cross-checks manifests/*.yaml against the runtime sentinel in
      # apps/api/src/lib — not one of the explicitly named register/shape
      # checks, so kept as CODE; see the PR body).
      - run: node apps/api/scripts/check-manifest-guaranteed-consistency.mjs --strict
      # PII guard (renamed + widened 2026-08-14, was check-manifest-pii.mjs).
      # scrubFixture()/PII_ARRAY_FIELDS run at CAPTURE time on executor
      # output; manifests are hand-authored, so an example pasted from a
      # live response ships real people's names and no machinery ever looks
      # at it. That is how five manifests came to carry real board members
      # and partners for ~3 months after the 2026-05-18 fixture audit
      # flagged two of them (Detector 1, manifests/ only, unchanged logic).
      # The 2026-08-14 italian-company-stakeholders incident showed the same
      # live response duplicated into a scripts/ smoke fixture that this
      # gate didn't scan — manifests/ was scrubbed, CI went green, the
      # scripts/ copy shipped. Detector 2 closes that gap with a wider-scope,
      # checksum-gated scan (codice fiscale, IBAN) across manifests/,
      # apps/api/scripts/, apps/api/test(s)/, apps/api/coverage-matrix/,
      # archive/, audit-output/, handoff/, docs/, apps/api/docs/. See the
      # script header for why identifier-format + checksum was chosen over
      # a name-shaped heuristic for the wider scope.
      # CODE — this scanner does cover docs/, archive/ and handoff/ among
      # its many targets, so a docs-only PR does lose PII-scan coverage on
      # this fast path. That tradeoff is named explicitly in the PR body
      # rather than silently accepted; see "anything left open" there.
      - run: node apps/api/scripts/check-pii.mjs --strict
      # Tier-coverage gate (STRICT since 2026-08-17 — zero unallowlisted findings). For each manifest with a
      # captured response fixture at apps/api/test/fixtures/tier-coverage/
      # <slug>.json, compares empirical wire-shape against manifest
      # declarations: guaranteed-reliability fields must be populated;
      # populated fields must be declared in both output_field_reliability
      # and output_schema.properties. --strict now ENFORCES: any finding
      # not listed in scripts/tier-coverage-allowlist.txt fails this step.
      # Grandfathered findings stay in that allowlist until their manifest
      # is fixed (recapture, or declare the missing fields directly — see
      # the allowlist file's own header for when each applies). New slugs
      # with new findings fail CI on first appearance, by design.
      # See script header for findings classification + extension notes.
      # CODE (compares manifests/ against captured fixtures under apps/api/test).
      - if: needs.classify.outputs.docs_only == 'false'
        run: node apps/api/scripts/check-tier-coverage.mjs --strict
      # DEC-20260513-D Phase 3 Harden gate (a): canonical-input sentinel for
      # Identity capabilities. Catches the GR-PR-#116 class of bad-shape
      # fixture (branch entity asserted, dissolved status equals-asserted,
      # missing name-field assertion, off-shape identifier). Pairs with
      # check-manifest-guaranteed-consistency.mjs (gate (b), pipeline-bypass
      # detector) and the runtime guaranteed-fields-sentinel.ts. Enforcement
      # mode — --strict fails CI on new offenders versus the allowlist at
      # scripts/identity-fixture-shape-allowlist.txt. See script header for
      # the v1 criteria set and SI exemption rationale.
      # CODE (scans manifests/ fixtures against executor behaviour).
      - if: needs.classify.outputs.docs_only == 'false'
        run: node apps/api/scripts/check-identity-fixture-shape.mjs --strict
      # Cert-audit Layer 2 (generalised 2026-04-30): cross-repo
      # type-shape contracts (currently AuditRecord). Skips cleanly
      # when STRALE_FRONTEND_PATH is not present (CI doesn't check out
      # the frontend repo); the weekly drift cron is the place where
      # this fires for real, with the frontend checked out alongside.
      # Run with --list to see registered contracts.
      # REGISTER (explicitly named — "the shape and drift checks") — always
      # runs, so a docs-only PR still gets cross-repo shape-contract
      # coverage.
      - run: node apps/api/scripts/check-shape-contracts.mjs
      # Phase A0b cost_class coherence + Block 0082 throttled-vendor guard
      # (2026-08-14): cross-checks manifest cost_class against the vendor
      # env vars / hostnames the executor actually reads. Existed since
      # Phase A0b but was never wired into CI; the free_unlimited vs
      # throttled-upstream audit that produced Block 0082 is exactly the
      # class of drift this catches, so it goes live here.
      # CODE (cross-checks manifests/ against executor source in apps/api/src).
      - if: needs.classify.outputs.docs_only == 'false'
        run: node apps/api/scripts/check-cost-class-coherence.mjs

      # 2026-08-22 production-authorization incident. The whole authority model
      # rests on one property: the production write credential is readable in
      # exactly ONE module, which demands an Authority before releasing it. If
      # any other file can read it, a writable connection can be opened with no
      # authority attached and the model is decorative. That property is a grep,
      # so it is checked by one, on every change, rather than trusted.
      # CODE (scans apps/api/src for the production-write credential).
      - if: needs.classify.outputs.docs_only == 'false'
        run: node scripts/guard-production-write-access.mjs

      # Program track registers (docs/programs/*/tracks.yaml) are the resume
      # surface for multi-batch work on both AI tools. A register that fails
      # validation means a fresh session cannot tell what is active, so it is
      # checked here rather than trusted. Tests cover the checker itself.
      # REGISTER (programs:*) — always runs.
      - run: npm run programs:check
      - run: node --test scripts/production-watch/*.test.mjs
      - run: npm run programs:test
      # Research contract (T12, docs/research/*.md): one current file per
      # topic, reciprocal acyclic supersession, resolvable links/sources,
      # active decisions cite only current research. Tests plant every
      # failure mode in a throwaway repository.
      # REGISTER (research:*) — always runs.
      - run: npm run research:check
      - run: npm run research:test
      # Design tokens as data (T13, design/tokens/*.json): one active file
      # per surface with provenance/adopted_by, candidates carry a status,
      # promotion requires a decision (active.json changing against
      # origin/main with no adopted_by change fails), the generated
      # apps/api/scripts/lib/design-tokens.generated.ts stays in sync, and
      # an off-token hex/rgb/hsl/font-family/off-scale-px lint over the
      # internal-report consumers with a ratcheted allowlist. Tests plant
      # every failure mode in a throwaway repository.
      # REGISTER (design:*) — always runs.
      - run: npm run design:check
      - run: npm run design:test
      # Environment manifest (T14, config/env-manifest.yaml): one row per
      # distinct process.env.NAME read under apps/api/src, apps/api/scripts,
      # packages, scripts — undocumented reads and dead rows both fail, and
      # the generated .env.example / apps/api/.env.example must match what
      # the manifest would produce. Tests plant every failure mode in a
      # throwaway directory fixture.
      # REGISTER (env:*) — always runs.
      - run: npm run env:check
      - run: npm run env:test
      # Shadow vendor register (M3 batch 3, T6, config/vendors.yaml). Not
      # authoritative until the founder-gated M4 cutover, but validated and
      # cross-checked (dependency-manifest.ts PROVIDERS, coverage-matrix,
      # env-manifest, decision-record links, history against the base
      # branch) the same way the other cheap-extras registers are.
      # Founder-accepted permissions: validate evidence and reject silent downgrades.
      - run: npm run vendor-terms:check
      - run: npm run vendor-terms:test
      - run: npm run vendors:check
      - run: npm run vendors:test
      # Shadow distribution-surfaces register (M3 batch 3, T6,
      # docs/operations/distribution-registry.yaml). Not authoritative
      # until the founder-gated M4 cutover, but validated (schema, unique
      # ids, authority_active false, evidence paths, status_date not in
      # the future) the same way the other cheap-extras registers are.
      - run: npm run distribution:check
      - run: npm run distribution:test
      # Clay HTTP template (distribution D9): recipes match the tools'
      # documented inputs and outputs, and the sample table maps.
      - run: npm run clay:test
      # Repo-native digest priority readers (M3 batch 2, T6). Pure-function
      # tests only here (parser, 14-day split, handoff window, comparison,
      # workflow reachability) -- the shadow comparison itself runs daily
      # in .github/workflows/m3-digest-shadow.yml, report only, and is not
      # part of this PR gate.
      - run: npm run digest:shadow:test
      # Inactive project-document candidates (T6 M3 batch 4,
      # docs/project/candidates/end-session.md): the /end-session
      # repo-native replacement draft. Structural only - the candidate
      # exists with inactive front matter and its M4 caution block, names
      # both tools' identities, and neither live end-session file
      # (.claude/commands/, .agents/skills/source-command-end-session/)
      # references the candidates directory. Nothing here is executed by
      # either tool; the check only proves the draft stays inert and
      # findable.
      - run: npm run candidates:test
      # Protocol-extraction check (T6 M3 batch 6a,
      # docs/governance/protocols/DEPLOY_MECHANISM_VERIFICATION.md): the
      # first mandatory protocol extracted, byte-identical, from its
      # CLAUDE.md section, located by heading text (never by line number).
      # CLAUDE.md stays the sole authority until the founder-gated M4
      # cutover; this only proves the two copies have not silently diverged.
      - run: npm run protocols:check
      - run: npm run protocols:test
      # Protocol coverage manifest (T6 M3 batch 7,
      # docs/project/protocol-coverage.yaml): maps every mandatory
      # protocol/rule to its trigger, full-body path, governing decision,
      # decision record, and enforcing code/tests, proves every referenced
      # path exists, proves every mirror file and every protocol-shaped or
      # already-mirrored CLAUDE.md heading has a row, and proves the
      # generated docs/project/PROTOCOL-ROUTER.md is up to date. A single
      # additional check (a decision id named next to "protocol" with no
      # manifest row) is report-only until the M4 cutover. authority_active
      # stays false.
      - run: npm run protocols:coverage
      - run: npm run protocols:coverage:test
      # Scheduled mechanism reachability (T6 M3 batch 5,
      # config/scheduled-mechanisms.yaml): parses every
      # .github/workflows/*.yml with the yaml package and proves, for every
      # declared entry, that its workflow exists, carries a schedule
      # trigger, has a step matching the declared selector whose resolved
      # command invokes the declared script, that the script exists, and
      # that the step's env reads exactly the declared secrets -- plus the
      # reverse completeness rule (every scheduled step that invokes a
      # repository script must be declared). Changes no workflow's
      # behaviour; DEC-20260504-C names exactly this "assumed, not
      # verified" failure class.
      - run: npm run scheduled:check
      - run: npm run scheduled:test
      # Scheduled OUTCOMES (scripts/scheduled-outcomes-lib.mjs). The check
      # above proves a scheduled mechanism is reachable; every fact it reads
      # is static, and all of them stayed true through five consecutive
      # failed scheduled runs of weekly-drift.yml (2026-08-17 to 2026-09-14),
      # the last four of them on a DATABASE_URL secret whose value had stopped
      # authenticating (the fifth failed earlier, for another reason). Only
      # the TESTS run here: the check itself reads GitHub's run history, so
      # a pull request that changed no workflow must not fail because a
      # credential expired on a Sunday. It runs in the morning sweep
      # (docs/company/DAILY-RUN.md step B) as `npm run scheduled:outcomes`.
      - run: npm run scheduled:outcomes:test
      # Model registry (T14, apps/api/src/lib/models.ts): every Claude/
      # Voyage/GPT model id lives in one place with a pinned_at date and a
      # decision reference: fails on a model-id literal anywhere else in
      # apps/api/src (outside *.test.ts), or a registry entry missing
      # pinned_at/decision.
      # REGISTER (models:*) — always runs.
      - run: npm run anthropic:check
      - run: npm run anthropic:test
      - run: npm run models:check
      - run: npm run models:test
      # Claims register (T14, docs/company/claims.yaml): validates the
      # register, then scans README.md, packages/*/README.md, manifest
      # description fields, and platform-facts.ts for `forbidden` claims
      # (failing the build) and warns on `needs_evidence` claims whose
      # evidence doesn't resolve.
      # REGISTER (claims:*) — always runs.
      - run: npm run claims:check
      - run: npm run claims:test
      # CTO-readable structure (T5): docs/README.md must list every real
      # docs/ subtree (and no vanished one). archive/README.md and
      # handoff/README.md are generated from the filesystem; the pre-commit
      # hook regenerates them (scripts/handoff/regenerate-indexes.mjs), so a
      # stale index here is a warning, not a failure (DEC-20261024-A). It was
      # 10 of 11 recent CI failures, each a forgotten regeneration. A stale
      # index on a PR means a commit skipped the hook (a GitHub-side merge,
      # --no-verify); the next local commit touching archive/ or handoff/
      # heals it. Both checkers' tests plant every failure mode in a fixture.
      # REGISTER (docs:* / the archive index) — always runs.
      - run: npm run docs:check
      - run: npm run docs:test
      - name: Archive and handoff index (warning only)
        run: |
          # Exit 2 means stale: warn. Any other non-zero exit is a crash: fail.
          status=0
          node scripts/generate-archive-index.mjs --check || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning title=Stale archive/handoff index::Stable directory navigation is missing or stale; run npm run archive:index locally. Detailed listings: npm run archive:index -- --detail."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - run: npm run archive:index:test
      # Evidence receipts (T15, archive/receipts/*.json): schema-valid,
      # immutable once committed (blob at the introducing commit must match
      # HEAD), and every evidence: / production_evidence: path cited from a
      # decision record, a program track, or a remediation package resolves.
      # Warns (does not fail) on a post-2026-09-02 handoff stating a bare
      # test count with no receipt link. Tests plant every failure mode in a
      # throwaway repository.
      # REGISTER (receipts:*) — always runs.
      - run: npm run receipts:check
      - run: npm run receipts:test
      # Schema-migration ledger (T15, apps/api/src/lib/startup-migrations.ledger.json):
      # every runMigrationNNNN_* block in src/startup-migrations/blocks/ is ledgered
      # with a content hash (append-only — an edited block needs a new
      # block, not a silent rewrite) and columns_written, so two blocks
      # writing the same table.column fail the build unless allowlisted in
      # known_overlaps (the 2026-08-21 two-blocks-fought-every-boot
      # incident class). Tests plant every failure mode in a throwaway
      # fixture.
      # REGISTER (migrations:*) — always runs.
      - run: npm run migrations:check
      - run: npm run migrations:test
      - run: npm run gates:test
      # Session-end handoff gate (scripts/handoff/): the Stop hooks, the Codex
      # notify wrapper, and the git hooks all call the same checker. Its tests
      # plant every failure mode in a throwaway repository.
      # REGISTER (*:test under scripts/) — always runs.
      - run: npm run handoff:test
      # Repo-native project-context layer (M1/M2 candidates, decision graph,
      # M2 closure register). The checker itself is warning-only by contract
      # until M4; its test suite is not, and it asserts the checked-in context
      # is warning-clean, so drift on these files fails the build here.
      # REGISTER (context:*) — always runs.
      - run: npm run context:check
      - run: npm run context:test

      # CODE — the full apps/api suite. Skipped on a documentation-only PR.
      - if: needs.classify.outputs.docs_only == 'false'
        run: npm test
