name: Production watch
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: production-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check production health and jobs
        uses: actions/github-script@v7
        with:
          script: |
            const { production } = await import(`${process.cwd()}/scripts/production-watch/watch.mjs`);
            await production(github, context);
