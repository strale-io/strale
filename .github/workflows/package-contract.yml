name: Published MCP contract
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: package-contract
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Probe published MCP contract
        uses: actions/github-script@v7
        with:
          script: |
            const { packageContract } = await import(`${process.cwd()}/scripts/production-watch/package-probe.mjs`);
            core.info(JSON.stringify(await packageContract(github, context)));
