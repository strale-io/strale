name: Weekly drift sweep

# Runs every Monday 07:00 UTC (08:00 CET winter, 09:00 CET summer).
# Catches drift between PLATFORM_FACTS, manifests, and the public surfaces
# (frontend marketing, llms.txt, agent card, methodology pages) before a
# real customer or auditor finds it.
#
# This intentionally runs against `main` only — drift on a feature branch
# is fine; drift on what's deployed is not. If a check fails, an issue is
# auto-opened and Petter is notified via the existing alert channel.

on:
  schedule:
    # Monday 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Minimal token scope: the job now carries a prod DB credential, so the
    # GITHUB_TOKEN is pinned to exactly what the issue-opening step needs.
    permissions:
      contents: read
      issues: write
    env:
      AUDIT_HMAC_SECRET: ci-placeholder-secret-at-least-32-chars-long-0123456789
      FRONTEND_URL: https://strale.dev
      # The cron runs without a strale-frontend checkout. Drift checks
      # that point at frontend paths skip cleanly when the path is missing.
      STRALE_FRONTEND_PATH: /tmp/__missing__
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm --workspace=packages/mcp-server run build

      # Each sweep is non-fatal individually so we collect ALL findings
      # in one run rather than failing on the first. Aggregate at the end.
      - id: manifest-drift
        run: |
          set +e
          set -o pipefail
          cd apps/api && npx tsx scripts/sweep-manifest-drift.ts 2>&1 | tee /tmp/manifest-drift.txt
          echo "exit=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - id: facts-drift
        run: |
          set +e
          set -o pipefail
          cd apps/api && npx tsx scripts/check-platform-facts-drift.ts --strict 2>&1 | tee /tmp/facts-drift.txt
          echo "exit=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - id: fetch-timeout
        run: |
          set +e
          set -o pipefail
          node apps/api/scripts/check-fetch-timeout-coverage.mjs 2>&1 | tee /tmp/fetch-timeout.txt
          echo "exit=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      # Vendor Roster ↔ Decisions DB drift. Flags vendor rows whose
      # Last evaluated date is older than a Decision in the window
      # mentioning that vendor — surfaces the 2026-04-30 failure mode
      # where DEC-20260429-A deferred OpenSanctions but the Roster row
      # stayed at Self-built for an extra day.
      - id: vendor-roster
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          set +e
          set -o pipefail
          cd apps/api && npx tsx scripts/check-vendor-roster-drift.ts --strict 2>&1 | tee /tmp/vendor-roster.txt
          echo "exit=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      # Cert-audit Layer 2: AuditRecord type-shape check. Needs the
      # strale-frontend repo checked out alongside; without it the
      # script skips cleanly. We checkout the sibling repo here so the
      # weekly run actually fires the check.
      - uses: actions/checkout@v4
        with:
          repository: strale-io/strale-frontend
          path: strale-frontend
          # strale-frontend is PRIVATE — the default GITHUB_TOKEN cannot see
          # it, and until 2026-08-18 this step silently 404'd on every run
          # (masked by continue-on-error), so the AuditRecord shape check
          # below had NEVER actually validated real frontend content.
          # FRONTEND_READ_PAT is a founder-created fine-grained PAT,
          # read-only Contents on strale-io/strale-frontend only.
          token: ${{ secrets.FRONTEND_READ_PAT }}
        continue-on-error: true

      - id: audit-record-shape
        env:
          STRALE_FRONTEND_PATH: ${{ github.workspace }}/strale-frontend
        run: |
          set +e
          set -o pipefail
          node apps/api/scripts/check-shape-contracts.mjs 2>&1 | tee /tmp/audit-record-shape.txt
          echo "exit=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      # Phase 2 T2.1 weekly backup (2026-08-18): frontend-typecheck.yml
      # covers PRs that touch the backend surfaces likely to break the
      # frontend's types, but a frontend-side-only change (e.g. someone
      # edits strale-frontend directly, or the shared shape genuinely
      # drifts without a matching backend PR landing here) wouldn't trip
      # that gate. This weekly run is the backstop, same reasoning as the
      # AuditRecord shape check above. Uses the strale-frontend checkout
      # from the step above.
      - id: frontend-typecheck
        run: |
          set +e
          set -o pipefail
          (cd strale-frontend && npm ci && npx tsc -b --force) 2>&1 | tee /tmp/frontend-typecheck.txt
          echo "exit=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      # TOAST-readability scan over compliance-critical JSONB columns.
      # Added after the 2026-08-12 incident: a lost TOAST chunk in
      # transactions.audit_trail sat undetected for four months. A weekly
      # full-detoast pass bounds detection latency to days.
      - id: toast-readability
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          set -o pipefail
          node apps/api/scripts/check-audit-trail-readability.mjs 2>&1 | tee /tmp/toast-readability.txt
          echo "exit=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      # capabilities.output_schema corruption scan (Phase 2 T2.2, wired
      # 2026-08-17 — script existed since before but was never wired
      # anywhere). A char-indexed output_schema ({"0":"{","1":"\"",...})
      # means a JS string got JSON.stringify'd twice on some write path;
      # the column looks populated but is useless to every reader. Needs
      # DATABASE_URL, so this belongs here rather than ci.yml.
      - id: output-schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          set -o pipefail
          cd apps/api && npx tsx scripts/check-output-schema.ts 2>&1 | tee /tmp/output-schema.txt
          echo "exit=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      # Aggregate report. Step fails (and triggers issue creation) if
      # ANY upstream sweep reported drift.
      - id: aggregate
        run: |
          {
            echo "# Weekly drift sweep — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "## Manifest ↔ DB drift"
            echo '```'
            cat /tmp/manifest-drift.txt
            echo '```'
            echo ""
            echo "## Platform-facts drift (vendors, counts, retention)"
            echo '```'
            cat /tmp/facts-drift.txt
            echo '```'
            echo ""
            echo "## fetch() AbortSignal coverage"
            echo '```'
            cat /tmp/fetch-timeout.txt
            echo '```'
            echo ""
            echo "## Vendor Roster ↔ Decisions drift"
            echo '```'
            cat /tmp/vendor-roster.txt
            echo '```'
            echo ""
            echo "## AuditRecord shape (backend ↔ frontend)"
            echo '```'
            cat /tmp/audit-record-shape.txt
            echo '```'
            echo ""
            echo "## Frontend typecheck (strale-frontend, tsc -b)"
            echo '```'
            cat /tmp/frontend-typecheck.txt
            echo '```'
            echo ""
            echo "## TOAST readability (audit/compliance JSONB columns)"
            echo '```'
            cat /tmp/toast-readability.txt
            echo '```'
            echo ""
            echo "## output_schema corruption (char-indexed JSONB)"
            echo '```'
            cat /tmp/output-schema.txt
            echo '```'
          } > /tmp/report.md
          cat /tmp/report.md

          # Aggregate exit: nonzero if any sweep failed.
          MD=${{ steps.manifest-drift.outputs.exit }}
          FD=${{ steps.facts-drift.outputs.exit }}
          FT=${{ steps.fetch-timeout.outputs.exit }}
          VR=${{ steps.vendor-roster.outputs.exit }}
          AR=${{ steps.audit-record-shape.outputs.exit }}
          FTC=${{ steps.frontend-typecheck.outputs.exit }}
          TR=${{ steps.toast-readability.outputs.exit }}
          OS=${{ steps.output-schema.outputs.exit }}
          if [ "$MD" != "0" ] || [ "$FD" != "0" ] || [ "$FT" != "0" ] || [ "$VR" != "0" ] || [ "$AR" != "0" ] || [ "$FTC" != "0" ] || [ "$TR" != "0" ] || [ "$OS" != "0" ]; then
            echo "::warning::One or more drift sweeps reported findings — see report"
            exit 1
          fi

      # If aggregate failed, open / refresh a tracking issue so the drift
      # has a home. Issue title is stable so re-runs append, not duplicate.
      - name: Open drift-tracking issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/report.md', 'utf8');
            const title = 'Weekly drift sweep findings';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift-sweep',
            });
            const found = existing.find((i) => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['drift-sweep'],
              });
            }
