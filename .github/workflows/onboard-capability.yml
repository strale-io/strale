name: Onboard capability
on:
  workflow_dispatch:
    inputs:
      slug:
        description: Slugs separated by commas (max 50; limitations max 1000 or all)
        required: true
        type: string
      mode:
        description: Create, backfill, or sync only limitation text
        type: choice
        options: [onboard, backfill, limitations]
        default: onboard
      discover:
        description: Discover fixtures from live output (ignored in limitations mode)
        type: boolean
        default: true
      fix:
        description: Correct high-confidence fixture mismatches (ignored in limitations mode)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-onboarding
  cancel-in-progress: false
jobs:
  onboard:
    if: github.ref == 'refs/heads/main'
    environment: production-onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run onboarding sequentially
        env:
          ONBOARDING_RUN_SECRET: ${{ secrets.ONBOARDING_RUN_SECRET }}
          STRALE_API_URL: ${{ vars.STRALE_API_URL || 'https://api.strale.io' }}
          INPUT_SLUGS: ${{ inputs.slug }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_DISCOVER: ${{ inputs.discover }}
          INPUT_FIX: ${{ inputs.fix }}
        run: node .github/scripts/onboard-capability.mjs
      - name: Save full results and discovered manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onboarding-results
          path: onboarding-results/
          if-no-files-found: warn
          retention-days: 14
